<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>작업환경측정 계획서</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    @media print {
      @page { size: landscape; margin: 8mm; }
      body { background-color: white !important; font-size: 9px !important; }
      .print\:hidden { display: none !important; }
      .print\:block { display: block !important; }
      .print\:bg-transparent { background-color: transparent !important; }
      .print\:border-black { border-color: black !important; }
      .print\:border-none { border: none !important; }
      
      input { color: black !important; -webkit-print-color-adjust: exact; padding: 0 !important; height: auto !important; line-height: 1.1 !important; font-size: 9px !important; }
      input::placeholder { color: transparent !important; }
      table { border-collapse: collapse; width: 100% !important; min-width: 0 !important; }
      
      th, td { font-size: 9px !important; padding: 2px 4px !important; }
      .nowrap-col { white-space: nowrap !important; word-break: keep-all !important; }
      
      .page-break-before {
        page-break-before: always !important;
        break-before: page !important;
      }
    }
    
    .nowrap-col {
      white-space: nowrap !important;
      word-break: keep-all !important;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen p-4 md:p-8">
  
  <div class="max-w-[1450px] mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200 print:shadow-none print:border-none">
    
    <div class="bg-slate-800 p-6 flex justify-between items-center text-white print:bg-white print:text-black print:border-b print:border-black print:p-2 print:mb-4">
      <div class="flex items-center gap-3">
        <svg class="w-8 h-8 print:hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <h1 class="text-2xl font-bold">작업환경측정 계획서</h1>
      </div>
      <!-- 상단 액션 버튼 그룹 -->
      <div class="flex flex-wrap items-center justify-end gap-2 print:hidden">
        <button onclick="exportToExcel()" class="flex items-center gap-1 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg transition-colors text-sm shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          엑셀 저장
        </button>
        <button onclick="saveData()" class="flex items-center gap-1 bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg transition-colors text-sm shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
          저장
        </button>
        <label class="flex items-center gap-1 bg-fuchsia-600 hover:bg-fuchsia-700 text-white px-3 py-2 rounded-lg transition-colors text-sm shadow-sm cursor-pointer mb-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
          불러오기
          <input type="file" accept=".json" class="hidden" onchange="loadData(event)">
        </label>
        <button id="copyBtn" onclick="copyTableToClipboard()" class="flex items-center gap-1 bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg transition-colors text-sm shadow-sm">
          <svg id="copyIconDefault" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <span id="copyBtnText">현재 표 데이터 복사</span>
        </button>
        <button onclick="window.print()" class="flex items-center gap-1 bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg transition-colors text-sm shadow-md border border-blue-800">
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
          <span>전체 인쇄 / PDF 저장</span>
        </button>
      </div>
    </div>

    <div class="p-6 md:p-8 space-y-6 print:p-0 print:space-y-0">
      
      <section class="bg-gray-50 p-5 rounded-lg border border-gray-200 print:hidden">
        <h2 class="text-base font-semibold text-gray-800 mb-3 border-b pb-2">사업장 기본 정보</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">사업장명</label>
            <input type="text" id="companyName" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="예) (주)한국산업" />
          </div>
        </div>
      </section>

      <section class="bg-blue-50 p-5 rounded-lg border border-blue-100 print:hidden">
        <div class="flex items-center gap-2 mb-3">
          <h2 class="text-base font-semibold text-blue-800">구글 스프레드시트 데이터 연동</h2>
          <span class="text-xs bg-blue-200 text-blue-800 px-2 py-1 rounded-full font-medium">소음시트는 근로자수 D열 기준 산정</span>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">'소음제외' 시트 URL</label>
            <input type="text" id="excludeNoiseUrl" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white" placeholder="https://docs.google.com/spreadsheets/d/..." />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">'소음' 시트 URL (제외 시트에 없는 경우만 적용)</label>
            <input type="text" id="noiseUrl" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white" placeholder="https://docs.google.com/spreadsheets/d/..." />
          </div>
        </div>
        <div class="flex items-center gap-4">
          <button id="syncBtn" onclick="handleSyncSheets()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition-colors font-medium text-sm shadow-sm disabled:bg-blue-300">
            데이터 연동하기
          </button>
          <span id="syncMessage" class="text-sm font-medium text-blue-600"></span>
        </div>
      </section>

      <section class="bg-amber-50 p-4 rounded-lg border border-amber-200 print:hidden flex flex-col lg:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2">
          <h2 class="text-base font-bold text-amber-800 flex items-center gap-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            측정 일차 분리 관리
          </h2>
          <span class="text-xs bg-amber-200 text-amber-900 px-2 py-1 rounded font-medium hidden md:inline-block">기본 1일차 측정 ➔ 부서별로 2~10일차로 이동</span>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <select id="moveTargetUnit" onchange="updateMoveDeptDropdown()" class="border border-gray-300 rounded p-1.5 text-sm outline-none focus:ring-2 focus:ring-amber-500 min-w-[140px] max-w-[180px]">
            <option value="">단위사업체 선택</option>
          </select>
          <select id="moveTargetDept" class="border border-gray-300 rounded p-1.5 text-sm outline-none focus:ring-2 focus:ring-amber-500 min-w-[140px] max-w-[180px]">
            <option value="">부서명 선택</option>
          </select>
          <span class="text-gray-400 font-bold px-1">➔</span>
          <select id="moveTargetDay" class="border border-gray-300 rounded p-1.5 text-sm outline-none focus:ring-2 focus:ring-amber-500 font-bold text-amber-700">
            <option value="1">1일차</option><option value="2">2일차</option><option value="3">3일차</option><option value="4">4일차</option><option value="5">5일차</option>
            <option value="6">6일차</option><option value="7">7일차</option><option value="8">8일차</option><option value="9">9일차</option><option value="10">10일차</option>
          </select>
          <button onclick="moveDepartmentDay()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-1.5 rounded font-bold text-sm shadow-sm transition-colors whitespace-nowrap">
            이동 실행
          </button>
        </div>
      </section>

      <section id="tabContainerSection" class="hidden print:hidden">
        <!-- 일차(Day) 탭 -->
        <div class="flex items-end border-b-2 border-amber-500 mb-3 gap-2">
            <div class="bg-amber-500 text-white px-3 py-1.5 text-sm font-bold rounded-tl-lg rounded-tr-lg">일자 선택</div>
            <div id="dayTabs" class="flex flex-wrap gap-1">
                <!-- JS 생성 -->
            </div>
        </div>
        <!-- 단위사업체(Unit) 탭 -->
        <div class="flex items-end border-b border-gray-300 pb-1 gap-2">
            <div class="text-indigo-600 px-3 py-1.5 text-sm font-bold bg-indigo-50 rounded-tl-lg rounded-tr-lg border border-b-0 border-indigo-200">사업체 선택</div>
            <div id="unitTabs" class="flex flex-wrap gap-1">
                <!-- JS 생성 -->
            </div>
        </div>
      </section>

      <!-- 통합된 전체 테이블 컨테이너 -->
      <div id="tables-container" class="space-y-8 print:space-y-6">
        <!-- JS 렌더링 영역 -->
      </div>
    </div>
  </div>

  <script>
    let appData = {
      currentDay: 1,
      currentUnit: '기본 사업체',
      units: {
        '기본 사업체': [
          {
            id: 1, day: 1, department: '', process: '', shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '', pageBreak: false, 
            harmfulFactors: [{ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false }]
          }
        ]
      }
    };

    let activeFocusId = null;
    let selectionStart = null;
    let selectionEnd = null;

    function saveFocus() {
      const active = document.activeElement;
      if (active && active.dataset.focusId) {
        activeFocusId = active.dataset.focusId;
        selectionStart = active.selectionStart;
        selectionEnd = active.selectionEnd;
      } else {
        activeFocusId = null;
      }
    }

    function restoreFocus() {
      if (activeFocusId) {
        const el = document.querySelector(`[data-focus-id="${activeFocusId}"]`);
        if (el) {
          el.focus();
          try {
            if (el.type === 'text' || el.type === 'number') {
              el.setSelectionRange(selectionStart, selectionEnd);
            }
          } catch(e) {}
        }
      }
    }

    function calculateSpansForWorkers(workers) {
      if (!workers) return [];
      const groupFields = ['department', 'process', 'shiftSystem', 'workerCount', 'exposureCycle', 'measurementCount'];
      const spans = new Array(workers.length).fill(1);
      for (let i = 0; i < workers.length; i++) {
        if (spans[i] === 0) continue;
        let count = 1;
        for (let j = i + 1; j < workers.length; j++) {
          const isSame = groupFields.every(field => workers[i][field] === workers[j][field]);
          if (isSame) { count++; spans[j] = 0; } 
          else break;
        }
        spans[i] = count;
      }
      return spans;
    }

    function updateWorker(id, field, value) {
      const currentWorkers = appData.units[appData.currentUnit];
      appData.units[appData.currentUnit] = currentWorkers.map(w => w.id === id ? { ...w, [field]: value } : w);
    }

    function updateGroupField(unitName, day, filterIndex, rowSpan, field, value) {
      const currentWorkers = appData.units[unitName].filter(w => (w.day || 1) === day);
      for (let i = filterIndex; i < filterIndex + rowSpan; i++) {
        const targetId = currentWorkers[i].id;
        const realWorker = appData.units[unitName].find(w => w.id === targetId);
        if(realWorker) realWorker[field] = value;
      }
    }

    function updateFactor(workerId, factorIndex, field, value) {
      const currentWorkers = appData.units[appData.currentUnit];
      appData.units[appData.currentUnit] = currentWorkers.map(worker => {
        if (worker.id === workerId) {
          const newFactors = [...worker.harmfulFactors];
          newFactors[factorIndex][field] = value;
          return { ...worker, harmfulFactors: newFactors };
        }
        return worker;
      });
    }
    
    function toggleAdjust(workerId, factorIndex) {
      const currentWorkers = appData.units[appData.currentUnit];
      appData.units[appData.currentUnit] = currentWorkers.map(worker => {
        if (worker.id === workerId) {
          const newFactors = [...worker.harmfulFactors];
          newFactors[factorIndex].isAdjusted = !newFactors[factorIndex].isAdjusted;
          return { ...worker, harmfulFactors: newFactors };
        }
        return worker;
      });
      reRender();
    }

    function addWorker() {
      const currentWorkers = appData.units[appData.currentUnit];
      const newId = currentWorkers.length > 0 ? Math.max(...currentWorkers.map(w => w.id)) + 1 : 1;
      currentWorkers.push({
        id: newId, day: appData.currentDay, department: '', process: '', shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '', pageBreak: false,
        harmfulFactors: [{ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false }]
      });
      reRender();
    }

    function removeWorker(id) {
      let currentWorkers = appData.units[appData.currentUnit];
      currentWorkers = currentWorkers.filter(w => w.id !== id);
      appData.units[appData.currentUnit] = currentWorkers;
      if (currentWorkers.length === 0) addWorker();
      else reRender();
    }

    function duplicateWorker(id) {
      const currentWorkers = appData.units[appData.currentUnit];
      const index = currentWorkers.findIndex(w => w.id === id);
      if (index === -1) return;
      const workerToCopy = currentWorkers[index];
      const newId = currentWorkers.length > 0 ? Math.max(...currentWorkers.map(w => w.id)) + 1 : 1;
      const clonedWorker = {
        ...workerToCopy,
        id: newId,
        day: workerToCopy.day || 1,
        pageBreak: false,
        harmfulFactors: workerToCopy.harmfulFactors.map(factor => ({ ...factor }))
      };
      currentWorkers.splice(index + 1, 0, clonedWorker);
      reRender();
    }

    function togglePageBreak(id) {
      const currentWorkers = appData.units[appData.currentUnit];
      appData.units[appData.currentUnit] = currentWorkers.map(w => w.id === id ? { ...w, pageBreak: !w.pageBreak } : w);
      reRender();
    }

    function addFactor(workerId) {
      const currentWorkers = appData.units[appData.currentUnit];
      appData.units[appData.currentUnit] = currentWorkers.map(worker => {
        if (worker.id === workerId) {
          return { ...worker, harmfulFactors: [...worker.harmfulFactors, { name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false }] };
        }
        return worker;
      });
      reRender();
    }

    function removeFactor(workerId, factorIndex) {
      const currentWorkers = appData.units[appData.currentUnit];
      appData.units[appData.currentUnit] = currentWorkers.map(worker => {
        if (worker.id === workerId) {
          const newFactors = worker.harmfulFactors.filter((_, idx) => idx !== factorIndex);
          return {
            ...worker,
            harmfulFactors: newFactors.length ? newFactors : [{ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false }]
          };
        }
        return worker;
      });
      reRender();
    }

    function getActiveDays() {
        let activeDays = new Set();
        Object.values(appData.units).forEach(workers => {
            workers.forEach(w => activeDays.add(w.day || 1));
        });
        if(activeDays.size === 0) activeDays.add(1);
        return Array.from(activeDays).sort((a,b) => a - b);
    }

    function updateDayManageDropdowns() {
        const unitSelect = document.getElementById('moveTargetUnit');
        const deptSelect = document.getElementById('moveTargetDept');
        if(!unitSelect || !deptSelect) return;

        const currentUnits = Object.keys(appData.units);
        const prevUnit = unitSelect.value;
        const prevDept = deptSelect.value;

        let unitOptions = '<option value="">단위사업체 선택</option>';
        currentUnits.forEach(u => unitOptions += `<option value="${u}">${u}</option>`);
        unitSelect.innerHTML = unitOptions;
        if (currentUnits.includes(prevUnit)) unitSelect.value = prevUnit;

        let deptOptions = '<option value="">부서명 선택</option>';
        if (unitSelect.value && appData.units[unitSelect.value]) {
            deptOptions += '<option value="ALL" class="font-bold text-blue-600">✨ 단위사업체 전체 이동</option>';
            const depts = new Set();
            appData.units[unitSelect.value].forEach(w => { if(w.department) depts.add(w.department); });
            Array.from(depts).sort().forEach(d => deptOptions += `<option value="${d}">${d}</option>`);
            deptSelect.innerHTML = deptOptions;
            if(prevDept === 'ALL' || Array.from(depts).includes(prevDept)) deptSelect.value = prevDept;
        }
    }

    function updateMoveDeptDropdown() {
        updateDayManageDropdowns();
    }

    function moveDepartmentDay() {
        const unit = document.getElementById('moveTargetUnit').value;
        const dept = document.getElementById('moveTargetDept').value;
        const targetDay = parseInt(document.getElementById('moveTargetDay').value);

        if(!unit) return alert("단위사업체를 선택하세요.");
        if(!dept) return alert("이동할 부서명을 선택하거나 '단위사업체 전체 이동'을 선택하세요.");
        if(!targetDay) return;

        let movedCount = 0;
        appData.units[unit].forEach(w => {
            if(dept === 'ALL' || w.department === dept) { 
                w.day = targetDay; 
                movedCount++; 
            }
        });

        if(movedCount > 0) {
            alert(`해당 데이터(${movedCount}건)가 ${targetDay}일차로 성공적으로 이동되었습니다.`);
            appData.currentDay = targetDay;
            appData.currentUnit = unit;
            reRender();
        } else {
            alert("해당 데이터를 찾을 수 없습니다.");
        }
    }

    function renderDayTabs() {
        const tabsContainer = document.getElementById('dayTabs');
        if(!tabsContainer) return;
        tabsContainer.innerHTML = '';
        
        const sortedDays = getActiveDays();
        
        // Ensure currentDay is active
        if(!sortedDays.includes(appData.currentDay)) appData.currentDay = sortedDays[0] || 1;

        sortedDays.forEach(day => {
            const btn = document.createElement('button');
            const isActive = appData.currentDay === day;
            btn.className = `px-4 py-1.5 text-sm font-bold rounded-t-lg transition-colors border-t border-l border-r ${isActive ? 'bg-white text-amber-600 border-amber-200 border-b-white translate-y-[1px]' : 'bg-amber-100/50 text-amber-700/60 border-amber-200/50 hover:bg-amber-100'}`;
            btn.innerText = `${day}일차`;
            btn.onclick = () => {
                appData.currentDay = day;
                let validUnits = getValidUnitsForDay(day);
                if(validUnits.length > 0 && !validUnits.includes(appData.currentUnit)) appData.currentUnit = validUnits[0];
                reRender();
            };
            tabsContainer.appendChild(btn);
        });
    }

    function getValidUnitsForDay(day) {
        let valid = [];
        Object.keys(appData.units).forEach(unit => {
            if(appData.units[unit].some(w => (w.day || 1) === day)) valid.push(unit);
        });
        return valid;
    }

    function renderUnitTabs() {
        const tabsContainer = document.getElementById('unitTabs');
        if(!tabsContainer) return;
        tabsContainer.innerHTML = '';

        let validUnits = getValidUnitsForDay(appData.currentDay);

        if(validUnits.length === 0) {
            tabsContainer.innerHTML = `<span class="text-sm text-gray-500 py-1.5 px-2">배정된 사업체가 없습니다.</span>`;
            return;
        }

        validUnits.forEach(unitName => {
            const btn = document.createElement('button');
            const isActive = appData.currentUnit === unitName;
            btn.className = `px-4 py-1.5 text-sm font-bold rounded-t-lg transition-colors border-t border-l border-r ${isActive ? 'bg-white text-indigo-600 border-indigo-200 border-b-white translate-y-[1px]' : 'bg-gray-100 text-gray-500 border-gray-200 hover:bg-gray-50'}`;
            btn.innerText = unitName;
            btn.onclick = () => { appData.currentUnit = unitName; reRender(); };
            tabsContainer.appendChild(btn);
        });
    }

    function renderTables() {
      const container = document.getElementById('tables-container');
      let html = '';
      
      const allDays = getActiveDays();

    function reRender() {
      saveFocus();
      renderTables();
      restoreFocus();
    }

    async function copyTableToClipboard() {
      try {
        let tsvData = "No.\t부서명\t공정명\t교대제\t근로자수\t노출주기\t측정건수\t유해인자\t근로자명\tA\tP\tL\tN\t비고\n";
        
        const currentWorkers = (appData.units[appData.currentUnit]||[]).filter(w => (w.day || 1) === appData.currentDay);
        if(currentWorkers) {
            currentWorkers.forEach((worker, index) => {
              worker.harmfulFactors.forEach((factor, fIndex) => {
                const isFirst = fIndex === 0;
                let hazardText = factor.name || '';
                if (factor.isAdjusted) hazardText = "[횟수조정] " + hazardText;
                const isNoiseFactor = factor.name.trim().includes('소음');
                const nVal = (!factor.isAdjusted && isNoiseFactor) ? 'V' : (factor.n || '');
                
                tsvData += `${isFirst ? index + 1 : ''}\t${isFirst ? worker.department || '' : ''}\t${isFirst ? worker.process || '' : ''}\t${isFirst ? worker.shiftSystem || '' : ''}\t${isFirst ? worker.workerCount || '' : ''}\t${isFirst ? worker.exposureCycle || '' : ''}\t${isFirst ? worker.measurementCount || '' : ''}\t${hazardText}\t${isFirst ? worker.name || '' : ''}\t${factor.a || ''}\t${factor.p || ''}\t${factor.l || ''}\t${nVal}\t${factor.remark || ''}\n`;
              });
            });
        }

        await navigator.clipboard.writeText(tsvData);
        
        document.getElementById('copyIconDefault').classList.add('hidden');
        document.getElementById('copyIconCheck').classList.remove('hidden');
        document.getElementById('copyBtnText').innerText = '복사 완료!';
        
        setTimeout(() => {
          document.getElementById('copyIconDefault').classList.remove('hidden');
          document.getElementById('copyIconCheck').classList.add('hidden');
          document.getElementById('copyBtnText').innerText = '현재 표 데이터 복사';
        }, 2000);
      } catch (err) {
        alert('복사에 실패했습니다.');
      }
    }

    function exportToExcel() {
      if (typeof XLSX === 'undefined') {
        alert('엑셀 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
        return;
      }
      
      const wb = XLSX.utils.book_new();
      const allDays = getActiveDays();
      const unitNames = Object.keys(appData.units);
      let sheetCount = 0;
      
      allDays.forEach(day => {
          unitNames.forEach(unitName => {
            const currentWorkers = appData.units[unitName].filter(w => (w.day||1) === day);
            if(currentWorkers.length === 0) return;
            
            let wsData = [];
            wsData.push(["No.", "부서명", "공정명", "교대제", "근로자수", "노출주기", "측정건수", "유해인자", "근로자명", "A", "P", "L", "N", "비고"]);
            
            currentWorkers.forEach((worker, index) => {
              worker.harmfulFactors.forEach((factor, fIndex) => {
                const isFirst = fIndex === 0;
                let hazardText = factor.name || '';
                if (factor.isAdjusted) hazardText = "[횟수조정] " + hazardText;
                const isNoiseFactor = factor.name.trim().includes('소음');
                const nVal = (!factor.isAdjusted && isNoiseFactor) ? 'V' : (factor.n || '');
                
                wsData.push([
                  isFirst ? index + 1 : '',
                  isFirst ? worker.department || '' : '',
                  isFirst ? worker.process || '' : '',
                  isFirst ? worker.shiftSystem || '' : '',
                  isFirst ? worker.workerCount || '' : '',
                  isFirst ? worker.exposureCycle || '' : '',
                  isFirst ? worker.measurementCount || '' : '',
                  hazardText,
                  isFirst ? worker.name || '' : '',
                  factor.a || '',
                  factor.p || '',
                  factor.l || '',
                  nVal,
                  factor.remark || ''
                ]);
              });
            });

            const ws = XLSX.utils.aoa_to_sheet(wsData);
            let safeSheetName = `${day}일_${unitName}`.replace(/[\\/?*[\]]/g, '').substring(0, 31);
            XLSX.utils.book_append_sheet(wb, ws, safeSheetName);
            sheetCount++;
          });
      });
      
      if(sheetCount === 0) { alert('저장할 데이터가 없습니다.'); return; }
      const companyName = document.getElementById('companyName').value.trim() || '작업환경측정_계획서';
      XLSX.writeFile(wb, `${companyName}.xlsx`);
    }

    function saveData() {
      appData.companyName = document.getElementById('companyName').value;
      const dataStr = JSON.stringify(appData, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      const companyName = appData.companyName.trim() || '작업환경측정_백업데이터';
      a.download = `${companyName}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function loadData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const loadedData = JSON.parse(e.target.result);
          if (loadedData && loadedData.units) {
            
            // 데이터 무결성 보정 (day 속성 부여)
            Object.keys(loadedData.units).forEach(u => {
                loadedData.units[u].forEach(w => {
                    if(!w.day) w.day = 1;
                });
            });
            loadedData.currentDay = loadedData.currentDay || 1;

            appData = loadedData;
            
            if (appData.companyName) {
              document.getElementById('companyName').value = appData.companyName;
            }
            
            const unitNames = Object.keys(appData.units);
            if (unitNames.length > 0) {
              document.getElementById('tabContainerSection').classList.remove('hidden');
            }
            reRender();
            alert('데이터를 성공적으로 불러왔습니다.');
          } else {
            alert('올바른 형식의 백업 데이터 파일이 아닙니다.');
          }
        } catch (err) {
          alert('파일을 읽는 중 오류가 발생했습니다.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function parseCSV(text) {
      const result = [];
      let row = [];
      let cell = '';
      let insideQuote = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (insideQuote) {
          if (char === '"' && text[i + 1] === '"') { cell += '"'; i++; }
          else if (char === '"') { insideQuote = false; }
          else { cell += char; }
        } else {
          if (char === '"') { insideQuote = true; }
          else if (char === ',') { row.push(cell); cell = ''; }
          else if (char === '\n' || char === '\r') {
            row.push(cell); result.push(row); row = []; cell = '';
            if (char === '\r' && text[i + 1] === '\n') i++;
          }
          else { cell += char; }
        }
      }
      if (cell || row.length > 0) { row.push(cell); result.push(row); }
      return result;
    }

    async function fetchSheetData(url) {
      if (!url.trim()) return null;
      try {
        const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
        if (!match) throw new Error("유효한 스프레드시트 주소가 아닙니다.");
        const exportUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv`;
        const response = await fetch(exportUrl);
        if (!response.ok) throw new Error("시트 접근 거부. 일반 액세스를 확인하세요.");
        const text = await response.text();
        return parseCSV(text);
      } catch (error) { throw error; }
    }

    async function handleSyncSheets() {
      const excludeUrl = document.getElementById('excludeNoiseUrl').value;
      const noiseUrl = document.getElementById('noiseUrl').value;
      const syncBtn = document.getElementById('syncBtn');
      const msg = document.getElementById('syncMessage');

      if (!excludeUrl && !noiseUrl) {
        msg.className = 'text-sm font-medium text-red-600';
        msg.innerText = 'URL을 입력해주세요.';
        return;
      }

      syncBtn.disabled = true;
      syncBtn.innerText = '불러오는 중...';
      msg.innerText = '';

      try {
        let mergedGroupsByUnit = {}; 
        let excludeKeys = new Set();
        let lastKnownUnit = '기본 사업체';

        const processRows = (rows, isNoiseSheet = false) => {
          if (!rows || rows.length < 2) return;
          let lastDept = '', lastProcess = '';

          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length < 4) continue;
            
            let unitName = row[0]?.trim() || '';
            if (unitName !== '') lastKnownUnit = unitName;
            else unitName = lastKnownUnit;
            
            let dept = row[1]?.trim() || '';
            let process = row[2]?.trim() || '';

            if (dept === '' && process === '') { dept = lastDept; process = lastProcess; } 
            else { lastDept = dept; lastProcess = process; }

            if (!dept && !process) continue;

            const key = `${unitName}|${dept}|${process}`;
            if (!mergedGroupsByUnit[unitName]) mergedGroupsByUnit[unitName] = {};

            if (!isNoiseSheet) excludeKeys.add(key);

            if (!mergedGroupsByUnit[unitName][key]) {
              mergedGroupsByUnit[unitName][key] = {
                unit: unitName, department: dept, process: process, shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '', pageBreak: false,
                factorGroups: [], hasPValue: false
              };
            }

            const removeDecimal = (val) => val ? val.replace(/(\d+)\.\d+/g, '$1') : '';
            const mergedGroup = mergedGroupsByUnit[unitName][key];

            if (!isNoiseSheet) {
              let factor = row[3]?.trim() || '';
              let workerCount = removeDecimal(row[4]?.trim());
              let shift = row[5]?.trim() || '';
              let cycle = row[6]?.trim() || '';
              let pValue = row.length > 15 ? row[15]?.trim() || '' : '';

              if (!mergedGroup.shiftSystem && shift) mergedGroup.shiftSystem = shift;
              if (!mergedGroup.workerCount && workerCount) mergedGroup.workerCount = workerCount;
              if (!mergedGroup.exposureCycle && cycle) mergedGroup.exposureCycle = cycle;

              if (pValue !== '') {
                mergedGroup.hasPValue = true;
                mergedGroup.factorGroups.push(new Set());
              }
              if (factor !== '') {
                if (mergedGroup.factorGroups.length === 0) mergedGroup.factorGroups.push(new Set());
                mergedGroup.factorGroups[mergedGroup.factorGroups.length - 1].add(factor);
              }
            } else {
              let isNewKey = !excludeKeys.has(key);
              if (isNewKey) {
                // "소음" 시트: D열(row[3])에서 근로자수 채택
                let workerCount = removeDecimal(row[3]?.trim());
                let shift = row[5]?.trim() || '';
                let cycle = row[6]?.trim() || '';

                if (shift) mergedGroup.shiftSystem = shift;
                if (workerCount) mergedGroup.workerCount = workerCount;
                if (cycle) mergedGroup.exposureCycle = cycle;
              }

              mergedGroup.hasPValue = true;
              const noiseSet = new Set();
              noiseSet.add('소음');
              mergedGroup.factorGroups.push(noiseSet);
            }
          }
        };

        if (excludeUrl) {
          const rows1 = await fetchSheetData(excludeUrl);
          processRows(rows1, false);
        }
        if (noiseUrl) {
          const rows2 = await fetchSheetData(noiseUrl);
          processRows(rows2, true);
        }

        let totalExtracted = 0;
        let newAppUnits = {};

        for (const unitName in mergedGroupsByUnit) {
            const newWorkers = Object.values(mergedGroupsByUnit[unitName])
              .filter(group => group.hasPValue)
              .map((group) => {
                let parsedFactors = group.factorGroups
                  .map(set => Array.from(set).join(', '))
                  .filter(str => str !== '');

                let uniqueFactors = [...new Set(parsedFactors)];
                let formattedFactors = uniqueFactors.length > 0
                  ? uniqueFactors.map(f => ({ name: f, a: '', p: '', l: '', n: '', remark: '', isAdjusted: false }))
                  : [{ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false }];

                return {
                  id: Date.now() + Math.random(),
                  day: 1, // 최초 연동 시 모두 1일차 배정
                  department: group.department,
                  process: group.process,
                  shiftSystem: group.shiftSystem,
                  workerCount: group.workerCount,
                  exposureCycle: group.exposureCycle,
                  measurementCount: group.measurementCount,
                  name: group.name,
                  pageBreak: false,
                  harmfulFactors: formattedFactors
                };
              });
              
              if (newWorkers.length > 0) {
                  newAppUnits[unitName] = newWorkers;
                  totalExtracted += newWorkers.length;
              }
        }

        if (Object.keys(newAppUnits).length > 0) {
          appData.units = newAppUnits;
          appData.currentDay = 1;
          
          const firstUnit = Object.keys(newAppUnits)[0];
          appData.currentUnit = firstUnit;
          
          document.getElementById('tabContainerSection').classList.remove('hidden');

          msg.className = 'text-sm font-medium text-green-600';
          msg.innerText = `연동 완료: ${Object.keys(newAppUnits).length}개 단위사업체 추출 (기본 1일차 배정)`;
        } else {
          msg.className = 'text-sm font-medium text-red-600';
          msg.innerText = '조건에 맞는 데이터가 없습니다.';
        }
      } catch (error) {
        msg.className = 'text-sm font-medium text-red-600';
        msg.innerText = error.message;
      } finally {
        syncBtn.disabled = false;
        syncBtn.innerText = '데이터 연동하기';
        reRender();
      }
    }

    window.addEventListener('beforeprint', function() {
      reRender();
    });

    document.addEventListener('keydown', function(e) {
      const current = e.target;
      if (current.tagName !== 'INPUT' || !current.hasAttribute('data-focus-id')) return;

      const isUp = e.key === 'ArrowUp';
      const isDown = e.key === 'ArrowDown';
      const isLeft = e.key === 'ArrowLeft';
      const isRight = e.key === 'ArrowRight';

      if (!isUp && !isDown && !isLeft && !isRight) return;

      if (isLeft && current.selectionStart > 0) return;
      if (isRight && current.selectionEnd < current.value.length) return;

      e.preventDefault();

      const currentRect = current.getBoundingClientRect();
      const inputs = Array.from(document.querySelectorAll('#tables-container .block input:not([type="hidden"]):not([readonly])'));

      let bestMatch = null;
      let minDistance = Infinity;

      const cx = currentRect.left + currentRect.width / 2;
      const cy = currentRect.top + currentRect.height / 2;

      inputs.forEach(input => {
        if (input === current) return;
        const rect = input.getBoundingClientRect();
        const ix = rect.left + rect.width / 2;
        const iy = rect.top + rect.height / 2;

        let isEligible = false;
        let distance = Infinity;

        const xOverlap = Math.max(0, Math.min(currentRect.right, rect.right) - Math.max(currentRect.left, rect.left));
        const yOverlap = Math.max(0, Math.min(currentRect.bottom, rect.bottom) - Math.max(currentRect.top, rect.top));

        if (isUp && iy < cy && xOverlap > 0) { isEligible = true; distance = cy - iy; }
        else if (isDown && iy > cy && xOverlap > 0) { isEligible = true; distance = iy - cy; }
        else if (isLeft && ix < cx && yOverlap > 0) { isEligible = true; distance = cx - ix; }
        else if (isRight && ix > cx && yOverlap > 0) { isEligible = true; distance = ix - cx; }

        if (!isEligible) {
             if (isUp && rect.bottom <= currentRect.top + 5) {
                 isEligible = true;
                 distance = (currentRect.top - rect.bottom)*10 + Math.abs(cx - ix);
             } else if (isDown && rect.top >= currentRect.bottom - 5) {
                 isEligible = true;
                 distance = (rect.top - currentRect.bottom)*10 + Math.abs(cx - ix);
             } else if (isLeft && rect.right <= currentRect.left + 5) {
                 isEligible = true;
                 distance = (currentRect.left - rect.right)*10 + Math.abs(cy - iy);
             } else if (isRight && rect.left >= currentRect.right - 5) {
                 isEligible = true;
                 distance = (rect.left - currentRect.right)*10 + Math.abs(cy - iy);
             }
        }

        if (isEligible && distance < minDistance) {
          minDistance = distance;
          bestMatch = input;
        }
      });

      if (bestMatch) {
        bestMatch.focus();
        if (isLeft) bestMatch.setSelectionRange(bestMatch.value.length, bestMatch.value.length);
        else if (isRight) bestMatch.setSelectionRange(0, 0);
        else bestMatch.setSelectionRange(bestMatch.value.length, bestMatch.value.length);
      }
    });

    renderTables();
  </script>
