<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>작업환경측정 계획서</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      @page { size: landscape; margin: 10mm; }
      body { background-color: white !important; }
      
      /* 인쇄 시 불필요한 요소 숨김 처리 */
      .print\:hidden { display: none !important; }
      .print\:block { display: block !important; }
      
      /* 배경 및 테두리 인쇄용 설정 */
      .print\:bg-transparent { background-color: transparent !important; }
      .print\:border-black { border-color: black !important; border-width: 1px !important; }
      .print\:border-none { border: none !important; }
      
      /* 인쇄 시 폰트 크기 대폭 축소 및 패딩 최소화로 한 페이지 최대 수납 */
      * {
        font-size: 8.5px !important;
        line-height: 1.2 !important;
      }
      
      table { border-collapse: collapse; width: 100% !important; min-width: 0 !important; }
      th, td { padding: 1px 2px !important; }
      
      /* 입력창 텍스트 및 스크롤 고정 해제 */
      input { color: black !important; -webkit-print-color-adjust: exact; padding: 0 !important; background: transparent !important; }
      input::placeholder { color: transparent !important; }
      
      /* 열 너비 강제 조정 (비고 축소, 유해인자 최대 확장) */
      .col-factor { width: auto !important; flex: 1 1 auto !important; }
      .col-apln { width: 22px !important; flex: none !important; }
      .col-remark { width: 45px !important; flex: none !important; }
      
      /* 최소 높이 해제하여 공간 압축 */
      .min-h-\[44px\] { min-height: 0 !important; height: auto !important; }
      
      /* 강제 페이지 넘김 CSS */
      .page-break-before {
        page-break-before: always !important;
        break-before: page !important;
      }
      
      /* 가급적 한 행이 페이지 중간에 잘리지 않도록 보호 */
      tr { page-break-inside: avoid; }
    }
    
    /* Chrome, Safari, Edge, Opera에서 input number 화살표 숨기기 */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    
    /* 웹 화면에서의 기본 열 너비 설정 */
    .col-factor { width: 220px; flex-grow: 1; }
    .col-apln { width: 35px; flex-shrink: 0; }
    .col-remark { width: 80px; flex-shrink: 0; }
  </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen p-4 md:p-8">
  
  <div class="max-w-[1450px] mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200 print:shadow-none print:border-none print:max-w-full">
    
    <div class="bg-slate-800 p-6 flex flex-col md:flex-row justify-between items-center text-white print:bg-white print:text-black print:border-b print:border-black print:p-2 print:mb-2 gap-4">
      <div class="flex items-center gap-3 w-full md:w-auto justify-center md:justify-start">
        <svg class="w-8 h-8 print:hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <h1 class="text-2xl font-bold">작업환경측정 계획서</h1>
      </div>
      <div class="flex items-center gap-2 print:hidden flex-wrap justify-center">
        <!-- 엑셀 저장 버튼 추가 -->
        <button onclick="downloadExcel()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg transition-colors shadow-sm text-sm">
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          <span>엑셀 저장</span>
        </button>
        <button id="copyBtn" onclick="copyTableToClipboard()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg transition-colors shadow-sm text-sm">
          <svg id="copyIconDefault" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <svg id="copyIconCheck" class="w-4 h-4 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
          <span id="copyBtnText">복사</span>
        </button>
        <button onclick="window.print()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg transition-colors shadow-sm border border-blue-800 text-sm">
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
          <span>인쇄 / PDF</span>
        </button>
      </div>
    </div>

    <div class="p-4 md:p-6 space-y-6 print:p-0 print:space-y-0">
      
      <!-- 사업장 기본 정보 -->
      <section class="bg-gray-50 p-5 rounded-lg border border-gray-200 print:hidden">
        <h2 class="text-base font-semibold text-gray-800 mb-3 border-b pb-2">사업장 기본 정보</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">사업장명</label>
            <input type="text" id="companyName" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="예) (주)한국산업" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">대표자명</label>
            <input type="text" id="representative" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm" />
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-medium text-gray-700 mb-1">소재지 (주소)</label>
            <input type="text" id="address" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">예정 측정일자</label>
            <input type="date" id="measurementDate" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">측정 기관명</label>
            <input type="text" id="institution" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm" />
          </div>
        </div>
      </section>

      <!-- 구글 시트 연동 -->
      <section class="bg-blue-50 p-5 rounded-lg border border-blue-100 print:hidden">
        <div class="flex items-center gap-2 mb-2">
          <h2 class="text-base font-semibold text-blue-800">구글 스프레드시트 연동</h2>
        </div>
        <p class="text-xs text-blue-600 mb-3 bg-white p-2 rounded border border-blue-100 shadow-sm">
          <span class="font-bold text-red-500">* 중요:</span> 구글 시트 권한을 <strong>'링크가 있는 모든 사용자(뷰어)'</strong>로 변경해주세요.
        </p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">'소음제외' 시트 URL</label>
            <input type="text" id="excludeNoiseUrl" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white" placeholder="https://docs.google.com/spreadsheets/d/..." />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">'소음' 시트 URL</label>
            <input type="text" id="noiseUrl" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white" placeholder="https://docs.google.com/spreadsheets/d/..." />
          </div>
        </div>
        <div class="flex items-center gap-3">
          <button id="syncBtn" onclick="handleSyncSheets()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg transition-colors font-medium text-sm shadow-sm disabled:bg-blue-300">
            데이터 연동하기
          </button>
          <span id="syncMessage" class="text-xs font-medium text-blue-600"></span>
        </div>
      </section>

      <section>
        <div class="flex justify-between items-end mb-2 print:hidden">
          <h2 class="text-lg font-semibold text-gray-800">측정 대상 및 유해인자 목록</h2>
          <span class="text-xs text-gray-500">인쇄 시 사업장 정보는 숨겨지고 이 표만 출력됩니다.</span>
        </div>
        <div class="overflow-x-auto border border-gray-200 rounded-lg print:border-black print:border-none print:rounded-none">
          <table class="w-full text-left text-sm whitespace-nowrap min-w-[1300px] print:min-w-0 print:text-[8px]">
            <thead class="bg-gray-100 text-gray-700 uppercase font-semibold border-b border-gray-200 print:bg-gray-200 print:border-black print:text-black">
              <tr>
                <th class="px-2 py-2 w-10 text-center border-r print:border-black">No.</th>
                <th class="px-2 py-2 w-20 border-r print:border-black text-center">부서명</th>
                <th class="px-2 py-2 w-24 border-r print:border-black text-center">공정명</th>
                <th class="px-1 py-2 w-12 border-r print:border-black text-center">교대제</th>
                <th class="px-1 py-2 w-14 border-r print:border-black text-center">근로자수</th>
                <th class="px-1 py-2 w-14 border-r print:border-black text-center">노출주기</th>
                <th class="px-1 py-2 w-14 border-r print:border-black text-center">측정건수</th>
                <th class="px-2 py-2 w-20 border-r print:border-black text-center">근로자명</th>
                
                <!-- 유해인자 묶음 열 -->
                <th class="p-0 border-r print:border-black" colspan="6">
                  <div class="flex w-full h-full">
                    <div class="col-factor px-2 py-2 border-r border-gray-200 print:border-black text-center flex items-center justify-center">유해인자 (발생물질 등)</div>
                    <div class="col-apln px-1 py-2 border-r border-gray-200 print:border-black text-center flex items-center justify-center">A</div>
                    <div class="col-apln px-1 py-2 border-r border-gray-200 print:border-black text-center flex items-center justify-center">P</div>
                    <div class="col-apln px-1 py-2 border-r border-gray-200 print:border-black text-center flex items-center justify-center">L</div>
                    <div class="col-apln px-1 py-2 border-r border-gray-200 print:border-black text-center flex items-center justify-center">N</div>
                    <div class="col-remark px-1 py-2 text-center flex items-center justify-center">비고</div>
                  </div>
                </th>
                <th class="px-2 py-2 w-20 text-center print:hidden">관리</th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-gray-200 print:divide-black">
              <!-- JS 영역 -->
            </tbody>
          </table>
          <div class="p-2 bg-gray-50 border-t border-gray-200 print:hidden flex justify-center">
            <button onclick="addWorker()" class="flex items-center gap-1 text-sm font-medium text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 px-4 py-1.5 rounded shadow-sm transition-all">
              <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
              근로자 행 추가
            </button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    let workers = [
      {
        id: 1, department: '', process: '', shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '',
        pageBreak: false,
        harmfulFactors: [{ name: '', a: '', p: '', l: '', n: '', remark: '' }]
      }
    ];

    let activeFocusId = null;
    let selectionStart = null;
    let selectionEnd = null;

    function saveFocus() {
      const active = document.activeElement;
      if (active && active.dataset.focusId) {
        activeFocusId = active.dataset.focusId;
        selectionStart = active.selectionStart;
        selectionEnd = active.selectionEnd;
      } else {
        activeFocusId = null;
      }
    }

    function restoreFocus() {
      if (activeFocusId) {
        const el = document.querySelector(`[data-focus-id="${activeFocusId}"]`);
        if (el) {
          el.focus();
          try {
            if (el.type === 'text' || el.type === 'number') {
              el.setSelectionRange(selectionStart, selectionEnd);
            }
          } catch(e) {}
        }
      }
    }

    function calculateSpans() {
      const groupFields = ['department', 'process', 'shiftSystem', 'workerCount', 'exposureCycle', 'measurementCount'];
      const spans = new Array(workers.length).fill(1);
      for (let i = 0; i < workers.length; i++) {
        if (spans[i] === 0) continue;
        let count = 1;
        for (let j = i + 1; j < workers.length; j++) {
          const isSame = groupFields.every(field => workers[i][field] === workers[j][field]);
          if (isSame) {
            count++;
            spans[j] = 0;
          } else {
            break;
          }
        }
        spans[i] = count;
      }
      return spans;
    }

    function updateWorker(id, field, value) {
      workers = workers.map(w => w.id === id ? { ...w, [field]: value } : w);
      reRender();
    }

    function updateGroupField(workerIndex, rowSpan, field, value) {
      for (let i = workerIndex; i < workerIndex + rowSpan; i++) {
        workers[i][field] = value;
      }
      reRender();
    }

    function updateFactor(workerId, factorIndex, field, value) {
      workers = workers.map(worker => {
        if (worker.id === workerId) {
          const newFactors = [...worker.harmfulFactors];
          newFactors[factorIndex][field] = value;
          return { ...worker, harmfulFactors: newFactors };
        }
        return worker;
      });
      reRender();
    }

    function addWorker() {
      const newId = workers.length > 0 ? Math.max(...workers.map(w => w.id)) + 1 : 1;
      workers.push({
        id: newId, department: '', process: '', shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '', pageBreak: false,
        harmfulFactors: [{ name: '', a: '', p: '', l: '', n: '', remark: '' }]
      });
      reRender();
    }

    function removeWorker(id) {
      workers = workers.filter(w => w.id !== id);
      if (workers.length === 0) addWorker();
      else reRender();
    }

    function duplicateWorker(id) {
      const index = workers.findIndex(w => w.id === id);
      if (index === -1) return;
      const workerToCopy = workers[index];
      const newId = workers.length > 0 ? Math.max(...workers.map(w => w.id)) + 1 : 1;
      const clonedWorker = {
        ...workerToCopy,
        id: newId,
        pageBreak: false,
        harmfulFactors: workerToCopy.harmfulFactors.map(factor => ({ ...factor }))
      };
      workers.splice(index + 1, 0, clonedWorker);
      reRender();
    }

    function togglePageBreak(id) {
      workers = workers.map(w => w.id === id ? { ...w, pageBreak: !w.pageBreak } : w);
      reRender();
    }

    function addFactor(workerId) {
      workers = workers.map(worker => {
        if (worker.id === workerId) {
          return { ...worker, harmfulFactors: [...worker.harmfulFactors, { name: '', a: '', p: '', l: '', n: '', remark: '' }] };
        }
        return worker;
      });
      reRender();
    }

    function removeFactor(workerId, factorIndex) {
      workers = workers.map(worker => {
        if (worker.id === workerId) {
          const newFactors = worker.harmfulFactors.filter((_, idx) => idx !== factorIndex);
          return {
            ...worker,
            harmfulFactors: newFactors.length ? newFactors : [{ name: '', a: '', p: '', l: '', n: '', remark: '' }]
          };
        }
        return worker;
      });
      reRender();
    }

    function renderTableBody() {
      const tbody = document.getElementById('table-body');
      const spans = calculateSpans();
      let html = '';
      let currentPage = 1;

      workers.forEach((worker, index) => {
        const rowSpan = spans[index];
        
        if (worker.pageBreak) {
          currentPage++;
          html += `
          <tr class="print:hidden bg-indigo-50 border-t-2 border-b-2 border-indigo-200">
            <td colspan="15" class="text-center py-1 text-indigo-700 font-bold text-xs tracking-wide">
              ✂️ 인쇄 및 PDF 저장 시, 여기서부터 ${currentPage}페이지 첫 줄로 출력됩니다 ✂️
            </td>
          </tr>
          `;
        }

        const pageBreakClass = worker.pageBreak ? 'page-break-before' : '';
        html += `<tr class="hover:bg-gray-50 print:hover:bg-transparent transition-colors group ${pageBreakClass}">`;
        
        html += `<td class="px-1 py-1 text-center text-gray-500 border-r print:border-black align-top pt-2 print:pt-1">${index + 1}</td>`;
        
        if (rowSpan > 0) {
          html += `<td class="px-1 py-1 border-r print:border-black align-top" rowspan="${rowSpan}">
                    <input type="text" data-focus-id="dept-${worker.id}" oninput="updateGroupField(${index}, ${rowSpan}, 'department', this.value)" value="${worker.department}" placeholder="부서" class="w-full h-full bg-transparent border-b border-transparent focus:border-blue-500 outline-none p-1 print:border-none print:text-center text-center" />
                   </td>`;
          html += `<td class="px-1 py-1 border-r print:border-black align-top" rowspan="${rowSpan}">
                    <input type="text" data-focus-id="proc-${worker.id}" oninput="updateGroupField(${index}, ${rowSpan}, 'process', this.value)" value="${worker.process}" placeholder="공정" class="w-full h-full bg-transparent border-b border-transparent focus:border-blue-500 outline-none p-1 print:border-none print:text-center text-center" />
                   </td>`;
          html += `<td class="px-1 py-1 border-r print:border-black align-top text-center" rowspan="${rowSpan}">
                    <input type="text" data-focus-id="shift-${worker.id}" oninput="updateGroupField(${index}, ${rowSpan}, 'shiftSystem', this.value)" value="${worker.shiftSystem}" class="w-full h-full bg-transparent border-b border-transparent focus:border-blue-500 outline-none p-0 text-center print:border-none" />
                   </td>`;
          html += `<td class="px-1 py-1 border-r print:border-black align-top text-center" rowspan="${rowSpan}">
                    <input type="text" data-focus-id="cnt-${worker.id}" oninput="updateGroupField(${index}, ${rowSpan}, 'workerCount', this.value)" value="${worker.workerCount}" class="w-full h-full bg-transparent border-b border-transparent focus:border-blue-500 outline-none p-0 text-center print:border-none" />
                   </td>`;
          html += `<td class="px-1 py-1 border-r print:border-black align-top text-center" rowspan="${rowSpan}">
                    <input type="text" data-focus-id="cycle-${worker.id}" oninput="updateGroupField(${index}, ${rowSpan}, 'exposureCycle', this.value)" value="${worker.exposureCycle}" class="w-full h-full bg-transparent border-b border-transparent focus:border-blue-500 outline-none p-0 text-center print:border-none" />
                   </td>`;
          html += `<td class="px-1 py-1 border-r print:border-black align-top text-center" rowspan="${rowSpan}">
                    <input type="text" data-focus-id="mcnt-${worker.id}" oninput="updateGroupField(${index}, ${rowSpan}, 'measurementCount', this.value)" value="${worker.measurementCount}" class="w-full h-full bg-transparent border-b border-transparent focus:border-blue-500 outline-none p-0 text-center print:border-none" />
                   </td>`;
        }

        html += `<td class="px-1 py-1 border-r print:border-black align-top">
                  <input type="text" data-focus-id="name-${worker.id}" oninput="updateWorker(${worker.id}, 'name', this.value)" value="${worker.name}" placeholder="이름" class="w-full h-full bg-transparent border-b border-transparent focus:border-blue-500 outline-none p-1 text-center print:border-none print:p-0" />
                 </td>`;

        html += `<td class="p-0 border-r print:border-black align-top" colspan="6">
                  <div class="flex flex-col h-full w-full">`;
        
        worker.harmfulFactors.forEach((factor, fIndex) => {
          const isLast = fIndex === worker.harmfulFactors.length - 1;
          const borderClass = !isLast ? 'border-b border-gray-200 print:border-black' : '';
          
          html += `<div class="flex w-full ${borderClass} min-h-[44px]">
                      
                      <!-- 유해인자 -->
                      <div class="col-factor border-r border-gray-200 print:border-black px-1 py-1 relative flex items-center print:items-start">
                        <textarea data-focus-id="fname-${worker.id}-${fIndex}" oninput="updateFactor(${worker.id}, ${fIndex}, 'name', this.value)" class="w-full h-full resize-none bg-transparent outline-none print:hidden pr-5 text-xs" placeholder="유해인자 입력" rows="1">${factor.name}</textarea>
                        <!-- 인쇄 시 줄바꿈 적용되는 텍스트 박스 -->
                        <div class="hidden print:block w-full whitespace-pre-wrap break-words leading-tight">${factor.name}</div>
                        
                        <button onclick="removeFactor(${worker.id}, ${fIndex})" class="absolute right-0.5 top-1 text-gray-400 hover:text-red-500 print:hidden p-1 rounded" title="삭제">
                          <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                      </div>

                      <!-- A, P, L, N -->
                      <div class="col-apln border-r border-gray-200 print:border-black flex items-center justify-center p-0.5">
                        <input type="text" data-focus-id="fa-${worker.id}-${fIndex}" oninput="updateFactor(${worker.id}, ${fIndex}, 'a', this.value)" value="${factor.a}" class="w-full text-center bg-transparent outline-none uppercase" />
                      </div>
                      <div class="col-apln border-r border-gray-200 print:border-black flex items-center justify-center p-0.5">
                        <input type="text" data-focus-id="fp-${worker.id}-${fIndex}" oninput="updateFactor(${worker.id}, ${fIndex}, 'p', this.value)" value="${factor.p}" class="w-full text-center bg-transparent outline-none uppercase" />
                      </div>
                      <div class="col-apln border-r border-gray-200 print:border-black flex items-center justify-center p-0.5">
                        <input type="text" data-focus-id="fl-${worker.id}-${fIndex}" oninput="updateFactor(${worker.id}, ${fIndex}, 'l', this.value)" value="${factor.l}" class="w-full text-center bg-transparent outline-none uppercase" />
                      </div>
                      <div class="col-apln border-r border-gray-200 print:border-black flex items-center justify-center p-0.5">
                        <input type="text" data-focus-id="fn-${worker.id}-${fIndex}" oninput="updateFactor(${worker.id}, ${fIndex}, 'n', this.value)" value="${factor.n}" class="w-full text-center bg-transparent outline-none uppercase" />
                      </div>

                      <!-- 비고 -->
                      <div class="col-remark flex items-center justify-center px-1 py-1 relative print:items-start">
                        <textarea data-focus-id="frem-${worker.id}-${fIndex}" oninput="updateFactor(${worker.id}, ${fIndex}, 'remark', this.value)" class="w-full h-full resize-none px-0.5 bg-transparent outline-none print:hidden text-center text-xs" placeholder="비고" rows="1">${factor.remark}</textarea>
                        <div class="hidden print:block w-full whitespace-pre-wrap break-words leading-tight text-center">${factor.remark}</div>
                      </div>
                   </div>`;
        });

        html += `<div class="p-1 border-t border-gray-100 print:hidden flex justify-center bg-gray-50/50">
                   <button onclick="addFactor(${worker.id})" class="text-[10px] flex items-center gap-1 text-blue-600 hover:text-blue-800 font-medium">
                     <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
                     유해인자 추가
                   </button>
                 </div>
                </div>
               </td>`;

        html += `<td class="px-1 py-2 text-center align-middle print:hidden whitespace-nowrap border-b border-gray-100">
                  <div class="flex flex-col gap-1.5 items-center justify-center h-full">
                    <div class="flex gap-1 justify-center">
                      <button onclick="duplicateWorker(${worker.id})" class="text-gray-500 hover:text-blue-600 p-1 rounded hover:bg-blue-50 transition-colors bg-white border border-gray-200 shadow-sm" title="현재 행 복사">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9" /></svg>
                      </button>
                      <button onclick="removeWorker(${worker.id})" class="text-gray-500 hover:text-red-600 p-1 rounded hover:bg-red-50 transition-colors bg-white border border-gray-200 shadow-sm" title="행 삭제">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                      </button>
                    </div>
                    <button onclick="togglePageBreak(${worker.id})" class="text-[9px] font-semibold flex items-center justify-center gap-1 w-full px-1 py-1 rounded transition-colors ${worker.pageBreak ? 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-inner' : 'text-indigo-600 bg-indigo-50 border border-indigo-200 hover:bg-indigo-100'}" title="${worker.pageBreak ? '분할선 취소' : '이 행부터 다음 페이지에 인쇄'}">
                      ✂️ ${worker.pageBreak ? '나눔 취소' : '페이지 나눔'}
                    </button>
                  </div>
                 </td>`;

        html += `</tr>`;
      });

      tbody.innerHTML = html;
    }

    function reRender() {
      saveFocus();
      renderTableBody();
      restoreFocus();
    }

    async function copyTableToClipboard() {
      try {
        let tsvData = "No.\t부서명\t공정명\t교대제\t근로자수\t노출주기\t측정건수\t근로자명\t유해인자\tA\tP\tL\tN\t비고\n";
        workers.forEach((worker, index) => {
          worker.harmfulFactors.forEach((factor, fIndex) => {
            const isFirst = fIndex === 0;
            const safe = (str) => (str || '').replace(/\t/g, ' ').replace(/\n/g, ' ');
            tsvData += `${isFirst ? index + 1 : ''}\t${isFirst ? safe(worker.department) : ''}\t${isFirst ? safe(worker.process) : ''}\t${isFirst ? safe(worker.shiftSystem) : ''}\t${isFirst ? safe(worker.workerCount) : ''}\t${isFirst ? safe(worker.exposureCycle) : ''}\t${isFirst ? safe(worker.measurementCount) : ''}\t${isFirst ? safe(worker.name) : ''}\t${safe(factor.name)}\t${safe(factor.a)}\t${safe(factor.p)}\t${safe(factor.l)}\t${safe(factor.n)}\t${safe(factor.remark)}\n`;
          });
        });

        await navigator.clipboard.writeText(tsvData);
        
        document.getElementById('copyIconDefault').classList.add('hidden');
        document.getElementById('copyIconCheck').classList.remove('hidden');
        document.getElementById('copyBtnText').innerText = '완료!';
        
        setTimeout(() => {
          document.getElementById('copyIconDefault').classList.remove('hidden');
          document.getElementById('copyIconCheck').classList.add('hidden');
          document.getElementById('copyBtnText').innerText = '복사';
        }, 2000);
      } catch (err) {
        alert('복사에 실패했습니다.');
      }
    }

    function downloadExcel() {
      try {
        // UTF-8 BOM 추가하여 엑셀에서 한글 깨짐 방지
        let csvData = "\uFEFFNo.,부서명,공정명,교대제,근로자수,노출주기,측정건수,근로자명,유해인자,A,P,L,N,비고\n";
        
        workers.forEach((worker, index) => {
          worker.harmfulFactors.forEach((factor, fIndex) => {
            const isFirst = fIndex === 0;
            // 엑셀 CSV 포맷을 위해 따옴표와 줄바꿈 처리
            const escapeCSV = (str) => {
              if (!str) return '""';
              const replaced = str.toString().replace(/"/g, '""');
              return `"${replaced}"`;
            };
            
            csvData += `${isFirst ? index + 1 : ''},` +
                       `${isFirst ? escapeCSV(worker.department) : '""'},` +
                       `${isFirst ? escapeCSV(worker.process) : '""'},` +
                       `${isFirst ? escapeCSV(worker.shiftSystem) : '""'},` +
                       `${isFirst ? escapeCSV(worker.workerCount) : '""'},` +
                       `${isFirst ? escapeCSV(worker.exposureCycle) : '""'},` +
                       `${isFirst ? escapeCSV(worker.measurementCount) : '""'},` +
                       `${isFirst ? escapeCSV(worker.name) : '""'},` +
                       `${escapeCSV(factor.name)},${escapeCSV(factor.a)},${escapeCSV(factor.p)},${escapeCSV(factor.l)},${escapeCSV(factor.n)},${escapeCSV(factor.remark)}\n`;
          });
        });

        const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        if (link.download !== undefined) {
          const url = URL.createObjectURL(blob);
          link.setAttribute("href", url);
          link.setAttribute("download", "작업환경측정_계획서.csv");
          link.style.visibility = 'hidden';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }
      } catch (err) {
        alert('엑셀 저장 중 오류가 발생했습니다.');
      }
    }

    function parseCSV(text) {
      const result = [];
      let row = [];
      let cell = '';
      let insideQuote = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (insideQuote) {
          if (char === '"' && text[i + 1] === '"') { cell += '"'; i++; }
          else if (char === '"') { insideQuote = false; }
          else { cell += char; }
        } else {
          if (char === '"') { insideQuote = true; }
          else if (char === ',') { row.push(cell); cell = ''; }
          else if (char === '\n' || char === '\r') {
            row.push(cell); result.push(row); row = []; cell = '';
            if (char === '\r' && text[i + 1] === '\n') i++;
          }
          else { cell += char; }
        }
      }
      if (cell || row.length > 0) { row.push(cell); result.push(row); }
      return result;
    }

    async function fetchSheetData(url) {
      if (!url.trim()) return null;
      try {
        const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
        if (!match) throw new Error("유효한 스프레드시트 주소가 아닙니다.");
        const exportUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv`;
        const response = await fetch(exportUrl);
        if (!response.ok) throw new Error("시트 접근 거부. 일반 액세스를 확인하세요.");
        const text = await response.text();
        return parseCSV(text);
      } catch (error) { throw error; }
    }

    async function handleSyncSheets() {
      const excludeUrl = document.getElementById('excludeNoiseUrl').value;
      const noiseUrl = document.getElementById('noiseUrl').value;
      const syncBtn = document.getElementById('syncBtn');
      const msg = document.getElementById('syncMessage');

      if (!excludeUrl && !noiseUrl) {
        msg.className = 'text-xs font-medium text-red-600';
        msg.innerText = 'URL을 입력해주세요.';
        return;
      }

      syncBtn.disabled = true;
      syncBtn.innerText = '불러오는 중...';
      msg.innerText = '';

      try {
        let mergedGroups = {};

        const processRows = (rows, isNoiseSheet = false) => {
          if (!rows || rows.length < 2) return;
          let lastDept = '', lastProcess = '';

          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length < 2) continue;

            let dept = row[1]?.trim() || '';
            let process = row[2]?.trim() || '';

            if (dept === '' && process === '') {
              dept = lastDept; process = lastProcess;
            } else {
              lastDept = dept; lastProcess = process;
            }

            if (!dept && !process) continue;

            const key = `${dept}|${process}`;
            const removeDecimal = (val) => val ? val.replace(/(\d+)\.\d+/g, '$1') : '';

            let workerCount = removeDecimal(row[4]?.trim());
            let shift = row[5]?.trim() || '';
            let cycle = row[6]?.trim() || '';

            if (!mergedGroups[key]) {
              mergedGroups[key] = {
                department: dept, process: process, shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '', pageBreak: false,
                factorGroups: [], isFromExcludeNoise: false
              };
            }

            if (!isNoiseSheet) {
              mergedGroups[key].isFromExcludeNoise = true;
              if (shift) mergedGroups[key].shiftSystem = shift;
              if (workerCount) mergedGroups[key].workerCount = workerCount;
              if (cycle) mergedGroups[key].exposureCycle = cycle;

              let factor = row[3]?.trim() || '';
              let pValue = row.length > 15 ? row[15]?.trim() || '' : '';

              if (pValue !== '') mergedGroups[key].factorGroups.push(new Set());
              if (factor !== '') {
                if (mergedGroups[key].factorGroups.length === 0) mergedGroups[key].factorGroups.push(new Set());
                mergedGroups[key].factorGroups[mergedGroups[key].factorGroups.length - 1].add(factor);
              }
            } else {
              if (!mergedGroups[key].isFromExcludeNoise) {
                if (shift) mergedGroups[key].shiftSystem = shift;
                if (workerCount) mergedGroups[key].workerCount = workerCount;
                if (cycle) mergedGroups[key].exposureCycle = cycle;
              }

              const noiseSet = new Set(['소음']);
              mergedGroups[key].factorGroups.push(noiseSet);
            }
          }
        };

        if (excludeUrl) {
          const rows1 = await fetchSheetData(excludeUrl);
          processRows(rows1, false);
        }
        if (noiseUrl) {
          const rows2 = await fetchSheetData(noiseUrl);
          processRows(rows2, true);
        }

        const newWorkers = Object.values(mergedGroups)
          .filter(group => group.factorGroups.length > 0)
          .map((group, index) => {
            let formattedFactors = [];
            group.factorGroups.forEach(set => {
              let factorStr = Array.from(set).join(', ');
              if (factorStr) {
                formattedFactors.push({ name: factorStr, a: '', p: '', l: '', n: '', remark: '' });
              }
            });

            if (formattedFactors.length === 0) {
              formattedFactors = [{ name: '', a: '', p: '', l: '', n: '', remark: '' }];
            }

            return {
              id: Date.now() + index,
              department: group.department,
              process: group.process,
              shiftSystem: group.shiftSystem,
              workerCount: group.workerCount,
              exposureCycle: group.exposureCycle,
              measurementCount: group.measurementCount,
              name: group.name,
              pageBreak: false,
              harmfulFactors: formattedFactors
            };
          });

        if (newWorkers.length > 0) {
          workers = newWorkers;
          reRender();
          msg.className = 'text-xs font-medium text-green-600';
          msg.innerText = `연동 완료: ${newWorkers.length}개 대상 추출`;
        } else {
          msg.className = 'text-xs font-medium text-red-600';
          msg.innerText = '조건에 맞는 데이터가 없습니다.';
        }
      } catch (error) {
        msg.className = 'text-xs font-medium text-red-600';
        msg.innerText = error.message;
      } finally {
        syncBtn.disabled = false;
        syncBtn.innerText = '데이터 연동하기';
      }
    }

    renderTableBody();
  </script>
