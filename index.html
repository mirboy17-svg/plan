<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>작업환경측정 계획서</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    @media print {
      @page { size: landscape !important; margin: 5mm; }
      body { background-color: white !important; }
      .print\:hidden { display: none !important; }
      .print\:block { display: block !important; }
      .print\:bg-transparent { background-color: transparent !important; }
      .print\:border-black { border-color: black !important; }
      .print\:border-none { border: none !important; }
      
      textarea, input { display: none !important; }
      
      table { border-collapse: collapse; width: 100% !important; min-width: 0 !important; }
      th, td { font-size: 8px !important; padding: 1px 2px !important; line-height: 1.2 !important; height: auto !important; }
      
      .nowrap-col { white-space: normal !important; word-break: break-all !important; }
      
      .page-break-before {
        page-break-before: always !important;
        break-before: page !important;
      }
      
      /* 부서명(그룹) 기준 페이지 잘림 방지 */
      .group-tbody {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      tr {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }
    
    .nowrap-col {
      white-space: normal !important;
      word-break: break-all !important;
    }
    
    textarea {
      resize: none;
      overflow: hidden;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen p-4 md:p-8">
  
  <div class="max-w-[1450px] mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200 print:shadow-none print:border-none">
    
    <div class="bg-slate-800 p-6 flex justify-between items-center text-white print:bg-white print:text-black print:border-b print:border-black print:p-2 print:mb-4">
      <div class="flex items-center gap-3">
        <svg class="w-8 h-8 print:hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <h1 id="mainTitle" class="text-2xl font-bold">작업환경측정 계획서</h1>
      </div>
      <div class="flex flex-wrap items-center justify-end gap-2 print:hidden">
        <button onclick="exportToExcel()" class="flex items-center gap-1 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg transition-colors text-sm shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          엑셀 저장
        </button>
        <button onclick="saveData()" class="flex items-center gap-1 bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg transition-colors text-sm shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
          저장
        </button>
        <label class="flex items-center gap-1 bg-fuchsia-600 hover:bg-fuchsia-700 text-white px-3 py-2 rounded-lg transition-colors text-sm shadow-sm cursor-pointer mb-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
          불러오기
          <input type="file" accept=".json" class="hidden" onchange="loadData(event)">
        </label>
        <button id="copyBtn" onclick="copyTableToClipboard()" class="flex items-center gap-1 bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg transition-colors text-sm shadow-sm">
          <svg id="copyIconDefault" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <svg id="copyIconCheck" class="w-4 h-4 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
          <span id="copyBtnText">현재 표 데이터 복사</span>
        </button>
        <button onclick="printAllUnits()" class="flex items-center gap-1 bg-violet-600 hover:bg-violet-700 text-white px-3 py-2 rounded-lg transition-colors text-sm shadow-md border border-violet-800">
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
          <span>전체사업체 인쇄/저장</span>
        </button>
      </div>
    </div>

    <div class="p-6 md:p-8 space-y-6 print:p-0 print:space-y-0">
      
      <section class="bg-gray-50 p-5 rounded-lg border border-gray-200 print:hidden">
        <h2 class="text-base font-semibold text-gray-800 mb-3 border-b pb-2">사업장 기본 정보</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">사업장명</label>
            <input type="text" id="companyName" oninput="updateTitle(this.value)" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none block !important" placeholder="예) (주)한국산업" />
          </div>
        </div>
      </section>

      <section class="bg-blue-50 p-5 rounded-lg border border-blue-100 print:hidden">
        <div class="flex items-center gap-2 mb-3">
          <h2 class="text-base font-semibold text-blue-800">구글 스프레드시트 데이터 연동</h2>
          <span class="text-xs bg-blue-200 text-blue-800 px-2 py-1 rounded-full font-medium">소음시트는 근로자수 D열 기준 산정</span>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">'소음제외' 시트 URL (P, R열 조건)</label>
            <input type="text" id="excludeNoiseUrl" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white block !important" placeholder="https://docs.google.com/spreadsheets/d/..." />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">'소음' 시트 URL (P, M열 조건)</label>
            <input type="text" id="noiseUrl" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white block !important" placeholder="https://docs.google.com/spreadsheets/d/..." />
          </div>
        </div>
        <div class="flex items-center gap-4">
          <button id="syncBtn" onclick="handleSyncSheets()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition-colors font-medium text-sm shadow-sm disabled:bg-blue-300">
            데이터 연동하기
          </button>
          <span id="syncMessage" class="text-sm font-medium text-blue-600"></span>
        </div>
      </section>

      <section class="bg-amber-50 p-4 rounded-lg border border-amber-200 print:hidden flex flex-col lg:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2">
          <h2 class="text-base font-bold text-amber-800 flex items-center gap-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            측정 일차 분리 관리
          </h2>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <select id="moveTargetUnit" onchange="updateMoveDeptDropdown()" class="border border-gray-300 rounded p-1.5 text-sm outline-none focus:ring-2 focus:ring-amber-500 min-w-[140px] max-w-[180px]">
            <option value="">단위사업체 선택</option>
          </select>
          <select id="moveTargetDept" class="border border-gray-300 rounded p-1.5 text-sm outline-none focus:ring-2 focus:ring-amber-500 min-w-[140px] max-w-[180px]">
            <option value="">부서명 선택</option>
          </select>
          <span class="text-gray-400 font-bold px-1">➔</span>
          <select id="moveTargetDay" class="border border-gray-300 rounded p-1.5 text-sm outline-none focus:ring-2 focus:ring-amber-500 font-bold text-amber-700">
            <option value="1">1일차</option><option value="2">2일차</option><option value="3">3일차</option><option value="4">4일차</option><option value="5">5일차</option>
          </select>
          <button onclick="moveDepartmentDay()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-1.5 rounded font-bold text-sm shadow-sm transition-colors whitespace-nowrap">
            이동 실행
          </button>
        </div>
      </section>

      <section id="tabContainerSection" class="hidden print:hidden">
        <div class="flex items-end border-b-2 border-amber-500 mb-3 gap-2">
            <div class="bg-amber-500 text-white px-3 py-1.5 text-sm font-bold rounded-tl-lg rounded-tr-lg">일자 선택</div>
            <div id="dayTabs" class="flex flex-wrap gap-1"></div>
        </div>
        <div class="flex items-end border-b border-gray-300 pb-1 gap-2">
            <div class="text-indigo-600 px-3 py-1.5 text-sm font-bold bg-indigo-50 rounded-tl-lg rounded-tr-lg border border-b-0 border-indigo-200">사업체 선택</div>
            <div id="unitTabs" class="flex flex-wrap gap-1"></div>
        </div>
      </section>

      <div id="tables-container" class="space-y-8 print:space-y-6">
        <!-- 렌더링 영역 -->
      </div>
    </div>
  </div>

  <script>
    // 입력창(textarea) 크기 자동 조절 (초고속 렌더링 최적화)
    function smartResize(el) {
      if (!el) return;
      requestAnimationFrame(() => {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
      });
    }

    let appData = {
      currentDay: 1,
      currentUnit: 'ALL',
      units: {
        '기본 사업체': [
          {
            id: 1, day: 1, department: '', process: '', shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '', isManual: false, pageBreak: false, 
            harmfulFactors: [{ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false }]
          }
        ]
      }
    };

    let activeFocusId = null;
    let selectionStart = null;
    let selectionEnd = null;

    // 제목 연동
    function updateTitle(val) {
      const companyName = val.trim();
      const titleText = companyName ? `작업환경측정 계획서 - ${companyName}` : '작업환경측정 계획서';
      document.getElementById('mainTitle').innerText = titleText;
      document.title = titleText;
    }

    // 포커스 저장/복구 (렌더링 시 끊김 방지용)
    function saveFocus() {
      const active = document.activeElement;
      if (active && active.dataset.focusId) {
        activeFocusId = active.dataset.focusId;
        selectionStart = active.selectionStart;
        selectionEnd = active.selectionEnd;
      } else {
        activeFocusId = null;
      }
    }
    function restoreFocus() {
      if (activeFocusId) {
        const el = document.querySelector(`[data-focus-id="${activeFocusId}"]`);
        if (el) {
          el.focus();
          try {
            if (el.tagName === 'TEXTAREA' || el.type === 'text' || el.type === 'number') {
              el.setSelectionRange(selectionStart, selectionEnd);
            }
          } catch(e) {}
        }
      }
    }

    // A, P, L, N 갯수 UI 실시간 갱신 로직
    function updateCountsUI() {
      const allDays = getActiveDays();
      allDays.forEach(day => {
          let uniqueA = new Set();
          let uniqueP = new Set();
          let uniqueL = new Set();
          let countN = 0;
          
          Object.keys(appData.units).forEach((unitName) => {
              if (appData.currentUnit !== 'ALL' && appData.currentUnit !== unitName) return;
              const currentWorkers = appData.units[unitName].filter(w => (w.day || 1) === day);
              currentWorkers.forEach(worker => {
                  worker.harmfulFactors.forEach(factor => {
                      if (factor.a && String(factor.a).trim() !== '') uniqueA.add(String(factor.a).trim());
                      if (factor.p && String(factor.p).trim() !== '') uniqueP.add(String(factor.p).trim());
                      if (factor.l && String(factor.l).trim() !== '') uniqueL.add(String(factor.l).trim());
                      
                      const isNoiseFactor = String(factor.name).trim().includes('소음');
                      const nValue = (!factor.isAdjusted && isNoiseFactor) ? 'V' : (factor.n || '');
                      if (nValue && String(nValue).trim() !== '') countN++;
                  });
              });
          });
          
          const displayEl = document.getElementById(`count-display-${day}`);
          if (displayEl) {
              displayEl.innerText = `- 'A : ${uniqueA.size}개, P : ${uniqueP.size}개, L : ${uniqueL.size}개, N : ${countN}개'`;
          }
      });
    }

    // 이름(근로자명) 실시간 시퀀스 재계산 (*1, *2...)
    function recalculateNames() {
      let currentSeq = 1;
      const allDays = getActiveDays();
      const unitNames = Object.keys(appData.units);
      
      allDays.forEach(day => {
          unitNames.forEach(unitName => {
              const currentWorkers = appData.units[unitName].filter(w => (w.day || 1) === day);
              currentWorkers.forEach(worker => {
                  let val = (worker.name || '').trim();
                  
                  // 사용자가 '*숫자' 형태로 커스텀 번호 점프를 지시한 경우 (*100 등)
                  if (worker.isManual && val.match(/^\*\d+$/)) {
                      currentSeq = parseInt(val.substring(1), 10) + 1;
                  } else {
                      // 수동 입력이 아니거나 지워져서 빈칸이 된 경우 자동 넘버링 부여
                      if (!worker.isManual || val === '') {
                          worker.name = '*' + currentSeq;
                          worker.isManual = false;
                      }
                      // 일반 텍스트(예: 홍길동)를 수기 입력하더라도, 해당 행이 
                      // 순번 1자리를 차지하도록 하여 아래 행들의 번호가 밀리거나 바뀌지 않도록 방어!
                      currentSeq++;
                  }
              });
          });
      });
    }

    // 타이핑 지연 없는 데이터 업데이트 로직 (디바운싱 결합)
    function updateWorkerName(unitName, id, value) {
      const target = appData.units[unitName].find(w => w.id === id);
      if(target) {
          target.name = value;
          target.isManual = true; // 수동 입력 플래그 활성화
      }
      
      clearTimeout(window.nameDebounce);
      window.nameDebounce = setTimeout(() => {
          recalculateNames(); // 데이터 상에서 번호 체계 재계산 (*1, *2, 홍길동, *3 ... 법칙 유지)
          
          // reRender()로 화면을 통째로 엎지 않고, 변경된 데이터만 DOM에 직접 주입 (한글 씹힘/끊김 원천 차단)
          Object.keys(appData.units).forEach(uName => {
              appData.units[uName].forEach(w => {
                  const ta = document.querySelector(`textarea[data-focus-id="name-${w.id}"]`);
                  // 현재 타이핑 중인 칸(포커스된 칸)은 절대 건드리지 않음
                  if (ta && ta !== document.activeElement) {
                      ta.value = w.name;
                  }
                  const printDiv = document.getElementById(`print-name-${w.id}`);
                  if (printDiv) {
                      printDiv.innerText = w.name;
                  }
              });
          });
      }, 300); // 0.3초 뒤 부드럽게 나머지 칸 갱신
    }

    function updateFactorField(unitName, workerId, factorIndex, field, value) {
      const target = appData.units[unitName].find(w => w.id === workerId);
      if(target && target.harmfulFactors[factorIndex]) {
          target.harmfulFactors[factorIndex][field] = value;
      }
      clearTimeout(window.countDebounce);
      window.countDebounce = setTimeout(() => {
          updateCountsUI();
      }, 200);
    }

    function updateGroupField(unitName, day, filterIndex, rowSpan, field, value) {
      const currentWorkers = appData.units[unitName].filter(w => (w.day || 1) === day);
      for (let i = filterIndex; i < filterIndex + rowSpan; i++) {
        const targetId = currentWorkers[i].id;
        const realWorker = appData.units[unitName].find(w => w.id === targetId);
        if(realWorker) realWorker[field] = value;
      }
    }

    function toggleAdjust(unitName, workerId, factorIndex) {
      const target = appData.units[unitName].find(w => w.id === workerId);
      if(target && target.harmfulFactors[factorIndex]) {
          target.harmfulFactors[factorIndex].isAdjusted = !target.harmfulFactors[factorIndex].isAdjusted;
          reRender();
      }
    }

    // "가방" 버튼 클릭 시 실행되는 초고속 기입 함수
    function addBagToRemark(unitName, workerId, factorIndex) {
      const target = appData.units[unitName].find(w => w.id === workerId);
      if(target && target.harmfulFactors[factorIndex]) {
          let currentVal = (target.harmfulFactors[factorIndex].remark || '').trim();
          
          // 기존에 있던 ', 가방' 꼬리표나 단독 '가방' 텍스트를 깔끔하게 제거
          currentVal = currentVal.replace(/,\s*가방/g, '').trim();
          if (currentVal === '가방') currentVal = '';
          
          // 맨 앞에 [가방]이 없는 경우에만 추가 실행
          if (!currentVal.startsWith('[가방]')) {
              // 혹시 중간에 [가방]이 끼어있다면 제거 후 맨 앞으로 이동
              currentVal = currentVal.replace(/\[가방\]\s*/g, '');
              
              // 최상단에 [가방] 기입 (기존 텍스트가 있으면 한 칸 띄우고 붙임)
              const newVal = currentVal === '' ? '[가방]' : '[가방] ' + currentVal;
              target.harmfulFactors[factorIndex].remark = newVal;

              // DOM 직접 조작으로 화면 끊김(렉) 완벽 차단
              const textarea = document.querySelector(`textarea[data-focus-id="frem-${workerId}-${factorIndex}"]`);
              if (textarea) {
                  textarea.value = newVal;
                  textarea.style.height = 'auto';
                  textarea.style.height = textarea.scrollHeight + 'px';
                  textarea.focus(); // 입력 직후 자연스럽게 포커스 유지
                  textarea.setSelectionRange(newVal.length, newVal.length);
              }
              const printDiv = document.getElementById(`print-frem-${workerId}-${factorIndex}`);
              if (printDiv) {
                  printDiv.innerHTML = newVal.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\[가방\]/g, '<span class="font-bold text-red-600 print:text-red-600">[가방]</span>');
              }
          }
      }
    }

    function addWorker(unitName) {
      const currentWorkers = appData.units[unitName];
      const newId = currentWorkers.length > 0 ? Math.max(...currentWorkers.map(w => w.id)) + 1 : 1;
      currentWorkers.push({
        id: newId, day: appData.currentDay, department: '', process: '', shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '', isManual: false, pageBreak: false,
        harmfulFactors: [{ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false }]
      });
      recalculateNames();
      reRender();
    }

    function removeWorker(unitName, id) {
      let currentWorkers = appData.units[unitName];
      currentWorkers = currentWorkers.filter(w => w.id !== id);
      appData.units[unitName] = currentWorkers;
      if (currentWorkers.length === 0) addWorker(unitName);
      else {
          recalculateNames();
          reRender();
      }
    }

    function duplicateWorker(unitName, id) {
      const currentWorkers = appData.units[unitName];
      const index = currentWorkers.findIndex(w => w.id === id);
      if (index === -1) return;
      
      const workerToCopy = currentWorkers[index];
      const newId = currentWorkers.length > 0 ? Math.max(...currentWorkers.map(w => w.id)) + 1 : 1;
      
      const clonedWorker = {
        ...workerToCopy,
        id: newId,
        day: workerToCopy.day || 1,
        pageBreak: false,
        name: '', // 복사 시 빈칸 초기화 -> 다음 번호로 자동 부여됨
        isManual: false,
        harmfulFactors: workerToCopy.harmfulFactors.map(factor => ({ ...factor }))
      };
      
      currentWorkers.splice(index + 1, 0, clonedWorker);
      recalculateNames();
      reRender();
    }

    function addFactor(unitName, workerId) {
      const target = appData.units[unitName].find(w => w.id === workerId);
      if(target) {
          target.harmfulFactors.push({ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false });
          reRender();
      }
    }

    function removeFactor(unitName, workerId, factorIndex) {
      const target = appData.units[unitName].find(w => w.id === workerId);
      if(target) {
          target.harmfulFactors.splice(factorIndex, 1);
          if(target.harmfulFactors.length === 0) {
              target.harmfulFactors.push({ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false });
          }
          reRender();
      }
    }

    function togglePageBreak(unitName, id) {
      const target = appData.units[unitName].find(w => w.id === id);
      if(target) {
          target.pageBreak = !target.pageBreak;
          reRender();
      }
    }

    function calculateSpansForWorkers(workers) {
      if (!workers) return [];
      const groupFields = ['department', 'process', 'shiftSystem', 'workerCount', 'exposureCycle', 'measurementCount'];
      const spans = new Array(workers.length).fill(1);
      for (let i = 0; i < workers.length; i++) {
        if (spans[i] === 0) continue;
        let count = 1;
        for (let j = i + 1; j < workers.length; j++) {
          const isSame = groupFields.every(field => workers[i][field] === workers[j][field]);
          if (isSame) { count++; spans[j] = 0; } 
          else break;
        }
        spans[i] = count;
      }
      return spans;
    }

    function getActiveDays() {
        let activeDays = new Set();
        Object.values(appData.units).forEach(workers => workers.forEach(w => activeDays.add(w.day || 1)));
        if(activeDays.size === 0) activeDays.add(1);
        return Array.from(activeDays).sort((a,b) => a - b);
    }
    
    function getValidUnitsForDay(day) {
        let valid = [];
        Object.keys(appData.units).forEach(unit => {
            if(appData.units[unit].some(w => (w.day || 1) === day)) valid.push(unit);
        });
        return valid;
    }

    // 탭 렌더링 로직
    function updateDayManageDropdowns() {
        const unitSelect = document.getElementById('moveTargetUnit');
        const deptSelect = document.getElementById('moveTargetDept');
        if(!unitSelect || !deptSelect) return;

        const currentUnits = Object.keys(appData.units);
        const prevUnit = unitSelect.value;
        const prevDept = deptSelect.value;

        let unitOptions = '<option value="">단위사업체 선택</option>';
        currentUnits.forEach(u => unitOptions += `<option value="${u}">${u}</option>`);
        unitSelect.innerHTML = unitOptions;
        if (currentUnits.includes(prevUnit)) unitSelect.value = prevUnit;

        let deptOptions = '<option value="">부서명 선택</option>';
        if (unitSelect.value && appData.units[unitSelect.value]) {
            deptOptions += '<option value="ALL" class="font-bold text-blue-600">✨ 단위사업체 전체 이동</option>';
            const depts = new Set();
            appData.units[unitSelect.value].forEach(w => { if(w.department) depts.add(w.department); });
            Array.from(depts).sort().forEach(d => deptOptions += `<option value="${d}">${d}</option>`);
            deptSelect.innerHTML = deptOptions;
            if(prevDept === 'ALL' || Array.from(depts).includes(prevDept)) deptSelect.value = prevDept;
        }
    }
    function updateMoveDeptDropdown() { updateDayManageDropdowns(); }

    function moveDepartmentDay() {
        const unit = document.getElementById('moveTargetUnit').value;
        const dept = document.getElementById('moveTargetDept').value;
        const targetDay = parseInt(document.getElementById('moveTargetDay').value);

        if(!unit) return alert("단위사업체를 선택하세요.");
        if(!dept) return alert("이동할 부서명을 선택하세요.");
        if(!targetDay) return;

        let movedCount = 0;
        appData.units[unit].forEach(w => {
            if(dept === 'ALL' || w.department === dept) { w.day = targetDay; movedCount++; }
        });

        if(movedCount > 0) {
            alert(`${movedCount}건이 ${targetDay}일차로 이동되었습니다.`);
            appData.currentDay = targetDay;
            if(appData.currentUnit !== 'ALL') appData.currentUnit = unit;
            recalculateNames();
            reRender();
        }
    }

    function renderDayTabs() {
        const tabsContainer = document.getElementById('dayTabs');
        if(!tabsContainer) return;
        tabsContainer.innerHTML = '';
        const sortedDays = getActiveDays();
        if(!sortedDays.includes(appData.currentDay)) appData.currentDay = sortedDays[0] || 1;

        sortedDays.forEach(day => {
            const btn = document.createElement('button');
            const isActive = appData.currentDay === day;
            btn.className = `px-4 py-1.5 text-sm font-bold rounded-t-lg transition-colors border-t border-l border-r ${isActive ? 'bg-white text-amber-600 border-amber-200 border-b-white translate-y-[1px]' : 'bg-amber-100/50 text-amber-700/60 border-amber-200/50 hover:bg-amber-100'}`;
            btn.innerText = `${day}일차`;
            btn.onclick = () => { appData.currentDay = day; reRender(); };
            tabsContainer.appendChild(btn);
        });
    }

    function renderUnitTabs() {
        const tabsContainer = document.getElementById('unitTabs');
        if(!tabsContainer) return;
        tabsContainer.innerHTML = '';

        let validUnits = getValidUnitsForDay(appData.currentDay);
        if(validUnits.length === 0) return;

        const allBtn = document.createElement('button');
        const isAllActive = appData.currentUnit === 'ALL';
        allBtn.className = `px-4 py-1.5 text-sm font-bold rounded-t-lg transition-colors border-t border-l border-r ${isAllActive ? 'bg-indigo-600 text-white border-indigo-600 translate-y-[1px]' : 'bg-gray-100 text-gray-500 border-gray-200 hover:bg-gray-50'}`;
        allBtn.innerText = '전체 사업체';
        allBtn.onclick = () => { appData.currentUnit = 'ALL'; reRender(); };
        tabsContainer.appendChild(allBtn);

        validUnits.forEach(unitName => {
            const btn = document.createElement('button');
            const isActive = appData.currentUnit === unitName;
            btn.className = `px-4 py-1.5 text-sm font-bold rounded-t-lg transition-colors border-t border-l border-r ${isActive ? 'bg-white text-indigo-600 border-indigo-200 border-b-white translate-y-[1px]' : 'bg-gray-100 text-gray-500 border-gray-200 hover:bg-gray-50'}`;
            btn.innerText = unitName;
            btn.onclick = () => { appData.currentUnit = unitName; reRender(); };
            tabsContainer.appendChild(btn);
        });

    function parseCSV(text) {
      const result = []; let row = []; let cell = ''; let insideQuote = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (insideQuote) {
          if (char === '"' && text[i + 1] === '"') { cell += '"'; i++; }
          else if (char === '"') { insideQuote = false; }
          else { cell += char; }
        } else {
          if (char === '"') { insideQuote = true; }
          else if (char === ',') { row.push(cell); cell = ''; }
          else if (char === '\n' || char === '\r') { row.push(cell); result.push(row); row = []; cell = ''; if (char === '\r' && text[i + 1] === '\n') i++; }
          else { cell += char; }
        }
      }
      if (cell || row.length > 0) { row.push(cell); result.push(row); }
      return result;
    }

    async function fetchSheetData(url) {
      if (!url.trim()) return null;
      try {
        const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
        if (!match) throw new Error("유효한 스프레드시트 주소가 아닙니다.");
        const exportUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv`;
        const response = await fetch(exportUrl);
        if (!response.ok) throw new Error("시트 접근 거부. 권한을 확인하세요.");
        return parseCSV(await response.text());
      } catch (error) { throw error; }
    }

    async function handleSyncSheets() {
      const excludeUrl = document.getElementById('excludeNoiseUrl').value;
      const noiseUrl = document.getElementById('noiseUrl').value;
      const syncBtn = document.getElementById('syncBtn');
      const msg = document.getElementById('syncMessage');

      if (!excludeUrl && !noiseUrl) { msg.className = 'text-sm font-medium text-red-600'; msg.innerText = 'URL을 입력해주세요.'; return; }
      syncBtn.disabled = true; syncBtn.innerText = '불러오는 중...'; msg.innerText = '';

      try {
        // --- 비고 자동 매핑 시트 불러오기 시작 ---
        let factorMapping = new Map();
        try {
          const mappingSheetId = '1SrVWQxyv0n_4bQi8roKzk-nXsox-1gjWTY-z0L4H9eg';
          const mappingExportUrl = `https://docs.google.com/spreadsheets/d/${mappingSheetId}/export?format=csv`;
          const mapRes = await fetch(mappingExportUrl);
          if (mapRes.ok) {
            const mapCsv = await mapRes.text();
            const mapRows = parseCSV(mapCsv);
            mapRows.forEach(row => {
               if(row.length >= 2) {
                   const fName = (row[0]||'').trim();
                   const fRemark = (row[1]||'').trim();
                   if(fName) factorMapping.set(fName, fRemark);
               }
            });
          }
        } catch(mapErr) {
          console.warn("비고 매핑 시트를 불러오는데 실패했습니다(무시됨): ", mapErr);
        }
        // --- 비고 자동 매핑 시트 불러오기 끝 ---

        let mergedGroupsByUnit = {}; let excludeKeys = new Set(); let lastKnownUnit = '기본 사업체';

        const processRows = (rows, isNoiseSheet = false) => {
          if (!rows || rows.length < 2) return;
          let lastDept = '', lastProcess = '';

          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length < 4) continue;
            
            let unitName = row[0]?.trim() || '';
            if (unitName !== '') lastKnownUnit = unitName; else unitName = lastKnownUnit;
            
            let dept = row[1]?.trim() || ''; let process = row[2]?.trim() || '';
            if (dept === '' && process === '') { dept = lastDept; process = lastProcess; } 
            else { lastDept = dept; lastProcess = process; }
            if (!dept && !process) continue;

            const key = `${unitName}|${dept}|${process}`;
            if (!mergedGroupsByUnit[unitName]) mergedGroupsByUnit[unitName] = {};
            if (!isNoiseSheet) excludeKeys.add(key);

            if (!mergedGroupsByUnit[unitName][key]) {
              mergedGroupsByUnit[unitName][key] = { unit: unitName, department: dept, process: process, shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '', pageBreak: false, factorGroups: [], hasPValue: false };
            }

            const mergedGroup = mergedGroupsByUnit[unitName][key];

            if (!isNoiseSheet) {
              let factor = row[3]?.trim() || ''; let workerCount = (row[4]?.trim()||'').replace(/(\d+)\.\d+/g, '$1'); let shift = row[5]?.trim() || ''; let cycle = row[6]?.trim() || '';
              let pValue = row.length > 15 ? row[15]?.trim() || '' : '';
              let rValue = row.length > 17 ? row[17]?.trim() || '' : '';
              let isAdjusted = (rValue === '횟수조정');
              let isTrigger = (pValue !== '') || isAdjusted;

              if (shift) mergedGroup.shiftSystem = shift;
              if (workerCount) mergedGroup.workerCount = workerCount;
              if (cycle) mergedGroup.exposureCycle = cycle;

              if (isTrigger) { mergedGroup.hasPValue = true; mergedGroup.factorGroups.push({ factors: new Set(), isAdjusted: isAdjusted }); }
              if (factor !== '') {
                if (mergedGroup.factorGroups.length === 0) mergedGroup.factorGroups.push({ factors: new Set(), isAdjusted: false });
                mergedGroup.factorGroups[mergedGroup.factorGroups.length - 1].factors.add(factor);
                if (isAdjusted) { mergedGroup.factorGroups[mergedGroup.factorGroups.length - 1].isAdjusted = true; mergedGroup.hasPValue = true; }
              }
            } else {
              let pValue = row.length > 15 ? row[15]?.trim() || '' : '';
              let mValue = row.length > 12 ? row[12]?.trim() || '' : '';
              let isAdjusted = (mValue === '횟수조정');
              let isTrigger = (pValue !== '') || isAdjusted;

              let isNewKey = !excludeKeys.has(key);
              if (isNewKey) {
                let workerCount = (row[3]?.trim()||'').replace(/(\d+)\.\d+/g, '$1'); let shift = row[5]?.trim() || ''; let cycle = row[6]?.trim() || '';
                if (shift) mergedGroup.shiftSystem = shift; if (workerCount) mergedGroup.workerCount = workerCount; if (cycle) mergedGroup.exposureCycle = cycle;
              }
              if (isTrigger) { mergedGroup.hasPValue = true; const noiseSet = new Set(); noiseSet.add('소음'); mergedGroup.factorGroups.push({ factors: noiseSet, isAdjusted: isAdjusted }); }
            }
          }
        };

        if (excludeUrl) { processRows(await fetchSheetData(excludeUrl), false); }
        if (noiseUrl) { processRows(await fetchSheetData(noiseUrl), true); }

        let totalExtracted = 0; let newAppUnits = {};

        for (const unitName in mergedGroupsByUnit) {
            const newWorkers = Object.values(mergedGroupsByUnit[unitName]).filter(group => group.hasPValue).map((group) => {
                let uniqueFactorsMap = new Map();
                group.factorGroups.forEach(fg => {
                  let str = Array.from(fg.factors).join(', ').trim();
                  if (str !== '') { if (!uniqueFactorsMap.has(str) || fg.isAdjusted) uniqueFactorsMap.set(str, fg.isAdjusted); }
                });
                let formattedFactors = [];
                uniqueFactorsMap.forEach((isAdjusted, name) => { 
                  let autoRemark = factorMapping.get(name) || '';
                  formattedFactors.push({ name: name, a: '', p: '', l: '', n: '', remark: autoRemark, isAdjusted: isAdjusted }); 
                });
                
                // [소음] 인자가 무조건 최상단(배열 0번째)에 오도록 정렬
                formattedFactors.sort((a, b) => {
                    const aIsNoise = (a.name || '').includes('소음');
                    const bIsNoise = (b.name || '').includes('소음');
                    if (aIsNoise && !bIsNoise) return -1;
                    if (!aIsNoise && bIsNoise) return 1;
                    return 0;
                });

                if (formattedFactors.length === 0) formattedFactors.push({ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false });

                return {
                  id: Date.now() + Math.random(), day: 1, department: group.department, process: group.process, shiftSystem: group.shiftSystem, workerCount: group.workerCount, exposureCycle: group.exposureCycle, measurementCount: group.measurementCount,
                  name: '', isManual: false, pageBreak: false, harmfulFactors: formattedFactors
                };
            });
            if (newWorkers.length > 0) { newAppUnits[unitName] = newWorkers; totalExtracted += newWorkers.length; }
        }

        if (Object.keys(newAppUnits).length > 0) {
          appData.units = newAppUnits; appData.currentDay = 1; appData.currentUnit = 'ALL';
          recalculateNames();
          document.getElementById('tabContainerSection').classList.remove('hidden');
          msg.className = 'text-sm font-medium text-green-600'; msg.innerText = `연동 완료: ${totalExtracted}건의 측정대상이 추출되었습니다.`;
        } else {
          msg.className = 'text-sm font-medium text-red-600'; msg.innerText = '조건에 맞는 데이터가 없습니다.';
        }
      } catch (error) { msg.className = 'text-sm font-medium text-red-600'; msg.innerText = error.message; } 
      finally { syncBtn.disabled = false; syncBtn.innerText = '데이터 연동하기'; reRender(); }
    }

    // 방향키 이동 로직
    document.addEventListener('keydown', function(e) {
      const current = e.target;
      if (current.tagName !== 'TEXTAREA' || !current.hasAttribute('data-focus-id')) return;

      const isUp = e.key === 'ArrowUp'; const isDown = e.key === 'ArrowDown'; const isLeft = e.key === 'ArrowLeft'; const isRight = e.key === 'ArrowRight';
      if (!isUp && !isDown && !isLeft && !isRight) return;
      if (isLeft && current.selectionStart > 0) return;
      if (isRight && current.selectionEnd < current.value.length) return;
      if (isUp || isDown) {
          const lines = current.value.substr(0, current.selectionStart).split("\n");
          if(isUp && lines.length > 1) return; if(isDown && lines.length < current.value.split("\n").length) return;
      }
      e.preventDefault();

      const currentRect = current.getBoundingClientRect();
      const inputs = Array.from(document.querySelectorAll('#tables-container .block textarea:not([type="hidden"]):not([readonly])'));
      let bestMatch = null; let minDistance = Infinity;
      const cx = currentRect.left + currentRect.width / 2; const cy = currentRect.top + currentRect.height / 2;

      inputs.forEach(input => {
        if (input === current) return;
        const rect = input.getBoundingClientRect();
        const ix = rect.left + rect.width / 2; const iy = rect.top + rect.height / 2;
        let isEligible = false; let distance = Infinity;
        const xOverlap = Math.max(0, Math.min(currentRect.right, rect.right) - Math.max(currentRect.left, rect.left));
        const yOverlap = Math.max(0, Math.min(currentRect.bottom, rect.bottom) - Math.max(currentRect.top, rect.top));

        if (isUp && iy < cy && xOverlap > 0) { isEligible = true; distance = cy - iy; }
        else if (isDown && iy > cy && xOverlap > 0) { isEligible = true; distance = iy - cy; }
        else if (isLeft && ix < cx && yOverlap > 0) { isEligible = true; distance = cx - ix; }
        else if (isRight && ix > cx && yOverlap > 0) { isEligible = true; distance = ix - cx; }

        if (!isEligible) {
             if (isUp && rect.bottom <= currentRect.top + 5) { isEligible = true; distance = (currentRect.top - rect.bottom)*10 + Math.abs(cx - ix); } 
             else if (isDown && rect.top >= currentRect.bottom - 5) { isEligible = true; distance = (rect.top - currentRect.bottom)*10 + Math.abs(cx - ix); } 
             else if (isLeft && rect.right <= currentRect.left + 5) { isEligible = true; distance = (currentRect.left - rect.right)*10 + Math.abs(cy - iy); } 
             else if (isRight && rect.left >= currentRect.right - 5) { isEligible = true; distance = (rect.left - currentRect.right)*10 + Math.abs(cy - iy); }
        }
        if (isEligible && distance < minDistance) { minDistance = distance; bestMatch = input; }
      });

      if (bestMatch) {
        bestMatch.focus();
        if (isLeft) bestMatch.setSelectionRange(bestMatch.value.length, bestMatch.value.length);
        else if (isRight) bestMatch.setSelectionRange(0, 0);
        else bestMatch.setSelectionRange(bestMatch.value.length, bestMatch.value.length);
      }
    });

    // 초기화 및 렌더링
    recalculateNames();
    renderTables();
  </script>
</body>
</html>
