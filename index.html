<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>작업환경측정 계획서</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      @page { size: landscape; margin: 8mm; }
      body { background-color: white !important; }
      
      .print\:hidden { display: none !important; }
      .print\:block { display: block !important; }
      .print\:bg-transparent { background-color: transparent !important; }
      
      * {
        font-size: 8.5px !important;
        line-height: 1.15 !important;
      }
      
      table { border-collapse: collapse; width: 100% !important; }
      th, td { padding: 1px 2px !important; border: 1px solid black !important; }
      
      textarea { color: black !important; -webkit-print-color-adjust: exact; padding: 0 !important; background: transparent !important; border: none !important; resize: none !important; }
      textarea::placeholder { color: transparent !important; }
      
      .print-flex-row { display: flex !important; flex-direction: row !important; align-items: stretch !important; width: 100% !important; }
      .print-border-b { border-bottom: 1px solid black !important; }
      .print-border-b:last-child { border-bottom: none !important; }
      .print-border-r { border-right: 1px solid black !important; }
      
      .col-factor { width: auto !important; flex: 1 1 auto !important; padding-right: 2px !important; }
      .col-apln { width: 18px !important; flex: none !important; text-align: center !important; }
      .col-remark { width: 35px !important; flex: none !important; }
      
      .page-break-before {
        page-break-before: always !important;
        break-before: page !important;
      }
      tr { page-break-inside: avoid; }
    }
    
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    
    .col-factor { width: 280px; flex-grow: 1; }
    .col-apln { width: 32px; flex-shrink: 0; }
    .col-remark { width: 70px; flex-shrink: 0; }
    
    textarea {
      field-sizing: content;
      resize: none;
      overflow-y: hidden;
      min-height: 20px;
      word-break: break-all;
    }
    textarea:focus { background-color: #f0f9ff !important; outline: none; }
    
    /* 탭 스크롤바 숨김 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen p-4 md:p-8">
  
  <div class="max-w-[1550px] mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200 print:shadow-none print:border-none print:max-w-full">
    
    <div class="bg-slate-800 p-6 flex flex-col md:flex-row justify-between items-center text-white print:hidden gap-4">
      <div class="flex items-center gap-3 w-full md:w-auto justify-center md:justify-start">
        <svg class="w-8 h-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <h1 class="text-2xl font-bold">작업환경측정 계획서</h1>
      </div>
      <div class="flex items-center gap-2 flex-wrap justify-center">
        <button onclick="downloadExcel()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg transition-colors shadow-sm text-sm">
          <span id="excelBtnText">현재 탭 엑셀 저장</span>
        </button>
        <button id="copyBtn" onclick="copyTableToClipboard()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg transition-colors shadow-sm text-sm">
          <span id="copyBtnText">현재 탭 표 복사</span>
        </button>
        <button onclick="window.print()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg transition-colors shadow-sm text-sm">
          <span>인쇄 / PDF</span>
        </button>
      </div>
    </div>

    <div class="p-4 md:p-6 space-y-6 print:p-0 print:space-y-0">
      
      <section class="bg-blue-50 p-5 rounded-lg border border-blue-100 print:hidden">
        <div class="flex items-center gap-2 mb-2">
          <h2 class="text-base font-semibold text-blue-800">구글 스프레드시트 데이터 연동</h2>
          <span class="text-[10px] bg-blue-200 text-blue-800 px-2 py-0.5 rounded-full font-medium">A열(단위사업체) 자동 그룹화 / B·C열 병합</span>
        </div>
        <p class="text-xs text-blue-600 mb-3 bg-white p-2 rounded border border-blue-100 shadow-sm">
          <span class="font-bold text-red-500">* 중요:</span> 구글 시트 권한을 <strong>'링크가 있는 모든 사용자(뷰어)'</strong>로 변경해주세요. (A열: 단위사업체, B열: 부서, C열: 공정)
        </p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">'소음제외' 시트 URL</label>
            <input type="text" id="excludeNoiseUrl" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white" placeholder="https://docs.google.com/spreadsheets/d/..." />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">'소음' 시트 URL</label>
            <input type="text" id="noiseUrl" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white" placeholder="https://docs.google.com/spreadsheets/d/..." />
          </div>
        </div>
        <div class="flex items-center gap-3">
          <button id="syncBtn" onclick="handleSyncSheets()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg transition-colors font-medium text-sm shadow-sm disabled:bg-blue-300">
            데이터 연동하기
          </button>
          <span id="syncMessage" class="text-xs font-medium text-blue-600"></span>
        </div>
      </section>

      <section class="print:block">
        <div class="flex flex-col mb-4 print:hidden">
          <div class="flex justify-between items-end mb-2">
            <h2 class="text-lg font-semibold text-gray-800">단위사업체별 측정계획</h2>
            <span class="text-xs text-gray-500">방향키(상하좌우)로 셀 자유 이동 지원</span>
          </div>
          
          <!-- 단위사업체 탭 -->
          <div class="flex items-center border-b border-gray-300 overflow-x-auto no-scrollbar pt-2" id="unitTabs">
            <!-- JS 렌더링 -->
          </div>
        </div>

        <h2 id="printTitle" class="hidden print:block text-center text-lg font-bold mb-4">작업환경측정 계획서 (<span id="printUnitName"></span>)</h2>

        <div class="overflow-x-auto border border-gray-300 rounded-lg print:border-black print:border-none print:rounded-none">
          <table id="mainTable" class="w-full text-left text-sm whitespace-nowrap min-w-[1300px] print:min-w-0 print:text-[8.5px]">
            <thead class="bg-gray-100 text-gray-700 font-semibold border-b border-gray-300 print:bg-gray-200 print:border-black print:text-black">
              <tr>
                <th class="px-1 py-2 w-10 text-center border-r border-gray-300 print:border-black">No.</th>
                <th class="px-2 py-2 w-24 border-r border-gray-300 print:border-black text-center">부서명</th>
                <th class="px-2 py-2 w-28 border-r border-gray-300 print:border-black text-center">공정명</th>
                <th class="px-1 py-2 w-14 border-r border-gray-300 print:border-black text-center">교대제</th>
                <th class="px-1 py-2 w-16 border-r border-gray-300 print:border-black text-center">근로자수</th>
                <th class="px-1 py-2 w-16 border-r border-gray-300 print:border-black text-center">노출주기</th>
                <th class="px-1 py-2 w-16 border-r border-gray-300 print:border-black text-center">측정건수</th>
                <th class="px-2 py-2 w-24 border-r border-gray-300 print:border-black text-center">근로자명</th>
                
                <th class="p-0 border-r border-gray-300 print:border-black" colspan="6">
                  <div class="flex w-full h-full text-center">
                    <div class="col-factor px-2 py-2 border-r border-gray-300 print:border-black flex items-center justify-center">유해인자 (발생물질 등)</div>
                    <div class="col-apln px-1 py-2 border-r border-gray-300 print:border-black flex items-center justify-center">A</div>
                    <div class="col-apln px-1 py-2 border-r border-gray-300 print:border-black flex items-center justify-center">P</div>
                    <div class="col-apln px-1 py-2 border-r border-gray-300 print:border-black flex items-center justify-center">L</div>
                    <div class="col-apln px-1 py-2 border-r border-gray-300 print:border-black flex items-center justify-center">N</div>
                    <div class="col-remark px-1 py-2 flex items-center justify-center">비고</div>
                  </div>
                </th>
                <th class="px-2 py-2 w-20 text-center print:hidden">관리</th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-gray-300 print:divide-black border-b border-gray-300 print:border-black">
              <!-- JS 영역 -->
            </tbody>
          </table>
          <div class="p-2 bg-gray-50 border-t border-gray-200 print:hidden flex justify-center">
            <button onclick="addWorker()" class="flex items-center gap-1 text-sm font-medium text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 px-4 py-1.5 rounded shadow-sm transition-all">
              <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
              부서 행 추가 (현재 사업체)
            </button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    let units = ['기본 사업체'];
    let activeUnit = '기본 사업체';

    let workers = [
      {
        id: 1, unit: '기본 사업체', department: '', process: '', shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '',
        pageBreak: false,
        harmfulFactors: [{ name: '', a: '', p: '', l: '', n: '', remark: '' }]
      }
    ];

    let activeFocusId = null;
    let selectionStart = null;
    let selectionEnd = null;

    function saveFocus() {
      const active = document.activeElement;
      if (active && active.dataset.focusId) {
        activeFocusId = active.dataset.focusId;
        selectionStart = active.selectionStart;
        selectionEnd = active.selectionEnd;
      } else {
        activeFocusId = null;
      }
    }

    function restoreFocus() {
      if (activeFocusId) {
        const el = document.querySelector(`[data-focus-id="${activeFocusId}"]`);
        if (el) {
          el.focus();
          try {
            if (el.tagName.toLowerCase() === 'textarea') {
              el.setSelectionRange(selectionStart, selectionEnd);
            }
          } catch(e) {}
        }
      }
    }

    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = (el.scrollHeight) + 'px';
    }

    function calculateSpans(visibleWorkers) {
      const groupFields = ['department', 'process', 'shiftSystem', 'workerCount', 'exposureCycle', 'measurementCount'];
      const spans = new Array(visibleWorkers.length).fill(1);
      for (let i = 0; i < visibleWorkers.length; i++) {
        if (spans[i] === 0) continue;
        let count = 1;
        for (let j = i + 1; j < visibleWorkers.length; j++) {
          const isSame = groupFields.every(field => visibleWorkers[i][field] === visibleWorkers[j][field]);
          if (isSame) {
            count++;
            spans[j] = 0;
          } else {
            break;
          }
        }
        spans[i] = count;
      }
      return spans;
    }

    function renderTabs() {
      const container = document.getElementById('unitTabs');
      let html = '';
      units.forEach(u => {
        const isActive = u === activeUnit;
        const baseClass = "px-5 py-2.5 text-sm font-semibold whitespace-nowrap border-b-2 cursor-pointer transition-colors";
        const activeClass = isActive ? "border-blue-600 text-blue-700 bg-white" : "border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-100";
        html += `<div onclick="switchUnit('${u}')" class="${baseClass} ${activeClass}">${u || '미지정'}</div>`;
      });
      
      html += `<div onclick="addNewUnit()" class="px-3 py-2.5 text-sm font-bold text-gray-400 hover:text-blue-600 cursor-pointer border-b-2 border-transparent hover:bg-gray-100 flex items-center" title="새 단위사업체 추가">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
               </div>`;
      
      container.innerHTML = html;
      document.getElementById('printUnitName').innerText = activeUnit || '미지정';
    }

    function switchUnit(unitName) {
      saveFocus();
      activeUnit = unitName;
      renderTabs();
      renderTableBody();
      restoreFocus();
    }

    function addNewUnit() {
      const name = prompt('새로운 단위사업체 이름을 입력하세요:');
      if (name && name.trim() !== '') {
        const cleanName = name.trim();
        if (!units.includes(cleanName)) {
          units.push(cleanName);
        }
        activeUnit = cleanName;
        const newId = workers.length > 0 ? Math.max(...workers.map(w => w.id)) + 1 : 1;
        workers.push({
          id: newId, unit: cleanName, department: '', process: '', shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '', pageBreak: false,
          harmfulFactors: [{ name: '', a: '', p: '', l: '', n: '', remark: '' }]
        });
        renderTabs();
        renderTableBody();
      }
    }

    function updateWorker(id, field, value) {
      saveFocus();
      workers = workers.map(w => w.id === id ? { ...w, [field]: value } : w);
      renderTableBody();
      restoreFocus();
    }

    function updateGroupField(visibleIndex, rowSpan, field, value, visibleWorkers) {
      saveFocus();
      const idsToUpdate = visibleWorkers.slice(visibleIndex, visibleIndex + rowSpan).map(w => w.id);
      workers = workers.map(w => idsToUpdate.includes(w.id) ? { ...w, [field]: value } : w);
      renderTableBody();
      restoreFocus();
    }

    function updateFactor(workerId, factorIndex, field, value) {
      saveFocus();
      workers = workers.map(worker => {
        if (worker.id === workerId) {
          const newFactors = [...worker.harmfulFactors];
          newFactors[factorIndex][field] = value;
          return { ...worker, harmfulFactors: newFactors };
        }
        return worker;
      });
      renderTableBody();
      restoreFocus();
    }

    function addWorker() {
      const newId = workers.length > 0 ? Math.max(...workers.map(w => w.id)) + 1 : 1;
      workers.push({
        id: newId, unit: activeUnit, department: '', process: '', shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '', pageBreak: false,
        harmfulFactors: [{ name: '', a: '', p: '', l: '', n: '', remark: '' }]
      });
      renderTableBody();
    }

    function removeWorker(id) {
      workers = workers.filter(w => w.id !== id);
      const remainingInUnit = workers.filter(w => w.unit === activeUnit);
      if (remainingInUnit.length === 0) {
        addWorker();
      } else {
        renderTableBody();
      }
    }

    function duplicateWorker(id) {
      const index = workers.findIndex(w => w.id === id);
      if (index === -1) return;
      const workerToCopy = workers[index];
      const newId = workers.length > 0 ? Math.max(...workers.map(w => w.id)) + 1 : 1;
      const clonedWorker = {
        ...workerToCopy,
        id: newId,
        pageBreak: false,
        harmfulFactors: workerToCopy.harmfulFactors.map(factor => ({ ...factor }))
      };
      workers.splice(index + 1, 0, clonedWorker);
      renderTableBody();
    }

    function togglePageBreak(id) {
      workers = workers.map(w => w.id === id ? { ...w, pageBreak: !w.pageBreak } : w);
      renderTableBody();
    }

    function addFactor(workerId) {
      workers = workers.map(worker => {
        if (worker.id === workerId) {
          return { ...worker, harmfulFactors: [...worker.harmfulFactors, { name: '', a: '', p: '', l: '', n: '', remark: '' }] };
        }
        return worker;
      });
      renderTableBody();
    }

    function removeFactor(workerId, factorIndex) {
      workers = workers.map(worker => {
        if (worker.id === workerId) {
          const newFactors = worker.harmfulFactors.filter((_, idx) => idx !== factorIndex);
          return {
            ...worker,
            harmfulFactors: newFactors.length ? newFactors : [{ name: '', a: '', p: '', l: '', n: '', remark: '' }]
          };
        }
        return worker;
      });
      renderTableBody();
    }

    function renderTableBody() {
      const visibleWorkers = workers.filter(w => w.unit === activeUnit);
      const tbody = document.getElementById('table-body');
      const spans = calculateSpans(visibleWorkers);
      let html = '';
      let currentPage = 1;

      visibleWorkers.forEach((worker, index) => {
        const rowSpan = spans[index];
        
        if (worker.pageBreak) {
          currentPage++;
          html += `
          <tr class="print:hidden bg-indigo-50 border-t-2 border-b-2 border-indigo-200">
            <td colspan="15" class="text-center py-1 text-indigo-700 font-bold text-xs tracking-wide">
              ✂️ 여기서부터 ${currentPage}페이지 첫 줄로 출력됩니다 ✂️
            </td>
          </tr>
          `;
        }

        const pageBreakClass = worker.pageBreak ? 'page-break-before' : '';
        html += `<tr class="hover:bg-gray-50 print:hover:bg-transparent transition-colors group border-b border-gray-300 print:border-black ${pageBreakClass}">`;
        
        html += `<td class="px-1 py-2 text-center text-gray-500 border-r border-gray-300 print:border-black align-top pt-3">${index + 1}</td>`;
        
        if (rowSpan > 0) {
          const genGroupTd = (field, placeholder, idPrefix) => {
            return `<td class="px-1 py-1 border-r border-gray-300 print:border-black align-top" rowspan="${rowSpan}">
                      <div class="flex flex-col h-full w-full justify-start pt-1">
                        <textarea data-focus-id="${idPrefix}-${worker.id}" oninput="updateGroupField(${index}, ${rowSpan}, '${field}', this.value, visibleWorkers); autoResizeTextarea(this);" placeholder="${placeholder}" class="w-full bg-transparent border-none outline-none p-1 text-center print:hidden break-words" rows="1">${worker[field]}</textarea>
                        <div class="hidden print:block w-full whitespace-pre-wrap break-words leading-tight text-center">${worker[field]}</div>
                      </div>
                    </td>`;
          };

          html += genGroupTd('department', '부서', 'dept');
          html += genGroupTd('process', '공정', 'proc');
          html += genGroupTd('shiftSystem', '교대', 'shift');
          html += genGroupTd('workerCount', '명', 'cnt');
          html += genGroupTd('exposureCycle', '주기', 'cycle');
          html += genGroupTd('measurementCount', '건수', 'mcnt');
        }

        html += `<td class="px-1 py-1 border-r border-gray-300 print:border-black align-top">
                  <div class="flex flex-col h-full w-full justify-start pt-1">
                    <textarea data-focus-id="name-${worker.id}" oninput="updateWorker(${worker.id}, 'name', this.value); autoResizeTextarea(this);" placeholder="이름" class="w-full bg-transparent border-none outline-none p-1 text-center print:hidden break-words" rows="1">${worker.name}</textarea>
                    <div class="hidden print:block w-full whitespace-pre-wrap break-words leading-tight text-center">${worker.name}</div>
                  </div>
                 </td>`;

        html += `<td class="p-0 border-r border-gray-300 print:border-black align-top" colspan="6">
                  <div class="flex flex-col h-full w-full">`;
        
        worker.harmfulFactors.forEach((factor, fIndex) => {
          const isLast = fIndex === worker.harmfulFactors.length - 1;
          const borderClass = !isLast ? 'border-b border-gray-300 print:border-b' : '';
          
          html += `<div class="print-flex-row flex w-full ${borderClass} min-h-[34px] relative">
                      
                      <div class="col-factor border-r border-gray-300 print-border-r px-1 py-1 flex items-center print:items-start">
                        <textarea data-focus-id="fname-${worker.id}-${fIndex}" oninput="updateFactor(${worker.id}, ${fIndex}, 'name', this.value); autoResizeTextarea(this);" class="w-full bg-transparent outline-none print:hidden pr-5 text-xs break-words pt-1" placeholder="유해인자 입력" rows="1">${factor.name}</textarea>
                        <div class="hidden print:block w-full whitespace-pre-wrap break-words leading-tight">${factor.name}</div>
                      </div>

                      ${['a', 'p', 'l', 'n'].map(field => `
                      <div class="col-apln border-r border-gray-300 print-border-r flex items-center justify-center p-0.5">
                        <textarea data-focus-id="f${field}-${worker.id}-${fIndex}" oninput="updateFactor(${worker.id}, ${fIndex}, '${field}', this.value); autoResizeTextarea(this);" class="w-full text-center bg-transparent outline-none uppercase print:hidden break-words" rows="1">${factor[field]}</textarea>
                        <div class="hidden print:block w-full whitespace-pre-wrap break-words leading-tight text-center uppercase">${factor[field]}</div>
                      </div>
                      `).join('')}

                      <div class="col-remark flex items-center justify-center px-1 py-1 print:items-start">
                        <textarea data-focus-id="frem-${worker.id}-${fIndex}" oninput="updateFactor(${worker.id}, ${fIndex}, 'remark', this.value); autoResizeTextarea(this);" class="w-full bg-transparent outline-none print:hidden text-center text-xs break-words pt-1" placeholder="비고" rows="1">${factor.remark}</textarea>
                        <div class="hidden print:block w-full whitespace-pre-wrap break-words leading-tight text-center">${factor.remark}</div>
                      </div>
                      
                      <button onclick="removeFactor(${worker.id}, ${fIndex})" class="absolute left-[-18px] top-1.5 text-gray-300 hover:text-red-500 print:hidden p-0.5 bg-white rounded-full shadow-sm border border-gray-200" title="삭제" style="z-index: 10;">
                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                      </button>
                   </div>`;
        });

        html += `<div class="p-1 print:hidden flex justify-center bg-gray-50/50 ${worker.harmfulFactors.length > 0 ? 'border-t border-gray-200' : ''}">
                   <button onclick="addFactor(${worker.id})" class="text-[10px] flex items-center gap-1 text-blue-600 hover:text-blue-800 font-medium">
                     <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
                     유해인자 추가
                   </button>
                 </div>
                </div>
               </td>`;

        html += `<td class="px-1 py-2 text-center align-middle print:hidden whitespace-nowrap bg-white">
                  <div class="flex flex-col gap-1.5 items-center justify-center h-full">
                    <div class="flex gap-1 justify-center">
                      <button onclick="duplicateWorker(${worker.id})" class="text-gray-500 hover:text-blue-600 p-1 rounded hover:bg-blue-50 border border-gray-200 shadow-sm" title="현재 행 복사">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9" /></svg>
                      </button>
                      <button onclick="removeWorker(${worker.id})" class="text-gray-500 hover:text-red-600 p-1 rounded hover:bg-red-50 border border-gray-200 shadow-sm" title="행 삭제">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                      </button>
                    </div>
                    <button onclick="togglePageBreak(${worker.id})" class="text-[9px] font-semibold flex items-center justify-center gap-1 w-full px-1 py-1 rounded transition-colors ${worker.pageBreak ? 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-inner' : 'text-indigo-600 bg-indigo-50 border border-indigo-200 hover:bg-indigo-100'}" title="이 행부터 다음 페이지에 인쇄">
                      ✂️ ${worker.pageBreak ? '나눔 취소' : '페이지 나눔'}
                    </button>
                  </div>
                 </td>`;

        html += `</tr>`;
      });

      tbody.innerHTML = html;
      
      setTimeout(() => {
        const textareas = tbody.querySelectorAll('textarea');
        textareas.forEach(ta => autoResizeTextarea(ta));
      }, 0);
    }

    document.addEventListener('keydown', function(e) {
      if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
      
      const current = document.activeElement;
      if (!current || current.tagName.toLowerCase() !== 'textarea') return;
      const tbody = document.getElementById('table-body');
      if (!tbody.contains(current)) return;

      const isFullySelected = current.selectionStart === 0 && current.selectionEnd === current.value.length;
      const isEmpty = current.value.length === 0;

      if (e.key === 'ArrowLeft' && !isFullySelected && !isEmpty && current.selectionStart > 0) return;
      if (e.key === 'ArrowRight' && !isFullySelected && !isEmpty && current.selectionEnd < current.value.length) return;
      
      e.preventDefault();

      const textareas = Array.from(tbody.querySelectorAll('textarea'));
      const currentRect = current.getBoundingClientRect();
      
      let bestMatch = null;
      let minDistance = Infinity;

      const currCX = currentRect.left + currentRect.width / 2;
      const currCY = currentRect.top + currentRect.height / 2;

      textareas.forEach(ta => {
        if (ta === current) return;
        const targetRect = ta.getBoundingClientRect();
        const targetCX = targetRect.left + targetRect.width / 2;
        const targetCY = targetRect.top + targetRect.height / 2;

        let isMatch = false;
        let primaryDist = 0;
        let secondaryDist = 0;

        if (e.key === 'ArrowUp' && targetCY < currCY) {
          isMatch = Math.abs(currCX - targetCX) < (targetRect.width / 2 + currentRect.width / 2);
          if(isMatch) { primaryDist = currCY - targetCY; secondaryDist = Math.abs(currCX - targetCX); }
        } else if (e.key === 'ArrowDown' && targetCY > currCY) {
          isMatch = Math.abs(currCX - targetCX) < (targetRect.width / 2 + currentRect.width / 2);
          if(isMatch) { primaryDist = targetCY - currCY; secondaryDist = Math.abs(currCX - targetCX); }
        } else if (e.key === 'ArrowLeft' && targetCX < currCX) {
          isMatch = Math.abs(currCY - targetCY) < (targetRect.height / 2 + currentRect.height / 2);
          if(isMatch) { primaryDist = currCX - targetCX; secondaryDist = Math.abs(currCY - targetCY); }
        } else if (e.key === 'ArrowRight' && targetCX > currCX) {
          isMatch = Math.abs(currCY - targetCY) < (targetRect.height / 2 + currentRect.height / 2);
          if(isMatch) { primaryDist = targetCX - currCX; secondaryDist = Math.abs(currCY - targetCY); }
        }

        if (isMatch) {
           const totalDist = primaryDist + secondaryDist * 2;
           if (totalDist < minDistance) {
               minDistance = totalDist;
               bestMatch = ta;
           }
        }
      });

      if (bestMatch) {
        bestMatch.focus();
        bestMatch.setSelectionRange(0, bestMatch.value.length);
      }
    });

    async function copyTableToClipboard() {
      try {
        const visibleWorkers = workers.filter(w => w.unit === activeUnit);
        let tsvData = "단위사업체\tNo.\t부서명\t공정명\t교대제\t근로자수\t노출주기\t측정건수\t근로자명\t유해인자\tA\tP\tL\tN\t비고\n";
        
        visibleWorkers.forEach((worker, index) => {
          worker.harmfulFactors.forEach((factor, fIndex) => {
            const isFirst = fIndex === 0;
            const safe = (str) => (str || '').replace(/\t/g, ' ').replace(/\n/g, ' ');
            tsvData += `${isFirst ? safe(worker.unit) : ''}\t${isFirst ? index + 1 : ''}\t${isFirst ? safe(worker.department) : ''}\t${isFirst ? safe(worker.process) : ''}\t${isFirst ? safe(worker.shiftSystem) : ''}\t${isFirst ? safe(worker.workerCount) : ''}\t${isFirst ? safe(worker.exposureCycle) : ''}\t${isFirst ? safe(worker.measurementCount) : ''}\t${isFirst ? safe(worker.name) : ''}\t${safe(factor.name)}\t${safe(factor.a)}\t${safe(factor.p)}\t${safe(factor.l)}\t${safe(factor.n)}\t${safe(factor.remark)}\n`;
          });
        });

        await navigator.clipboard.writeText(tsvData);
        document.getElementById('copyBtnText').innerText = '복사 완료!';
        setTimeout(() => document.getElementById('copyBtnText').innerText = '현재 탭 표 복사', 2000);
      } catch (err) {
        document.getElementById('copyBtnText').innerText = '실패(권한)';
        setTimeout(() => document.getElementById('copyBtnText').innerText = '현재 탭 표 복사', 2000);
      }
    }

    function downloadExcel() {
      try {
        const visibleWorkers = workers.filter(w => w.unit === activeUnit);
        let csvData = "\uFEFF단위사업체,No.,부서명,공정명,교대제,근로자수,노출주기,측정건수,근로자명,유해인자,A,P,L,N,비고\n";
        
        visibleWorkers.forEach((worker, index) => {
          worker.harmfulFactors.forEach((factor, fIndex) => {
            const isFirst = fIndex === 0;
            const escapeCSV = (str) => {
              if (!str) return '""';
              const replaced = str.toString().replace(/"/g, '""');
              return `"${replaced}"`;
            };
            
            csvData += `${isFirst ? escapeCSV(worker.unit) : '""'},` +
                       `${isFirst ? index + 1 : ''},` +
                       `${isFirst ? escapeCSV(worker.department) : '""'},` +
                       `${isFirst ? escapeCSV(worker.process) : '""'},` +
                       `${isFirst ? escapeCSV(worker.shiftSystem) : '""'},` +
                       `${isFirst ? escapeCSV(worker.workerCount) : '""'},` +
                       `${isFirst ? escapeCSV(worker.exposureCycle) : '""'},` +
                       `${isFirst ? escapeCSV(worker.measurementCount) : '""'},` +
                       `${isFirst ? escapeCSV(worker.name) : '""'},` +
                       `${escapeCSV(factor.name)},${escapeCSV(factor.a)},${escapeCSV(factor.p)},${escapeCSV(factor.l)},${escapeCSV(factor.n)},${escapeCSV(factor.remark)}\n`;
          });
        });

        const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        if (link.download !== undefined) {
          const url = URL.createObjectURL(blob);
          link.setAttribute("href", url);
          link.setAttribute("download", `작업환경측정_계획서_${activeUnit}.csv`);
          link.style.visibility = 'hidden';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }
      } catch (err) {
        document.getElementById('excelBtnText').innerText = '다운로드 오류';
        setTimeout(() => document.getElementById('excelBtnText').innerText = '현재 탭 엑셀 저장', 2000);
      }
    }

    function parseCSV(text) {
      const result = [];
      let row = [];
      let cell = '';
      let insideQuote = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (insideQuote) {
          if (char === '"' && text[i + 1] === '"') { cell += '"'; i++; }
          else if (char === '"') { insideQuote = false; }
          else { cell += char; }
        } else {
          if (char === '"') { insideQuote = true; }
          else if (char === ',') { row.push(cell); cell = ''; }
          else if (char === '\n' || char === '\r') {
            row.push(cell); result.push(row); row = []; cell = '';
            if (char === '\r' && text[i + 1] === '\n') i++;
          }
          else { cell += char; }
        }
      }
      if (cell || row.length > 0) { row.push(cell); result.push(row); }
      return result;
    }

    async function fetchSheetData(url) {
      if (!url.trim()) return null;
      try {
        const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
        if (!match) throw new Error("URL 형식이 잘못되었습니다.");
        const exportUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv`;
        const response = await fetch(exportUrl);
        if (!response.ok) throw new Error("시트 접근 거부(권한을 확인하세요).");
        const text = await response.text();
        return parseCSV(text);
      } catch (error) { throw error; }
    }

    async function handleSyncSheets() {
      const excludeUrl = document.getElementById('excludeNoiseUrl').value;
      const noiseUrl = document.getElementById('noiseUrl').value;
      const syncBtn = document.getElementById('syncBtn');
      const msg = document.getElementById('syncMessage');

      if (!excludeUrl && !noiseUrl) {
        msg.className = 'text-xs font-medium text-red-600';
        msg.innerText = 'URL을 입력해주세요.';
        return;
      }

      syncBtn.disabled = true;
      syncBtn.innerText = '불러오는 중...';
      msg.innerText = '';

      try {
        let mergedGroups = {};

        const processRows = (rows, isNoiseSheet = false) => {
          if (!rows || rows.length < 2) return;
          let lastUnit = '', lastDept = '', lastProcess = '';

          for (let i = 1; i < rows.length; i++) {
            const row = rows[i] || [];
            
            let unit = (row[0] || '').trim();
            let dept = (row[1] || '').trim();
            let process = (row[2] || '').trim();

            if (unit === '' && dept === '' && process === '') {
              unit = lastUnit; dept = lastDept; process = lastProcess;
            } else {
              if (unit) lastUnit = unit; else unit = lastUnit;
              if (dept) lastDept = dept; else dept = lastDept;
              if (process) lastProcess = process; else process = lastProcess;
            }

            if (!unit && !dept && !process) continue;

            const key = `${unit}|${dept}|${process}`;
            const removeDecimal = (val) => val ? val.replace(/(\d+)\.\d+/g, '$1') : '';

            // 소음 시트 근로자수는 D열(3), 소음제외는 E열(4)
            let workerCount = removeDecimal(isNoiseSheet ? (row[3] || '').trim() : (row[4] || '').trim());
            let shift = (row[5] || '').trim();
            let cycle = (row[6] || '').trim();

            if (!mergedGroups[key]) {
              mergedGroups[key] = {
                unit: unit, department: dept, process: process, shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '', pageBreak: false,
                factorGroups: [], isFromExcludeNoise: false
              };
            }

            if (!isNoiseSheet) {
              mergedGroups[key].isFromExcludeNoise = true;
              if (shift) mergedGroups[key].shiftSystem = shift;
              if (workerCount) mergedGroups[key].workerCount = workerCount;
              if (cycle) mergedGroups[key].exposureCycle = cycle;

              let factor = (row[3] || '').trim();
              let pValue = row.length > 15 ? (row[15] || '').trim() : '';

              if (pValue !== '') mergedGroups[key].factorGroups.push(new Set());
              if (factor !== '') {
                if (mergedGroups[key].factorGroups.length === 0) mergedGroups[key].factorGroups.push(new Set());
                mergedGroups[key].factorGroups[mergedGroups[key].factorGroups.length - 1].add(factor);
              }
            } else {
              // 소음 시트 조건부: 기존 소음제외에 없던 데이터일 때만 E(교대), D(근로자수), G(노출주기) 적용
              if (!mergedGroups[key].isFromExcludeNoise) {
                if (shift) mergedGroups[key].shiftSystem = shift;
                if (workerCount) mergedGroups[key].workerCount = workerCount;
                if (cycle) mergedGroups[key].exposureCycle = cycle;
              }
              const noiseSet = new Set(['소음']);
              mergedGroups[key].factorGroups.push(noiseSet);
            }
          }
        };

        if (excludeUrl) {
          const rows1 = await fetchSheetData(excludeUrl);
          processRows(rows1, false);
        }
        if (noiseUrl) {
          const rows2 = await fetchSheetData(noiseUrl);
          processRows(rows2, true);
        }

        const newWorkers = Object.values(mergedGroups)
          .filter(group => group.factorGroups.length > 0)
          .map((group, index) => {
            let formattedFactors = [];
            let seenFactors = new Set();

            group.factorGroups.forEach(set => {
              let factorStr = Array.from(set).map(s => s.trim()).filter(s => s).join(', ');
              if (factorStr && !seenFactors.has(factorStr)) {
                seenFactors.add(factorStr);
                formattedFactors.push({ name: factorStr, a: '', p: '', l: '', n: '', remark: '' });
              }
            });

            if (formattedFactors.length === 0) {
              formattedFactors = [{ name: '', a: '', p: '', l: '', n: '', remark: '' }];
            }

            return {
              id: Date.now() + index,
              unit: group.unit || '미분류',
              department: group.department,
              process: group.process,
              shiftSystem: group.shiftSystem,
              workerCount: group.workerCount,
              exposureCycle: group.exposureCycle,
              measurementCount: group.measurementCount,
              name: group.name,
              pageBreak: false,
              harmfulFactors: formattedFactors
            };
          });

        if (newWorkers.length > 0) {
          workers = newWorkers;
          
          // 유니크한 사업체명 추출 및 탭 세팅
          const uniqueUnits = [...new Set(workers.map(w => w.unit).filter(Boolean))];
          units = uniqueUnits.length > 0 ? uniqueUnits : ['기본 사업체'];
          activeUnit = units[0];

          renderTabs();
          renderTableBody();
          
          msg.className = 'text-xs font-medium text-green-600';
          msg.innerText = `연동 완료: ${units.length}개 단위사업체 추출`;
        } else {
          msg.className = 'text-xs font-medium text-red-600';
          msg.innerText = '조건에 맞는 데이터가 없습니다.';
        }
      } catch (error) {
        msg.className = 'text-xs font-medium text-red-600';
        msg.innerText = error.message;
      } finally {
        syncBtn.disabled = false;
        syncBtn.innerText = '데이터 연동하기';
      }
    }

    renderTabs();
    renderTableBody();
  </script>
