<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>작업환경측정 계획서</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      @page { size: landscape; margin: 8mm; }
      body { background-color: white !important; font-size: 10px !important; }
      
      /* 인쇄 시 불필요한 요소 숨김 처리 */
      .print\:hidden { display: none !important; }
      .print\:block { display: block !important; }
      
      /* 배경 및 테두리 인쇄용 설정 */
      .print\:bg-transparent { background-color: transparent !important; }
      .print\:border-black { border-color: black !important; }
      .print\:border-none { border: none !important; }
      
      /* 입력창 텍스트 진하게 및 스크롤 고정 해제 */
      input { color: black !important; -webkit-print-color-adjust: exact; padding: 0 !important; height: auto !important; line-height: 1.1 !important; font-size: 10px !important; }
      input::placeholder { color: transparent !important; }
      table { border-collapse: collapse; width: 100% !important; min-width: 0 !important; }
      
      /* 테이블 셀 촘촘하게 */
      th, td { font-size: 10px !important; }
      
      /* 강제 페이지 넘김 CSS */
      .page-break-before {
        page-break-before: always !important;
        break-before: page !important;
      }
    }
    
    /* Chrome, Safari, Edge, Opera에서 input number 화살표 숨기기 */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen p-4 md:p-8">
  
  <div class="max-w-[1450px] mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200 print:shadow-none print:border-none">
    
    <div class="bg-slate-800 p-6 flex justify-between items-center text-white print:bg-white print:text-black print:border-b print:border-black print:p-2 print:mb-4">
      <div class="flex items-center gap-3">
        <svg class="w-8 h-8 print:hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <h1 class="text-2xl font-bold">작업환경측정 계획서</h1>
      </div>
      <div class="flex items-center gap-3 print:hidden">
        <button id="copyBtn" onclick="copyTableToClipboard()" class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition-colors">
          <svg id="copyIconDefault" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <svg id="copyIconCheck" class="w-4 h-4 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
          <span id="copyBtnText">현재 표 데이터 복사</span>
        </button>
        <button onclick="window.print()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors shadow-md border border-blue-800">
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
          <span>전체 인쇄 / PDF 저장</span>
        </button>
      </div>
    </div>

    <div class="p-6 md:p-8 space-y-6 print:p-0 print:space-y-0">
      
      <!-- 인쇄 시 숨겨지는 사업장 기본 정보 -->
      <section class="bg-gray-50 p-5 rounded-lg border border-gray-200 print:hidden">
        <h2 class="text-base font-semibold text-gray-800 mb-3 border-b pb-2">사업장 기본 정보</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">사업장명</label>
            <input type="text" id="companyName" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="예) (주)한국산업" />
          </div>
        </div>
      </section>

      <!-- 인쇄 시 숨겨지는 연동 메뉴 -->
      <section class="bg-blue-50 p-5 rounded-lg border border-blue-100 print:hidden">
        <div class="flex items-center gap-2 mb-3">
          <h2 class="text-base font-semibold text-blue-800">구글 스프레드시트 데이터 연동</h2>
          <span class="text-xs bg-blue-200 text-blue-800 px-2 py-1 rounded-full font-medium">자동 병합 & 소음 조건부 적용</span>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">'소음제외' 시트 URL</label>
            <input type="text" id="excludeNoiseUrl" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white" placeholder="https://docs.google.com/spreadsheets/d/..." />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">'소음' 시트 URL (제외 시트에 없는 경우만 적용)</label>
            <input type="text" id="noiseUrl" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white" placeholder="https://docs.google.com/spreadsheets/d/..." />
          </div>
        </div>
        <div class="flex items-center gap-4">
          <button id="syncBtn" onclick="handleSyncSheets()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition-colors font-medium text-sm shadow-sm disabled:bg-blue-300">
            데이터 연동하기
          </button>
          <span id="syncMessage" class="text-sm font-medium text-blue-600"></span>
        </div>
      </section>

      <!-- 단위사업체 탭 UI 영역 -->
      <section id="tabContainerSection" class="hidden print:hidden">
        <div class="flex items-center justify-between mb-2 border-b border-gray-300 pb-2">
            <h3 class="text-md font-bold text-gray-700 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                단위사업체 탭 선택 (인쇄 시 모두 자동 출력됨)
            </h3>
        </div>
        <div id="unitTabs" class="flex flex-wrap gap-2 mb-2">
            <!-- 탭 버튼들이 JS에 의해 동적으로 생성됩니다. -->
        </div>
      </section>

      <!-- 통합된 전체 단위사업체 테이블 컨테이너 -->
      <div id="tables-container" class="space-y-8 print:space-y-6">
        <!-- JS 렌더링 영역 (단위사업체별로 테이블 생성) -->
      </div>
    </div>
  </div>

  <script>
    // 상태 관리를 위한 전역 변수
    let appData = {
      units: {
        '기본 사업체': [
          {
            id: 1, department: '', process: '', shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '',
            pageBreak: false, 
            harmfulFactors: [{ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false }]
          }
        ]
      },
      currentUnit: '기본 사업체'
    };

    let activeFocusId = null;
    let selectionStart = null;
    let selectionEnd = null;

    function saveFocus() {
      const active = document.activeElement;
      if (active && active.dataset.focusId) {
        activeFocusId = active.dataset.focusId;
        selectionStart = active.selectionStart;
        selectionEnd = active.selectionEnd;
      } else {
        activeFocusId = null;
      }
    }

    function restoreFocus() {
      if (activeFocusId) {
        const el = document.querySelector(`[data-focus-id="${activeFocusId}"]`);
        if (el) {
          el.focus();
          try {
            if (el.type === 'text' || el.type === 'number') {
              el.setSelectionRange(selectionStart, selectionEnd);
            }
          } catch(e) {}
        }
      }
    }

    function calculateSpansForUnit(unitName) {
      const currentWorkers = appData.units[unitName];
      if (!currentWorkers) return [];
      
      const groupFields = ['department', 'process', 'shiftSystem', 'workerCount', 'exposureCycle', 'measurementCount'];
      const spans = new Array(currentWorkers.length).fill(1);
      for (let i = 0; i < currentWorkers.length; i++) {
        if (spans[i] === 0) continue;
        let count = 1;
        for (let j = i + 1; j < currentWorkers.length; j++) {
          const isSame = groupFields.every(field => currentWorkers[i][field] === currentWorkers[j][field]);
          if (isSame) {
            count++;
            spans[j] = 0;
          } else {
            break;
          }
        }
        spans[i] = count;
      }
      return spans;
    }

    function updateWorker(id, field, value) {
      const currentWorkers = appData.units[appData.currentUnit];
      appData.units[appData.currentUnit] = currentWorkers.map(w => w.id === id ? { ...w, [field]: value } : w);
    }

    function updateGroupField(workerIndex, rowSpan, field, value) {
      const currentWorkers = appData.units[appData.currentUnit];
      for (let i = workerIndex; i < workerIndex + rowSpan; i++) {
        currentWorkers[i][field] = value;
      }
    }

    function updateFactor(workerId, factorIndex, field, value) {
      const currentWorkers = appData.units[appData.currentUnit];
      appData.units[appData.currentUnit] = currentWorkers.map(worker => {
        if (worker.id === workerId) {
          const newFactors = [...worker.harmfulFactors];
          newFactors[factorIndex][field] = value;
          return { ...worker, harmfulFactors: newFactors };
        }
        return worker;
      });
    }
    
    function toggleAdjust(workerId, factorIndex) {
      const currentWorkers = appData.units[appData.currentUnit];
      appData.units[appData.currentUnit] = currentWorkers.map(worker => {
        if (worker.id === workerId) {
          const newFactors = [...worker.harmfulFactors];
          newFactors[factorIndex].isAdjusted = !newFactors[factorIndex].isAdjusted;
          return { ...worker, harmfulFactors: newFactors };
        }
        return worker;
      });
      reRender();
    }

    function addWorker() {
      const currentWorkers = appData.units[appData.currentUnit];
      const newId = currentWorkers.length > 0 ? Math.max(...currentWorkers.map(w => w.id)) + 1 : 1;
      currentWorkers.push({
        id: newId, department: '', process: '', shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '', pageBreak: false,
        harmfulFactors: [{ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false }]
      });
      reRender();
    }

    function removeWorker(id) {
      let currentWorkers = appData.units[appData.currentUnit];
      currentWorkers = currentWorkers.filter(w => w.id !== id);
      appData.units[appData.currentUnit] = currentWorkers;
      if (currentWorkers.length === 0) addWorker();
      else reRender();
    }

    function duplicateWorker(id) {
      const currentWorkers = appData.units[appData.currentUnit];
      const index = currentWorkers.findIndex(w => w.id === id);
      if (index === -1) return;
      const workerToCopy = currentWorkers[index];
      const newId = currentWorkers.length > 0 ? Math.max(...currentWorkers.map(w => w.id)) + 1 : 1;
      const clonedWorker = {
        ...workerToCopy,
        id: newId,
        pageBreak: false,
        harmfulFactors: workerToCopy.harmfulFactors.map(factor => ({ ...factor }))
      };
      currentWorkers.splice(index + 1, 0, clonedWorker);
      reRender();
    }

    function togglePageBreak(id) {
      const currentWorkers = appData.units[appData.currentUnit];
      appData.units[appData.currentUnit] = currentWorkers.map(w => w.id === id ? { ...w, pageBreak: !w.pageBreak } : w);
      reRender();
    }

    function addFactor(workerId) {
      const currentWorkers = appData.units[appData.currentUnit];
      appData.units[appData.currentUnit] = currentWorkers.map(worker => {
        if (worker.id === workerId) {
          return { ...worker, harmfulFactors: [...worker.harmfulFactors, { name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false }] };
        }
        return worker;
      });
      reRender();
    }

    function removeFactor(workerId, factorIndex) {
      const currentWorkers = appData.units[appData.currentUnit];
      appData.units[appData.currentUnit] = currentWorkers.map(worker => {
        if (worker.id === workerId) {
          const newFactors = worker.harmfulFactors.filter((_, idx) => idx !== factorIndex);
          return {
            ...worker,
            harmfulFactors: newFactors.length ? newFactors : [{ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false }]
          };
        }
        return worker;
      });
      reRender();
    }

    // 화면 및 인쇄용 전체 테이블 렌더링 (단위사업체가 모두 순차적으로 인쇄되도록 구조화)
    function renderTables() {
      const container = document.getElementById('tables-container');
      let html = '';

      const unitNames = Object.keys(appData.units);
      
      unitNames.forEach((unitName, uIndex) => {
        const currentWorkers = appData.units[unitName];
        const isActive = unitName === appData.currentUnit;
        
        // 탭에 따라 활성화된 것만 보여주되, 인쇄 시에는 전부 보여주도록(print:block) 클래스 설정
        const displayClass = isActive ? 'block' : 'hidden print:block';
        
        html += `<div class="unit-section ${displayClass} print:mb-8" id="unit-wrap-${uIndex}">`;
        
        // 단위사업체명 헤더
        html += `<div class="flex justify-between items-end mb-2 border-b pb-1 print:border-black print:mb-1">
                    <h2 class="text-lg font-semibold text-gray-800 print:text-[13px] print:m-0 print:p-0">
                        <span class="text-indigo-600 mr-2 print:text-black">[${unitName}]</span> 측정 대상 및 유해인자 목록
                    </h2>
                 </div>`;
                 
        // 테이블 컨테이너
        html += `<div class="overflow-x-auto border border-gray-200 rounded-lg print:border-black print:border-2 print:rounded-none print:shadow-none">
                  <table class="w-full text-left text-sm whitespace-nowrap min-w-[1250px] print:min-w-0">
                    <thead class="bg-gray-100 text-gray-700 uppercase font-semibold border-b border-gray-200 print:bg-gray-200 print:border-black print:text-black print:text-[10px]">
                      <tr>
                        <th class="px-2 py-2 w-10 text-center border-r print:border-black print:p-0.5">No.</th>
                        <th class="px-2 py-2 w-20 border-r print:border-black print:p-0.5">부서명</th>
                        <th class="px-2 py-2 w-24 border-r print:border-black print:p-0.5">공정명</th>
                        <th class="px-1 py-2 w-12 border-r print:border-black text-center print:p-0.5">교대제</th>
                        <th class="px-1 py-2 w-12 border-r print:border-black text-center print:p-0.5">근로자수</th>
                        <th class="px-1 py-2 w-12 border-r print:border-black text-center print:p-0.5">노출주기</th>
                        <th class="px-1 py-2 w-12 border-r print:border-black text-center print:p-0.5">측정건수</th>
                        <!-- 유해인자 통합 헤더 -->
                        <th class="p-0 border-r print:border-black" colspan="7">
                          <div class="flex w-full">
                            <div class="w-[140px] px-2 py-2 border-r border-gray-200 print:border-black text-center flex-grow print:p-0.5">유해인자 (발생물질 등)</div>
                            <div class="w-[80px] px-1 py-2 border-r border-gray-200 print:border-black text-center print:p-0.5">근로자명</div>
                            <div class="w-[30px] px-1 py-2 border-r border-gray-200 print:border-black text-center print:p-0.5">A</div>
                            <div class="w-[30px] px-1 py-2 border-r border-gray-200 print:border-black text-center print:p-0.5">P</div>
                            <div class="w-[30px] px-1 py-2 border-r border-gray-200 print:border-black text-center print:p-0.5">L</div>
                            <div class="w-[30px] px-1 py-2 border-r border-gray-200 print:border-black text-center print:p-0.5">N</div>
                            <div class="w-[90px] px-2 py-2 text-center print:p-0.5">비고</div>
                          </div>
                        </th>
                        <th class="px-2 py-2 w-16 text-center print:hidden">관리</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 print:divide-black">`;

        if (!currentWorkers || currentWorkers.length === 0) {
          html += `<tr><td colspan="15" class="text-center py-6 text-gray-500">데이터가 없습니다.</td></tr>`;
        } else {
          const spans = calculateSpansForUnit(unitName);
          currentWorkers.forEach((worker, index) => {
            const rowSpan = spans[index];

            if (worker.pageBreak && index > 0) {
              html += `
              <tr class="hidden print:table-row page-break-before">
                <td colspan="15" class="text-center py-1 text-[10px] text-gray-500 font-medium border-t-2 border-black border-dashed bg-white">
                  ✂️ 여기서부터 다음 페이지 첫 줄로 출력됩니다 ✂️
                </td>
              </tr>
              `;
            }

            const pageBreakClass = worker.pageBreak ? 'page-break-before' : '';
            html += `<tr class="hover:bg-gray-50 print:hover:bg-transparent transition-colors group ${pageBreakClass}">`;
            
            // 1. 번호
            html += `<td class="px-2 py-2 text-center text-gray-500 border-r print:border-black align-top print:p-0.5 print:pt-1">${index + 1}</td>`;
            
            // 2~7. 그룹 병합 필드들 (세로 병합)
            if (rowSpan > 0) {
              html += `<td class="px-2 py-2 border-r print:border-black align-top print:p-0.5 print:pt-1" rowspan="${rowSpan}">
                        <input type="text" data-focus-id="dept-${worker.id}" oninput="updateGroupField(${index}, ${rowSpan}, 'department', this.value)" onchange="reRender()" value="${worker.department}" placeholder="부서" class="w-full bg-transparent border-b border-transparent focus:border-blue-500 outline-none p-1 print:border-none print:p-0" />
                       </td>`;
              html += `<td class="px-2 py-2 border-r print:border-black align-top print:p-0.5 print:pt-1" rowspan="${rowSpan}">
                        <input type="text" data-focus-id="proc-${worker.id}" oninput="updateGroupField(${index}, ${rowSpan}, 'process', this.value)" onchange="reRender()" value="${worker.process}" placeholder="공정" class="w-full bg-transparent border-b border-transparent focus:border-blue-500 outline-none p-1 print:border-none print:p-0" />
                       </td>`;
              html += `<td class="px-1 py-2 border-r print:border-black align-top text-center print:p-0.5 print:pt-1" rowspan="${rowSpan}">
                        <input type="text" data-focus-id="shift-${worker.id}" oninput="updateGroupField(${index}, ${rowSpan}, 'shiftSystem', this.value)" onchange="reRender()" value="${worker.shiftSystem}" placeholder="교대" class="w-full bg-transparent border-b border-transparent focus:border-blue-500 outline-none p-1 text-center print:border-none print:p-0" />
                       </td>`;
              html += `<td class="px-1 py-2 border-r print:border-black align-top text-center print:p-0.5 print:pt-1" rowspan="${rowSpan}">
                        <input type="text" data-focus-id="cnt-${worker.id}" oninput="updateGroupField(${index}, ${rowSpan}, 'workerCount', this.value)" onchange="reRender()" value="${worker.workerCount}" placeholder="명" class="w-full bg-transparent border-b border-transparent focus:border-blue-500 outline-none p-1 text-center print:border-none print:p-0" />
                       </td>`;
              html += `<td class="px-1 py-2 border-r print:border-black align-top text-center print:p-0.5 print:pt-1" rowspan="${rowSpan}">
                        <input type="text" data-focus-id="cycle-${worker.id}" oninput="updateGroupField(${index}, ${rowSpan}, 'exposureCycle', this.value)" onchange="reRender()" value="${worker.exposureCycle}" placeholder="주기" class="w-full bg-transparent border-b border-transparent focus:border-blue-500 outline-none p-1 text-center print:border-none print:p-0" />
                       </td>`;
              html += `<td class="px-1 py-2 border-r print:border-black align-top text-center print:p-0.5 print:pt-1" rowspan="${rowSpan}">
                        <input type="text" data-focus-id="mcnt-${worker.id}" oninput="updateGroupField(${index}, ${rowSpan}, 'measurementCount', this.value)" onchange="reRender()" value="${worker.measurementCount}" placeholder="건수" class="w-full bg-transparent border-b border-transparent focus:border-blue-500 outline-none p-1 text-center print:border-none print:p-0" />
                       </td>`;
            }

            // 8~14. 유해인자 등 병합열 (colspan=7)

    function reRender() {
      saveFocus();
      renderTables();
      restoreFocus();
    }

    async function copyTableToClipboard() {
      try {
        let tsvData = "No.\t부서명\t공정명\t교대제\t근로자수\t노출주기\t측정건수\t유해인자\t근로자명\tA\tP\tL\tN\t비고\n";
        
        // 클립보드 복사는 화면에 보이는 '현재 탭(단위사업체)' 데이터만 복사합니다.
        const currentWorkers = appData.units[appData.currentUnit];
        if(currentWorkers) {
            currentWorkers.forEach((worker, index) => {
              worker.harmfulFactors.forEach((factor, fIndex) => {
                const isFirst = fIndex === 0;
                let hazardText = factor.name || '';
                if (factor.isAdjusted) hazardText = "[횟수조정] " + hazardText;
                
                tsvData += `${isFirst ? index + 1 : ''}\t${isFirst ? worker.department || '' : ''}\t${isFirst ? worker.process || '' : ''}\t${isFirst ? worker.shiftSystem || '' : ''}\t${isFirst ? worker.workerCount || '' : ''}\t${isFirst ? worker.exposureCycle || '' : ''}\t${isFirst ? worker.measurementCount || '' : ''}\t${hazardText}\t${isFirst ? worker.name || '' : ''}\t${factor.a || ''}\t${factor.p || ''}\t${factor.l || ''}\t${factor.n || ''}\t${factor.remark || ''}\n`;
              });
            });
        }

        await navigator.clipboard.writeText(tsvData);
        
        document.getElementById('copyIconDefault').classList.add('hidden');
        document.getElementById('copyIconCheck').classList.remove('hidden');
        document.getElementById('copyBtnText').innerText = '복사 완료!';
        
        setTimeout(() => {
          document.getElementById('copyIconDefault').classList.remove('hidden');
          document.getElementById('copyIconCheck').classList.add('hidden');
          document.getElementById('copyBtnText').innerText = '현재 표 데이터 복사';
        }, 2000);
      } catch (err) {
        alert('복사에 실패했습니다.');
      }
    }

    function parseCSV(text) {
      const result = [];
      let row = [];
      let cell = '';
      let insideQuote = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (insideQuote) {
          if (char === '"' && text[i + 1] === '"') { cell += '"'; i++; }
          else if (char === '"') { insideQuote = false; }
          else { cell += char; }
        } else {
          if (char === '"') { insideQuote = true; }
          else if (char === ',') { row.push(cell); cell = ''; }
          else if (char === '\n' || char === '\r') {
            row.push(cell); result.push(row); row = []; cell = '';
            if (char === '\r' && text[i + 1] === '\n') i++;
          }
          else { cell += char; }
        }
      }
      if (cell || row.length > 0) { row.push(cell); result.push(row); }
      return result;
    }

    async function fetchSheetData(url) {
      if (!url.trim()) return null;
      try {
        const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
        if (!match) throw new Error("유효한 스프레드시트 주소가 아닙니다.");
        const exportUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv`;
        const response = await fetch(exportUrl);
        if (!response.ok) throw new Error("시트 접근 거부. 일반 액세스를 확인하세요.");
        const text = await response.text();
        return parseCSV(text);
      } catch (error) { throw error; }
    }

    async function handleSyncSheets() {
      const excludeUrl = document.getElementById('excludeNoiseUrl').value;
      const noiseUrl = document.getElementById('noiseUrl').value;
      const syncBtn = document.getElementById('syncBtn');
      const msg = document.getElementById('syncMessage');

      if (!excludeUrl && !noiseUrl) {
        msg.className = 'text-sm font-medium text-red-600';
        msg.innerText = 'URL을 입력해주세요.';
        return;
      }

      syncBtn.disabled = true;
      syncBtn.innerText = '불러오는 중...';
      msg.innerText = '';

      try {
        let mergedGroupsByUnit = {}; 
        let excludeKeys = new Set();
        let lastKnownUnit = '기본 사업체';

        const processRows = (rows, isNoiseSheet = false) => {
          if (!rows || rows.length < 2) return;
          let lastDept = '', lastProcess = '';

          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length < 2) continue;
            
            // A열 단위사업체 추출 및 Fill-down
            let unitName = row[0]?.trim() || '';
            if (unitName !== '') {
                lastKnownUnit = unitName;
            } else {
                unitName = lastKnownUnit;
            }
            
            // 부서 및 공정 추출
            let dept = row[1]?.trim() || '';
            let process = row[2]?.trim() || '';

            if (dept === '' && process === '') {
              dept = lastDept; process = lastProcess;
            } else {
              lastDept = dept; lastProcess = process;
            }

            if (!dept && !process) continue;

            const key = `${unitName}|${dept}|${process}`;
            
            if (!mergedGroupsByUnit[unitName]) {
                mergedGroupsByUnit[unitName] = {};
            }

            if (!isNoiseSheet) {
              excludeKeys.add(key);
            }

            if (!mergedGroupsByUnit[unitName][key]) {
              mergedGroupsByUnit[unitName][key] = {
                unit: unitName, department: dept, process: process, shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '', pageBreak: false,
                factorGroups: [], hasPValue: false
              };
            }

            const removeDecimal = (val) => val ? val.replace(/(\d+)\.\d+/g, '$1') : '';
            const mergedGroup = mergedGroupsByUnit[unitName][key];

            if (!isNoiseSheet) {
              let factor = row[3]?.trim() || '';
              // 일반 시트는 근로자수 E열(4)
              let workerCount = removeDecimal(row[4]?.trim());
              let shift = row[5]?.trim() || '';
              let cycle = row[6]?.trim() || '';
              let pValue = row.length > 15 ? row[15]?.trim() || '' : '';

              if (!mergedGroup.shiftSystem && shift) mergedGroup.shiftSystem = shift;
              if (!mergedGroup.workerCount && workerCount) mergedGroup.workerCount = workerCount;
              if (!mergedGroup.exposureCycle && cycle) mergedGroup.exposureCycle = cycle;

              if (pValue !== '') {
                mergedGroup.hasPValue = true;
                mergedGroup.factorGroups.push(new Set());
              }
              if (factor !== '') {
                if (mergedGroup.factorGroups.length === 0) mergedGroup.factorGroups.push(new Set());
                mergedGroup.factorGroups[mergedGroup.factorGroups.length - 1].add(factor);
              }
            } else {
              let isNewKey = !excludeKeys.has(key);
              
              if (isNewKey) {
                // "소음" 시트 URL 연동 시에만 근로자수 = D열(row[3])
                let workerCount = removeDecimal(row[3]?.trim());
                let shift = row[5]?.trim() || '';
                let cycle = row[6]?.trim() || '';

                if (shift) mergedGroup.shiftSystem = shift;
                if (workerCount) mergedGroup.workerCount = workerCount;
                if (cycle) mergedGroup.exposureCycle = cycle;
              }

              mergedGroup.hasPValue = true;
              const noiseSet = new Set();
              noiseSet.add('소음');
              mergedGroup.factorGroups.push(noiseSet);
            }
          }
        };

        if (excludeUrl) {
          const rows1 = await fetchSheetData(excludeUrl);
          processRows(rows1, false);
        }
        if (noiseUrl) {
          const rows2 = await fetchSheetData(noiseUrl);
          processRows(rows2, true);
        }

        let totalExtracted = 0;
        let newAppUnits = {};

        // 사업체별로 객체화
        for (const unitName in mergedGroupsByUnit) {
            const newWorkers = Object.values(mergedGroupsByUnit[unitName])
              .filter(group => group.hasPValue)
              .map((group, index) => {
                let parsedFactors = group.factorGroups
                  .map(set => Array.from(set).join(', '))
                  .filter(str => str !== '');

                let uniqueFactors = [...new Set(parsedFactors)];
                let formattedFactors = uniqueFactors.length > 0
                  ? uniqueFactors.map(f => ({ name: f, a: '', p: '', l: '', n: '', remark: '', isAdjusted: false }))
                  : [{ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false }];

                return {
                  id: Date.now() + Math.random(),
                  department: group.department,
                  process: group.process,
                  shiftSystem: group.shiftSystem,
                  workerCount: group.workerCount,
                  exposureCycle: group.exposureCycle,
                  measurementCount: group.measurementCount,
                  name: group.name,
                  pageBreak: false,
                  harmfulFactors: formattedFactors
                };
              });
              
              if (newWorkers.length > 0) {
                  newAppUnits[unitName] = newWorkers;
                  totalExtracted += newWorkers.length;
              }
        }

        if (Object.keys(newAppUnits).length > 0) {
          appData.units = newAppUnits;
          
          // 첫 번째 탭 활성화
          const firstUnit = Object.keys(newAppUnits)[0];
          switchTab(firstUnit);
          
          document.getElementById('tabContainerSection').classList.remove('hidden');

          msg.className = 'text-sm font-medium text-green-600';
          msg.innerText = `연동 완료: ${Object.keys(newAppUnits).length}개 단위사업체, 총 ${totalExtracted}개의 공정이 추출되었습니다.`;
        } else {
          msg.className = 'text-sm font-medium text-red-600';
          msg.innerText = '조건에 맞는 데이터가 없습니다.';
        }
      } catch (error) {
        msg.className = 'text-sm font-medium text-red-600';
        msg.innerText = error.message;
      } finally {
        syncBtn.disabled = false;
        syncBtn.innerText = '데이터 연동하기';
      }
    }
    
    // 탭 UI 렌더링 함수
    function renderUnitTabs() {
        const tabsContainer = document.getElementById('unitTabs');
        tabsContainer.innerHTML = '';
        
        Object.keys(appData.units).forEach(unitName => {
            const btn = document.createElement('button');
            btn.className = `px-4 py-2 text-sm font-bold rounded-t-lg transition-colors border-t border-l border-r ${appData.currentUnit === unitName ? 'bg-white text-indigo-600 border-indigo-200 border-b-white translate-y-[1px]' : 'bg-gray-100 text-gray-500 border-gray-200 hover:bg-gray-50'}`;
            btn.innerText = unitName;
            btn.onclick = () => switchTab(unitName);
            tabsContainer.appendChild(btn);
        });
    }

    // 탭 전환(클릭) 처리 함수
    function switchTab(unitName) {
        if (!appData.units[unitName]) return;
        appData.currentUnit = unitName;
        
        if (Object.keys(appData.units).length > 1) {
            document.getElementById('tabContainerSection').classList.remove('hidden');
            renderUnitTabs();
        }
        reRender();
    }

    // 인쇄 시 숨겨진 div에 데이터가 정상 반영되도록 강제 렌더링
    window.addEventListener('beforeprint', function() {
      reRender();
    });

    // 엑셀 조작감 화살표 셀 이동
    document.addEventListener('keydown', function(e) {
      const current = e.target;
      if (current.tagName !== 'INPUT' || !current.hasAttribute('data-focus-id')) return;

      const isUp = e.key === 'ArrowUp';
      const isDown = e.key === 'ArrowDown';
      const isLeft = e.key === 'ArrowLeft';
      const isRight = e.key === 'ArrowRight';

      if (!isUp && !isDown && !isLeft && !isRight) return;

      // 좌우 이동은 커서가 끝/처음에 있을 때만 작동하여 텍스트 수정 방해 방지
      if (isLeft && current.selectionStart > 0) return;
      if (isRight && current.selectionEnd < current.value.length) return;

      e.preventDefault();

      const currentRect = current.getBoundingClientRect();
      // 화면에 활성화되어 보여지는(block) 테이블 내의 input만 탐색
      const inputs = Array.from(document.querySelectorAll('#tables-container .block input'));

      let bestMatch = null;
      let minDistance = Infinity;

      inputs.forEach(input => {
        if (input === current) return;
        const rect = input.getBoundingClientRect();

        let isEligible = false;
        let distance = Infinity;

        const yOverlap = Math.max(0, Math.min(currentRect.bottom, rect.bottom) - Math.max(currentRect.top, rect.top));

        if (isUp) {
          if (rect.bottom <= currentRect.top + 5) {
            isEligible = true;
            distance = (currentRect.top - rect.bottom) * 100 + Math.abs((rect.left + rect.width/2) - (currentRect.left + currentRect.width/2));
          }
        } else if (isDown) {
          if (rect.top >= currentRect.bottom - 5) {
            isEligible = true;
            distance = (rect.top - currentRect.bottom) * 100 + Math.abs((rect.left + rect.width/2) - (currentRect.left + currentRect.width/2));
          }
        } else if (isLeft) {
          if (rect.right <= currentRect.left + 5 && yOverlap > 0) {
            isEligible = true;
            distance = currentRect.left - rect.right;
          }
        } else if (isRight) {
          if (rect.left >= currentRect.right - 5 && yOverlap > 0) {
            isEligible = true;
            distance = rect.left - currentRect.right;
          }
        }

        if (isEligible && distance < minDistance) {
          minDistance = distance;
          bestMatch = input;
        }
      });

      if (bestMatch) {
        bestMatch.focus();
        if (isLeft) bestMatch.setSelectionRange(bestMatch.value.length, bestMatch.value.length);
        else if (isRight) bestMatch.setSelectionRange(0, 0);
        else bestMatch.setSelectionRange(bestMatch.value.length, bestMatch.value.length);
      }
    });

    renderTables();
  </script>
