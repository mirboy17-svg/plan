<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>작업환경측정 계획서</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    @media print {
      @page { size: landscape !important; margin: 10mm; } /* 여백을 조금 넉넉히 주어 잘림 방지 */
      
      /* 기본적으로 화면에만 보이는 요소 숨김 */
      .print\:hidden { display: none !important; }
      .print\:block { display: block !important; }
      
      /* 배경 및 텍스트 강제 설정 */
      body, html { 
        background-color: white !important; 
        color: black !important;
        height: auto !important; /* 스크롤 높이 제한 완벽 해제 */
        overflow: visible !important; 
        margin: 0 !important;
        padding: 0 !important;
      }
      
      /* 메인 컨테이너들이 인쇄 시 화면에 갇히지 않도록 완전히 해제 */
      #mainAppContent, #tables-container, .day-section {
        height: auto !important;
        overflow: visible !important;
        position: relative !important;
      }

      /* 테이블 테두리 및 렌더링 강제 설정 */
      table { 
        border-collapse: collapse !important; 
        width: 100% !important; 
        table-layout: auto !important; /* 브라우저가 내용에 맞게 폭 계산하게 둠 */
        page-break-inside: auto !important;
      }
      
      /* 줄바꿈 및 페이지 나눔 설정 강화 */
      tr {
        page-break-inside: avoid !important;
        page-break-after: auto !important;
      }
      
      /* 표 헤더는 페이지마다 반복 (필수) */
      thead {
        display: table-header-group !important;
      }

      /* 표 바디와 행 그룹이 끊기지 않도록 설정 */
      tbody, .group-tbody {
        display: table-row-group !important;
        page-break-inside: auto !important;
      }

      /* 셀 내부 여백 및 폰트 크기 설정 */
      th, td { 
        font-size: 8px !important; 
        padding: 2px !important; 
        line-height: 1.3 !important; 
        border: 1px solid black !important; /* 기본 테두리 */
        border-left-width: 1px !important;  /* 🚀 세로선 굵어지는 브라우저 버그 완벽 차단 */
        border-right-width: 1px !important; /* 🚀 세로선 굵어지는 브라우저 버그 완벽 차단 */
      }
      
      /* === 🖨️ 직관적인 인쇄 선(테두리) 디자인 적용 === */
      /* 유해인자 칸(A, P, L, N, 비고 포함)의 위아래 가로 선을 모두 연한 점선으로 강제 통일 */
      td.factor-cell {
        border-top: 1px dashed #9ca3af !important;
        border-bottom: 1px dashed #9ca3af !important;
      }
      
      /* 근로자 구분 굵은 선 (새로운 근로자 시작 시 '가로 윗줄'만 굵은 실선으로 덮어씀) */
      tr.worker-start-row > td {
        border-top: 1.5px solid black !important;
      }

      /* 표 전체 바깥 테두리를 굵게 설정하여 맨 밑줄이 점선으로 마감되는 현상 방지 */
      table { 
        border: 1.5px solid black !important; 
      }
      
      /* 글자 잘림 방지 */
      .nowrap-col { white-space: nowrap !important; }
      .break-all { word-break: break-all !important; white-space: pre-wrap !important; }

      /* textarea는 무조건 숨기고, print 전용 div만 보이도록 강력하게 통제 */
      textarea, input { display: none !important; }
      div[id^="print-"] { 
        display: block !important; 
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
      }
      
      /* 부서명 변경 시 페이지 나눔용 클래스 (확실히 작동하도록 break-* 속성 추가) */
      .page-break-before {
        page-break-before: always !important;
        break-before: page !important;
      }
      
      /* 요약표 및 메인표 출력 후 다음 장으로 넘기기 위한 클래스 */
      .page-break-after-always {
        page-break-after: always !important;
        break-after: page !important;
      }
      
      /* 불필요한 배경/테두리 제거 */
      .print\:bg-transparent { background-color: transparent !important; }
      .print\:border-black { border-color: black !important; }
      .print\:border-none { border: none !important; }
    }
    
    /* 화면용 스크롤바 감추기 (선택사항) */
    textarea {
      resize: none;
      overflow: hidden;
    }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0;
    }
  </style>
</head>
<body class="bg-[#FAFAFA] font-sans min-h-screen p-0 m-0">

    <div class="absolute top-[-5%] left-[-5%] w-[30%] h-[30%] rounded-full bg-emerald-400/20 blur-[80px] pointer-events-none"></div>
    <div class="absolute bottom-[-5%] right-[-5%] w-[30%] h-[30%] rounded-full bg-blue-400/20 blur-[80px] pointer-events-none"></div>

    <div class="relative bg-white/80 backdrop-blur-xl p-6 md:p-8 rounded-[1.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.06)] border border-white/60 w-full max-w-[380px] text-center flex flex-col items-center z-10">
      
      <div class="absolute top-0 left-1/2 -translate-x-1/2 w-1/3 h-1 bg-gradient-to-r from-emerald-400 to-teal-500 rounded-b-full opacity-80"></div>

      <div class="w-12 h-12 bg-gradient-to-br from-emerald-50 to-teal-100 rounded-2xl flex items-center justify-center mb-4 shadow-sm border border-emerald-100/50 group hover:-rotate-6 transition-transform duration-300">
        <svg class="w-6 h-6 text-emerald-600 group-hover:scale-110 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>

      <h2 class="text-lg md:text-xl font-bold text-slate-800 tracking-tight mb-1">작업환경측정 계획서</h2>
      <p class="text-[13px] text-slate-500 mb-5">경남지역본부 산업위생국 전용 플랫폼입니다.</p>

      <form onsubmit="handleLogin(event)" class="w-full">
        <div class="relative group">
          <div class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
            <svg class="w-4 h-4 text-slate-400 group-focus-within:text-emerald-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" />
            </svg>
          </div>
          <input type="password" id="loginPassword" placeholder="비밀번호 입력 (임시: 1234)" class="w-full pl-9 pr-4 py-2.5 bg-slate-50/50 border border-slate-200/80 rounded-xl text-[13px] text-slate-800 outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500/50 focus:bg-white transition-all placeholder:text-slate-400" autocomplete="current-password" />
        </div>
        <div id="loginErrorMsg" class="text-[12px] text-red-500 font-medium hidden mt-1.5 text-left pl-1">비밀번호가 올바르지 않습니다. (임시: 1234)</div>
        
        <button type="submit" class="mt-4 w-full relative overflow-hidden group bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl transition-all duration-300 text-[14px] shadow-[0_4px_14px_0_rgba(16,185,129,0.39)] hover:shadow-[0_6px_20px_rgba(16,185,129,0.23)] hover:-translate-y-0.5 active:translate-y-0">
          <span class="relative z-10 flex items-center justify-center gap-1.5">
            접속하기
            <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
          </span>
        </button>
      </form>
    </div>

    <div class="relative z-10 mt-5 w-full flex flex-col items-center justify-center space-y-1.5">
      <p class="text-[12px] font-semibold text-slate-700">시스템 오류 및 사용 문의</p>
      <div class="flex items-center gap-2.5 text-slate-500 text-[11px] bg-white/60 px-4 py-1.5 rounded-full border border-slate-200/50 shadow-sm backdrop-blur-sm">
        <span class="flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
          055-295-2461
        </span>
        <span class="w-[1px] h-3 bg-slate-300"></span>
        <span class="flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          aniag000@kiha21.or.kr
        </span>
      </div>
      <p class="pt-0.5 text-[10px] text-slate-400">© Copyright 2026.08 aniag000@kiha21.or.kr. All rights reserved.</p>
    </div>
  </div>

  <div id="mainAppContent" class="h-screen w-full bg-white overflow-y-auto hidden">
    
    <div class="bg-slate-800 p-6 flex justify-between items-center text-white print:bg-white print:text-black print:border-b print:border-black print:p-2 print:mb-4">
      <div class="flex items-center gap-3">
        <svg class="w-8 h-8 print:hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <h1 id="mainTitle" class="text-2xl font-bold">작업환경측정 계획서</h1>
      </div>
      <div class="flex flex-wrap items-center justify-end gap-2 print:hidden">
        <button onclick="exportToExcel()" class="flex items-center gap-1 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg transition-colors text-sm shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          엑셀 저장
        </button>
        <button onclick="saveData()" class="flex items-center gap-1 bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg transition-colors text-sm shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
          저장
        </button>
        <label class="flex items-center gap-1 bg-fuchsia-600 hover:bg-fuchsia-700 text-white px-3 py-2 rounded-lg transition-colors text-sm shadow-sm cursor-pointer mb-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
          불러오기
          <input type="file" accept=".json" class="hidden" onchange="loadData(event)">
        </label>
        <button onclick="printCurrentDayLabels()" class="flex items-center gap-1 bg-rose-600 hover:bg-rose-700 text-white px-3 py-2 rounded-lg transition-colors text-sm shadow-sm border border-rose-800">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" /></svg>
          <span>현재일차 라벨지 출력</span>
        </button>
        <button onclick="printAllUnits()" class="flex items-center gap-1 bg-violet-600 hover:bg-violet-700 text-white px-3 py-2 rounded-lg transition-colors text-sm shadow-md border border-violet-800">
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
          <span>전체사업체 인쇄/저장</span>
        </button>
      </div>
    </div>

    <div class="p-6 md:p-8 space-y-6 print:p-0 print:space-y-0">
      
      <section class="bg-gray-50 p-5 rounded-lg border border-gray-200 print:hidden">
        <h2 class="text-base font-semibold text-gray-800 mb-3 border-b pb-2">사업장 기본 정보</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">사업장명</label>
            <input type="text" id="companyName" oninput="updateTitle(this.value)" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none block !important" placeholder="예) (주)한국산업" />
          </div>
        </div>
      </section>

      <!-- 구글 스프레드시트 데이터 연동 UI -->
      <section class="bg-blue-50 p-5 rounded-lg border border-blue-100 print:hidden">
        <div class="flex items-center gap-2 mb-3">
          <h2 class="text-base font-semibold text-blue-800">구글 스프레드시트 데이터 연동</h2>
          <span class="text-xs bg-blue-200 text-blue-800 px-2 py-1 rounded-full font-medium">소음시트는 근로자수 D열 기준 산정</span>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">'소음제외' 시트 URL (P, R열 조건) [신규사업장은 시료채취대장(시료입력) 후 다운로드하세요.] </label>
            <input type="text" id="excludeNoiseUrl" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white block !important" placeholder="https://docs.google.com/spreadsheets/d/..." />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">'소음' 시트 URL (P, M열 조건)</label>
            <input type="text" id="noiseUrl" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white block !important" placeholder="https://docs.google.com/spreadsheets/d/..." />
          </div>
        </div>
        <div class="flex items-center gap-4 mb-5 border-b border-blue-200 pb-5">
          <button id="syncBtn" onclick="handleSyncSheets()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition-colors font-medium text-sm shadow-sm disabled:bg-blue-300">
            데이터 연동하기
          </button>
          <span id="syncMessage" class="text-sm font-medium text-blue-600"></span>
        </div>

        <!-- 시료채취대장 A, P, L 매칭 UI -->
        <div class="flex flex-col gap-2">
          <div class="flex items-center gap-2">
            <span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-xs font-bold border border-emerald-300">STEP 2</span>
            <label class="block text-sm font-bold text-gray-800">시료채취대장 URL (A, P, L 번호 자동 매칭)</label>
          </div>
          <div class="flex flex-col md:flex-row gap-3 items-start md:items-center">
            <input type="text" id="sampleUrl" class="flex-1 w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-emerald-500 outline-none text-sm bg-white block !important" placeholder="https://docs.google.com/spreadsheets/d/... (시료채취대장 링크)" />
            <button id="matchAPLBtn" onclick="matchAPLNumbers()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg transition-colors font-bold text-sm shadow-sm disabled:bg-emerald-300 whitespace-nowrap flex items-center gap-1.5 shrink-0">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
              A, P, L 번호 매칭
            </button>
            <span id="matchMessage" class="text-sm font-medium text-emerald-600 shrink-0"></span>
          </div>
        </div>
      </section>

      <!-- 🚀 STEP 3 측정 시료 준비 요약표가 들어갈 공간 (여기에 요약표가 생성됩니다!) -->
      <div id="summary-dashboard-container" class="mb-4 mt-2"></div>

      <section class="bg-amber-50 p-4 rounded-lg border border-amber-200 print:hidden flex flex-col lg:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2">
          <h2 class="text-base font-bold text-amber-800 flex items-center gap-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            측정 일차 분리 관리
          </h2>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          
          <div class="relative">
            <button id="unitDropdownBtn" onclick="toggleCustomDropdown('unitDropdownList')" class="w-[180px] text-left bg-white border border-gray-300 rounded p-1.5 text-sm outline-none focus:ring-2 focus:ring-amber-500 flex justify-between items-center shadow-sm">
              단위사업체 선택 <span class="text-xs text-gray-400">▼</span>
            </button>
            <div id="unitDropdownList" class="hidden absolute top-full left-0 mt-1 w-64 bg-white border border-gray-200 rounded-lg shadow-xl z-50 max-h-60 overflow-y-auto">
            </div>
          </div>

          <div class="relative">
            <button id="deptDropdownBtn" onclick="toggleCustomDropdown('deptDropdownList')" class="w-[180px] text-left bg-white border border-gray-300 rounded p-1.5 text-sm outline-none focus:ring-2 focus:ring-amber-500 flex justify-between items-center shadow-sm">
              부서명 선택 <span class="text-xs text-gray-400">▼</span>
            </button>
            <div id="deptDropdownList" class="hidden absolute top-full left-0 mt-1 w-64 bg-white border border-gray-200 rounded-lg shadow-xl z-50 max-h-60 overflow-y-auto">
            </div>
          </div>

          <span class="text-gray-400 font-bold px-1">➔</span>
          <select id="moveTargetDay" class="border border-gray-300 rounded p-1.5 text-sm outline-none focus:ring-2 focus:ring-amber-500 font-bold text-amber-700 shadow-sm bg-white">
            <option value="1">1일차-1팀</option><option value="2">1일차-2팀</option><option value="3">1일차-3팀</option>
            <option value="4">2일차-1팀</option><option value="5">2일차-2팀</option><option value="6">2일차-3팀</option>
            <option value="7">3일차-1팀</option><option value="8">3일차-2팀</option><option value="9">3일차-3팀</option>
            <option value="10">4일차-1팀</option><option value="11">4일차-2팀</option><option value="12">4일차-3팀</option>
            <option value="13">5일차-1팀</option><option value="14">5일차-2팀</option><option value="15">5일차-3팀</option> 
          </select>
          <button onclick="moveDepartmentDay()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-1.5 rounded font-bold text-sm shadow-sm transition-colors whitespace-nowrap">
            이동 실행
          </button>
          <button onclick="resetAllDays()" class="bg-slate-500 hover:bg-slate-600 text-white px-4 py-1.5 rounded font-bold text-sm shadow-sm transition-colors whitespace-nowrap ml-1" title="모든 대상을 1일차-1팀으로 되돌립니다.">
            ↺ 전체 초기화
          </button>
        </div>
      </section>

      <section id="tabContainerSection" class="hidden print:hidden">
        <div class="flex items-end border-b-2 border-amber-500 mb-3 gap-2">
            <div class="bg-amber-500 text-white px-3 py-1.5 text-sm font-bold rounded-tl-lg rounded-tr-lg">일자 선택</div>
            <div id="dayTabs" class="flex flex-wrap gap-1"></div>
        </div>
        <div class="flex items-end border-b border-gray-300 pb-1 gap-2">
            <div class="text-indigo-600 px-3 py-1.5 text-sm font-bold bg-indigo-50 rounded-tl-lg rounded-tr-lg border border-b-0 border-indigo-200">사업체 선택</div>
            <div id="unitTabs" class="flex flex-wrap gap-1"></div>
        </div>
      </section>

      <div id="tables-container" class="space-y-8 print:space-y-6">
        <!-- 렌더링 영역 -->
      </div>
    </div>
  </div>

  <!-- 라벨지 출력 전용 컨테이너 -->
  <div id="labelPrintContainer" class="hidden min-h-screen bg-gray-100"></div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const pwInput = document.getElementById('loginPassword').value.trim();
      const errBox = document.getElementById('loginErrorMsg');
      
      if (pwInput === '1234') {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainAppContent').classList.remove('hidden');
        recalculateNames();
        renderTables();
      } else {
        errBox.classList.remove('hidden');
        const card = pwInput ? errBox.previousElementSibling : errBox.closest('.bg-white');
        card.classList.add('animate-bounce');
        setTimeout(() => card.classList.remove('animate-bounce'), 500);
      }
    }

    function smartResize(el) {
      if (!el) return;
      requestAnimationFrame(() => {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
      });
    }

    let appData = {
      currentDay: 1,
      currentUnit: 'ALL',
      units: {
        '기본 사업체': [
          {
            id: 1, day: 1, department: '', process: '', shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '', isManual: false, pageBreak: false, 
            harmfulFactors: [{ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false }]
          }
        ]
      }
    };

    let activeFocusId = null;
    let selectionStart = null;
    let selectionEnd = null;

    function updateTitle(val) {
      const companyName = val.trim();
      const titleText = companyName ? `작업환경측정 계획서 - ${companyName}` : '작업환경측정 계획서';
      document.getElementById('mainTitle').innerText = titleText;
      document.title = titleText;
    }

    function saveFocus() {
      const active = document.activeElement;
      if (active && active.dataset.focusId) {
        activeFocusId = active.dataset.focusId;
        selectionStart = active.selectionStart;
        selectionEnd = active.selectionEnd;
      } else {
        activeFocusId = null;
      }
    }

    function restoreFocus() {
      if (activeFocusId) {
        const el = document.querySelector(`[data-focus-id="${activeFocusId}"]`);
        if (el) {
          el.focus();
          try {
            if (el.tagName === 'TEXTAREA' || el.type === 'text' || el.type === 'number') {
              el.setSelectionRange(selectionStart, selectionEnd);
            }
          } catch(e) {}
        }
      }
    }

    function updateCountsUI() {
      const allDays = getActiveDays();
      allDays.forEach(day => {
          let uniqueA = new Set();
          let uniqueP = new Set();
          let uniqueL = new Set();
          let countN = 0;
          
          Object.keys(appData.units).forEach((unitName) => {
              if (appData.currentUnit !== 'ALL' && appData.currentUnit !== unitName) return;
              const currentWorkers = appData.units[unitName].filter(w => (w.day || 1) === day);
              currentWorkers.forEach(worker => {
                  worker.harmfulFactors.forEach(factor => {
                      if (factor.a && String(factor.a).trim() !== '') uniqueA.add(String(factor.a).trim());
                      if (factor.p && String(factor.p).trim() !== '') uniqueP.add(String(factor.p).trim());
                      if (factor.l && String(factor.l).trim() !== '') uniqueL.add(String(factor.l).trim());
                      
                      const isNoiseFactor = String(factor.name).trim().includes('소음');
                      const nValue = factor.n !== undefined && factor.n !== null ? factor.n : ((!factor.isAdjusted && isNoiseFactor) ? 'V' : '');
                      if (nValue && String(nValue).trim() !== '') countN++;
                  });
              });
          });
          
          const displayEl = document.getElementById(`count-display-${day}`);
          if (displayEl) {
              displayEl.innerText = `- 'A : ${uniqueA.size}개, P : ${uniqueP.size}개, L : ${uniqueL.size}개, N : ${countN}개'`;
          }
      });
    }

    // 일차(Day)가 바뀔 때마다 *1, *2 부터 새롭게 넘버링되도록 변경된 함수
    function recalculateNames() {
      const unitNames = Object.keys(appData.units);
      const dayGroups = [
          [1, 2, 3],       // 1일차 그룹
          [4, 5, 6],       // 2일차 그룹
          [7, 8, 9],       // 3일차 그룹
          [10, 11, 12],    // 4일차 그룹
          [13, 14, 15]     // 5일차 그룹
      ];

      dayGroups.forEach(groupDays => {
          let currentSeq = 1; // 일차 그룹이 바뀔 때마다 시퀀스를 1로 리셋
          
          groupDays.forEach(day => {
              unitNames.forEach(unitName => {
                  const currentWorkers = appData.units[unitName].filter(w => (w.day || 1) === day);
                  currentWorkers.forEach(worker => {
                      let val = (worker.name || '').trim();
                      
                      if (worker.isManual && val.match(/^\*\d+$/)) {
                          currentSeq = parseInt(val.substring(1), 10) + 1;
                      } else {
                          if (!worker.isManual || val === '') {
                              worker.name = '*' + currentSeq;
                              worker.isManual = false;
                          }
                          currentSeq++;
                      }
                  });
              });
          });
      });
    }

    function updateWorkerName(unitName, id, value) {
      const target = appData.units[unitName].find(w => w.id === id);
      if(target) {
          target.name = value;
          target.isManual = true;
      }
      
      clearTimeout(window.nameDebounce);
      window.nameDebounce = setTimeout(() => {
          recalculateNames();
          Object.keys(appData.units).forEach(uName => {
              appData.units[uName].forEach(w => {
                  const ta = document.querySelector(`textarea[data-focus-id="name-${w.id}"]`);
                  if (ta && ta !== document.activeElement) {
                      ta.value = w.name;
                  }
                  const printDiv = document.getElementById(`print-name-${w.id}`);
                  if (printDiv) {
                      printDiv.innerText = w.name;
                  }
              });
          });
      }, 300);
    }

    function updateFactorField(unitName, workerId, factorIndex, field, value) {
      const target = appData.units[unitName].find(w => w.id === workerId);
      if(target && target.harmfulFactors[factorIndex]) {
          target.harmfulFactors[factorIndex][field] = value;
      }
      clearTimeout(window.countDebounce);
      window.countDebounce = setTimeout(() => {
          updateCountsUI();
      }, 200);
    }

    function updateGroupField(unitName, day, filterIndex, rowSpan, field, value) {
      const currentWorkers = appData.units[unitName].filter(w => (w.day || 1) === day);
      for (let i = filterIndex; i < filterIndex + rowSpan; i++) {
        const targetId = currentWorkers[i].id;
        const realWorker = appData.units[unitName].find(w => w.id === targetId);
        if(realWorker) realWorker[field] = value;
      }
    }

    function toggleAdjust(unitName, workerId, factorIndex) {
      const target = appData.units[unitName].find(w => w.id === workerId);
      if(target && target.harmfulFactors[factorIndex]) {
          target.harmfulFactors[factorIndex].isAdjusted = !target.harmfulFactors[factorIndex].isAdjusted;
          reRender();
      }
    }

    function addBagToRemark(unitName, workerId, factorIndex) {
      const target = appData.units[unitName].find(w => w.id === workerId);
      if(target && target.harmfulFactors[factorIndex]) {
          let currentVal = (target.harmfulFactors[factorIndex].remark || '').trim();
          currentVal = currentVal.replace(/\[가방\]/g, '').trim();
          
          const newVal = currentVal === '' ? '[가방]' : '[가방] ' + currentVal;
          target.harmfulFactors[factorIndex].remark = newVal;

          const textarea = document.querySelector(`textarea[data-focus-id="frem-${workerId}-${factorIndex}"]`);
          if (textarea) {
              textarea.value = newVal;
              smartResize(textarea);
              textarea.focus();
              textarea.setSelectionRange(newVal.length, newVal.length);
          }
          const printDiv = document.getElementById(`print-frem-${workerId}-${factorIndex}`);
          if (printDiv) {
              printDiv.innerHTML = newVal.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\[가방\]/g, '<span class="font-bold text-red-600 print:text-red-600">[가방]</span>');
          }
      }
    }

    function addWorker(unitName) {
      const currentWorkers = appData.units[unitName];
      const newId = currentWorkers.length > 0 ? Math.max(...currentWorkers.map(w => w.id)) + 1 : 1;
      currentWorkers.push({
        id: newId, day: appData.currentDay, department: '', process: '', shiftSystem: '', workerCount: '', exposureCycle: '', measurementCount: '', name: '', isManual: false, pageBreak: false,
        harmfulFactors: [{ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false }]
      });
      recalculateNames();
      reRender();
    }

    function removeWorker(unitName, id) {
      let currentWorkers = appData.units[unitName];
      currentWorkers = currentWorkers.filter(w => w.id !== id);
      appData.units[unitName] = currentWorkers;
      if (currentWorkers.length === 0) addWorker(unitName);
      else {
          recalculateNames();
          reRender();
      }
    }

    function duplicateWorker(unitName, id) {
      const currentWorkers = appData.units[unitName];
      const index = currentWorkers.findIndex(w => w.id === id);
      if (index === -1) return;
      
      const workerToCopy = currentWorkers[index];
      const newId = currentWorkers.length > 0 ? Math.max(...currentWorkers.map(w => w.id)) + 1 : 1;
      
      const clonedWorker = {
        ...workerToCopy,
        id: newId,
        day: workerToCopy.day || 1,
        pageBreak: false,
        name: '',
        isManual: false,
        harmfulFactors: workerToCopy.harmfulFactors.map(factor => ({ ...factor }))
      };
      
      currentWorkers.splice(index + 1, 0, clonedWorker);
      recalculateNames();
      reRender();
    }

    function addFactor(unitName, workerId) {
      const target = appData.units[unitName].find(w => w.id === workerId);
      if(target) {
          target.harmfulFactors.push({ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false });
          reRender();
      }
    }

    function removeFactor(unitName, workerId, factorIndex) {
      const target = appData.units[unitName].find(w => w.id === workerId);
      if(target) {
          target.harmfulFactors.splice(factorIndex, 1);
          if(target.harmfulFactors.length === 0) {
              target.harmfulFactors.push({ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false });
          }
          reRender();
      }
    }

    function togglePageBreak(unitName, id) {
      const target = appData.units[unitName].find(w => w.id === id);
      if(target) {
          target.pageBreak = !target.pageBreak;
          reRender();
      }
    }

    function calculateSpansForWorkers(workers) {
      if (!workers) return [];
      const groupFields = ['department', 'process', 'shiftSystem', 'workerCount', 'exposureCycle', 'measurementCount'];
      const spans = new Array(workers.length).fill(1);
      for (let i = 0; i < workers.length; i++) {
        if (spans[i] === 0) continue;
        let count = 1;
        for (let j = i + 1; j < workers.length; j++) {
          const isSame = groupFields.every(field => workers[i][field] === workers[j][field]);
          if (isSame) { count++; spans[j] = 0; } 
          else break;
        }
        spans[i] = count;
      }
      return spans;
    }

    function getActiveDays() {
        let activeDays = new Set();
        Object.values(appData.units).forEach(workers => workers.forEach(w => activeDays.add(w.day || 1)));
        if(activeDays.size === 0) activeDays.add(1);
        return Array.from(activeDays).sort((a,b) => a - b);
    }
    
    function getDayName(day) {
        const dayMap = {
            1: "1일차-1팀", 2: "1일차-2팀", 3: "1일차-3팀",
            4: "2일차-1팀", 5: "2일차-2팀", 6: "2일차-3팀",
            7: "3일차-1팀", 8: "3일차-2팀", 9: "3일차-3팀",
            10: "4일차-1팀", 11: "4일차-2팀", 12: "4일차-3팀",
            13: "5일차-1팀", 14: "5일차-2팀", 15: "5일차-3팀"
        };
        return dayMap[day] || `${day}일차`;
    }

    function getValidUnitsForDay(day) {
        let valid = [];
        Object.keys(appData.units).forEach(unit => {
            if(appData.units[unit].some(w => (w.day || 1) === day)) valid.push(unit);
        });
        return valid;
    }

    function toggleCustomDropdown(id) {
        const el = document.getElementById(id);
        if(el) el.classList.toggle('hidden');
    }

    document.addEventListener('click', function(event) {
        const uBtn = document.getElementById('unitDropdownBtn');
        const uList = document.getElementById('unitDropdownList');
        const dBtn = document.getElementById('deptDropdownBtn');
        const dList = document.getElementById('deptDropdownList');
        
        if (uBtn && uList && !uBtn.contains(event.target) && !uList.contains(event.target)) {
            uList.classList.add('hidden');
        }
        if (dBtn && dList && !dBtn.contains(event.target) && !dList.contains(event.target)) {
            dList.classList.add('hidden');
        }
    });

    function updateDayManageDropdowns() {
        const unitList = document.getElementById('unitDropdownList');
        const deptList = document.getElementById('deptDropdownList');
        if(!unitList || !deptList) return;

        const checkedUnits = Array.from(unitList.querySelectorAll('input:checked')).map(el => el.value);
        const checkedDepts = Array.from(deptList.querySelectorAll('input:checked')).map(el => el.value);

        const currentUnits = Object.keys(appData.units);
        
        let unitOptions = '';
        currentUnits.forEach(u => {
            const isChecked = checkedUnits.includes(u) ? 'checked' : '';
            unitOptions += `<label class="flex items-center px-4 py-2 hover:bg-amber-50 cursor-pointer text-sm transition-colors border-b border-gray-50"><input type="checkbox" value="${u}" class="mr-3 w-4 h-4 unit-checkbox text-amber-600 focus:ring-amber-500 rounded border-gray-300" onchange="updateMoveDeptDropdown()" ${isChecked}> ${u}</label>`;
        });
        unitList.innerHTML = unitOptions || '<div class="px-4 py-3 text-sm text-gray-500 text-center">사업체 데이터가 없습니다.</div>';

        const activeUnits = Array.from(unitList.querySelectorAll('input:checked')).map(el => el.value);
        
        let deptOptions = '';
        if (activeUnits.length > 0) {
            deptOptions += `<label class="flex items-center px-4 py-2 hover:bg-blue-50 cursor-pointer text-sm font-bold text-blue-700 border-b-2 border-gray-200 transition-colors bg-gray-50"><input type="checkbox" value="ALL" class="mr-3 w-4 h-4 dept-checkbox text-blue-600 focus:ring-blue-500 rounded border-gray-300" onchange="toggleAllDepts(this)"> ✨ 선택 단위사업체 전체 이동</label>`;
            
            const depts = new Set();
            activeUnits.forEach(u => {
                if (appData.units[u]) {
                    appData.units[u].forEach(w => { if(w.department) depts.add(w.department); });
                }
            });
            Array.from(depts).sort().forEach(d => {
                const isChecked = checkedDepts.includes(d) || checkedDepts.includes('ALL') ? 'checked' : '';
                deptOptions += `<label class="flex items-center px-4 py-2 hover:bg-amber-50 cursor-pointer text-sm transition-colors border-b border-gray-50"><input type="checkbox" value="${d}" class="mr-3 w-4 h-4 dept-checkbox text-amber-600 focus:ring-amber-500 rounded border-gray-300" onchange="updateDeptBtnText()" ${isChecked}> ${d}</label>`;
            });
        } else {
            deptOptions = `<div class="px-4 py-3 text-sm text-gray-500 bg-gray-50 text-center font-medium">위에서 단위사업체를 먼저 체크하세요</div>`;
        }
        deptList.innerHTML = deptOptions;
        
        updateUnitBtnText();
        updateDeptBtnText();
    }

    function updateUnitBtnText() {
        const uBtn = document.getElementById('unitDropdownBtn');
        const activeUnits = Array.from(document.querySelectorAll('.unit-checkbox:checked')).map(el => el.value);
        if (uBtn) {
            if (activeUnits.length > 0) uBtn.innerHTML = `<span class="font-bold text-amber-700">${activeUnits.length}개 선택됨</span> <span class="text-xs ml-2 text-gray-400">▼</span>`;
            else uBtn.innerHTML = `단위사업체 선택 <span class="text-xs ml-2 text-gray-400">▼</span>`;
        }
    }

    function updateDeptBtnText() {
        const dBtn = document.getElementById('deptDropdownBtn');
        const activeDepts = Array.from(document.querySelectorAll('.dept-checkbox:checked')).filter(el => el.value !== 'ALL');
        if (dBtn) {
            if (activeDepts.length > 0) dBtn.innerHTML = `<span class="font-bold text-amber-700">${activeDepts.length}개 부서 선택됨</span> <span class="text-xs ml-2 text-gray-400">▼</span>`;
            else dBtn.innerHTML = `부서명 선택 <span class="text-xs ml-2 text-gray-400">▼</span>`;
        }
    }

    function toggleAllDepts(source) {
        const checkboxes = document.querySelectorAll('.dept-checkbox');
        checkboxes.forEach(cb => { cb.checked = source.checked; });
        updateDeptBtnText();
    }

    function updateMoveDeptDropdown() { 
        updateDayManageDropdowns(); 
    }

    function moveDepartmentDay() {
        const activeUnits = Array.from(document.querySelectorAll('.unit-checkbox:checked')).map(el => el.value);
        const activeDepts = Array.from(document.querySelectorAll('.dept-checkbox:checked')).map(el => el.value);
        const targetDay = parseInt(document.getElementById('moveTargetDay').value);

        if (activeUnits.length === 0) return showToast("단위사업체를 하나 이상 체크해주세요.", true);
        if (activeDepts.length === 0) return showToast("이동할 부서명을 하나 이상 체크해주세요.", true);
        if (!targetDay) return;

        const isAll = activeDepts.includes('ALL');
        let movedCount = 0;

        activeUnits.forEach(unit => {
            if (appData.units[unit]) {
                appData.units[unit].forEach(w => {
                    if (isAll || activeDepts.includes(w.department)) { 
                        w.day = targetDay; 
                        movedCount++; 
                    }
                });
            }
        });

        if(movedCount > 0) {
            showToast(`체크된 대상 총 ${movedCount}건이 ${targetDay}일차로 일괄 이동되었습니다.`);
            appData.currentDay = targetDay;
            if(appData.currentUnit !== 'ALL' && !activeUnits.includes(appData.currentUnit)) {
                appData.currentUnit = activeUnits[0];
            }
            recalculateNames();
            reRender();
            
            document.getElementById('unitDropdownList').classList.add('hidden');
            document.getElementById('deptDropdownList').classList.add('hidden');
        } else {
            showToast("선택한 조건에 해당하는 이동 대상이 없습니다.", true);
        }
    }

    function resetAllDays() {
        customConfirm("모든 부서와 단위사업체의 일차 설정을 초기화하고 전부 '1일차-1팀'으로 되돌리시겠습니까?", () => {
            let resetCount = 0;
            Object.keys(appData.units).forEach(unit => {
                appData.units[unit].forEach(w => {
                    if (w.day !== 1) {
                        w.day = 1;
                        resetCount++;
                    }
                });
            });
            
            if(resetCount > 0) {
                appData.currentDay = 1;
                reRender();
                showToast(`총 ${resetCount}건의 항목이 1일차-1팀으로 완벽하게 초기화되었습니다.`);
            } else {
                showToast("이미 모든 항목이 1일차-1팀에 있습니다.");
            }
        });
    }

    function renderDayTabs() {
        const tabsContainer = document.getElementById('dayTabs');
        if(!tabsContainer) return;
        tabsContainer.innerHTML = '';
        const sortedDays = getActiveDays();
        if(!sortedDays.includes(appData.currentDay)) appData.currentDay = sortedDays[0] || 1;

        sortedDays.forEach(day => {
            const btn = document.createElement('button');
            const isActive = appData.currentDay === day;
            btn.className = `px-4 py-1.5 text-sm font-bold rounded-t-lg transition-colors border-t border-l border-r ${isActive ? 'bg-white text-amber-600 border-amber-200 border-b-white translate-y-[1px]' : 'bg-amber-100/50 text-amber-700/60 border-amber-200/50 hover:bg-amber-100'}`;
            btn.innerText = getDayName(day);
            btn.onclick = () => { appData.currentDay = day; reRender(); };
            tabsContainer.appendChild(btn);
        });
    }

    function renderUnitTabs() {
        const tabsContainer = document.getElementById('unitTabs');
        if(!tabsContainer) return;
        tabsContainer.innerHTML = '';

        let validUnits = getValidUnitsForDay(appData.currentDay);
        if(validUnits.length === 0) return;

        const allBtn = document.createElement('button');
        const isAllActive = appData.currentUnit === 'ALL';
        allBtn.className = `px-4 py-1.5 text-sm font-bold rounded-t-lg transition-colors border-t border-l border-r ${isAllActive ? 'bg-indigo-600 text-white border-indigo-600 translate-y-[1px]' : 'bg-gray-100 text-gray-500 border-gray-200 hover:bg-gray-50'}`;
        allBtn.innerText = '전체 사업체';
        allBtn.onclick = () => { appData.currentUnit = 'ALL'; reRender(); };
        tabsContainer.appendChild(allBtn);

        validUnits.forEach(unitName => {
            const btn = document.createElement('button');
            const isActive = appData.currentUnit === unitName;
            btn.className = `px-4 py-1.5 text-sm font-bold rounded-t-lg transition-colors border-t border-l border-r ${isActive ? 'bg-white text-indigo-600 border-indigo-200 border-b-white translate-y-[1px]' : 'bg-gray-100 text-gray-500 border-gray-200 hover:bg-gray-50'}`;
            btn.innerText = unitName;
            btn.onclick = () => { appData.currentUnit = unitName; reRender(); };
            tabsContainer.appendChild(btn);
        });
    }

    function generateSampleSummaryForDay(day, unitNames) {
        let hasData = false;
        
        let comboStats = {};
        let uniqueA = new Set();
        let uniqueP = new Set();
        let uniqueL = new Set();
        let countN = 0;

        // 1. 각 근로자(행)별 조합 계산 및 대시보드 통계 수집 (기존 로직 절대 유지)
        unitNames.forEach(unit => {
            const currentWorkers = appData.units[unit].filter(w => (w.day || 1) === day);
            if(currentWorkers.length > 0) hasData = true;
            
            currentWorkers.forEach(worker => {
                let factorsByPump = {};
                let pumpToAPLN = {};
                
                // 해당 근로자의 A, P, L, N 펌프 카운트 수집
                worker.harmfulFactors.forEach(factor => {
                    if (factor.a && String(factor.a).trim() !== '') uniqueA.add(String(factor.a).trim());
                    if (factor.p && String(factor.p).trim() !== '') uniqueP.add(String(factor.p).trim());
                    if (factor.l && String(factor.l).trim() !== '') uniqueL.add(String(factor.l).trim());
                    
                    const isNoiseFactor = String(factor.name).trim().includes('소음');
                    const nValue = factor.n !== undefined && factor.n !== null ? factor.n : ((!factor.isAdjusted && isNoiseFactor) ? 'V' : '');
                    if (nValue && String(nValue).trim() !== '') countN++;
                });

                worker.harmfulFactors.forEach(factor => {
                    if (factor.isAdjusted) return;
                    let rawName = String(factor.name || '').replace(/\(혼합물질평가\)/g, '').replace(/혼합물질평가/g, '').trim();
                    if (!rawName) return;

                    let safeName = rawName.replace(/(\d),(\d)/g, '$1_COMMA_$2');
                    let nameTokens = safeName.split(',').map(s => s.replace(/_COMMA_/g, ',').trim()).filter(Boolean);
                    
                    let pNum = String(factor.a || factor.p || factor.l || factor.n || '').replace(/[^0-9Vv]/g, '');
                    let nValue = factor.n !== undefined && factor.n !== null ? factor.n : ((!factor.isAdjusted && rawName.includes('소음')) ? 'V' : '');
                    
                    if (!pNum && (rawName.includes('소음') || nValue)) pNum = 'V';
                    if (!pNum) pNum = 'NONE_' + Math.random();
                    if (pNum.toUpperCase() === 'V') pNum = 'NOISE';

                    if (!factorsByPump[pNum]) {
                        factorsByPump[pNum] = [];
                        pumpToAPLN[pNum] = { a: '', p: '', l: '', n: '' };
                    }
                    
                    let cellName = '';
                    if (nameTokens.length > 1) {
                        cellName = `${nameTokens[0]} 외 ${nameTokens.length - 1}종`;
                    } else if (nameTokens.length === 1) {
                        cellName = nameTokens[0];
                    }

                    let remarkStr = String(factor.remark || '').replace(/\[가방\]/g, '').trim();
                    if (remarkStr) {
                        remarkStr = remarkStr.replace(/^\[(.*)\]$/, '$1'); 
                        cellName += `[${remarkStr}]`;
                    }

                    if (cellName) {
                        factorsByPump[pNum].push(cellName);
                    }

                    if(factor.a) pumpToAPLN[pNum].a = factor.a;
                    if(factor.p) pumpToAPLN[pNum].p = factor.p;
                    if(factor.l) pumpToAPLN[pNum].l = factor.l;
                    if(factor.n || nValue) pumpToAPLN[pNum].n = factor.n || nValue;
                });

                let combinations = [];
                Object.keys(factorsByPump).forEach(pNum => {
                    if (pNum.startsWith('NONE_')) return;
                    let uniqueCellNames = Array.from(new Set(factorsByPump[pNum]));
                    let combinedName = uniqueCellNames.join(' + ');
                    
                    combinations.push({
                        name: combinedName,
                        a: pumpToAPLN[pNum].a,
                        p: pumpToAPLN[pNum].p,
                        l: pumpToAPLN[pNum].l,
                        n: pumpToAPLN[pNum].n,
                    });
                });

                if (combinations.length === 0) {
                    combinations.push({name: '', a: '', p: '', l: '', n: ''});
                }

                // '소음'이 포함된 조합을 무조건 배열의 최상단(Index 0)으로 정렬
                combinations.sort((a, b) => {
                    const aIsNoise = (a.name || '').includes('소음');
                    const bIsNoise = (b.name || '').includes('소음');
                    if (aIsNoise && !bIsNoise) return -1;
                    if (!aIsNoise && bIsNoise) return 1;
                    return 0; 
                });

                // 대시보드 통계를 위해 펌프 기호(A/P/L/N)를 수집
                combinations.forEach(combo => {
                    if (combo.name && combo.name.trim() !== '') {
                        if (!comboStats[combo.name]) {
                            comboStats[combo.name] = { count: 0, pumps: new Set() };
                        }
                        comboStats[combo.name].count++;
                        
                        if (combo.a && String(combo.a).trim() !== '') comboStats[combo.name].pumps.add('A');
                        if (combo.p && String(combo.p).trim() !== '') comboStats[combo.name].pumps.add('P');
                        if (combo.l && String(combo.l).trim() !== '') comboStats[combo.name].pumps.add('L');
                        if (combo.n && String(combo.n).trim() !== '') comboStats[combo.name].pumps.add('N');
                    }
                });

                worker._summaryCombinations = combinations;
                worker._wSpan = combinations.length;
            });
        });

        if (!hasData) return '';

        // 2. 대시보드 통계 배열 생성 및 (+) 기호 개수 기준 내림차순 정렬 (기존 로직 유지)
        let statsArray = Object.keys(comboStats).map(name => ({ 
            name, 
            count: comboStats[name].count,
            pumps: Array.from(comboStats[name].pumps).sort()
        }));
        
        statsArray.sort((a, b) => {
            const aIsNoise = (a.name || '').includes('소음');
            const bIsNoise = (b.name || '').includes('소음');
            if (aIsNoise && !bIsNoise) return -1;
            if (!aIsNoise && bIsNoise) return 1;

            const plusCountA = (a.name.match(/\+/g) || []).length;
            const plusCountB = (b.name.match(/\+/g) || []).length;
            if (plusCountB !== plusCountA) return plusCountB - plusCountA; 
            return b.count - a.count; 
        });

        // 3. 대시보드 HTML 블록 구성 (🚀 엑셀 스타일 표 렌더링으로 변경)
        let statsHtml = `<div class="mb-4 p-4 bg-indigo-50/40 rounded-lg border border-indigo-200 print:bg-transparent print:border-none print:p-0 text-[14px] print:text-[10px] page-break-after-always">
            <div class="font-bold text-indigo-900 print:text-black mb-3 print:mb-1.5 flex justify-between items-end border-b-2 border-indigo-300 print:border-black pb-2 print:pb-1">
                <span class="flex items-center gap-2 text-lg print:text-base">
                    <svg class="w-5 h-5 print:hidden text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                    [${getDayName(day)}] 시료 채취 필요 장비 전체 통계 (대시보드)
                </span>
                <span class="bg-indigo-600 text-white print:bg-transparent print:text-black px-3 py-1 rounded-md text-sm print:text-[11px] font-extrabold print:border-2 print:border-black shadow-sm tracking-wide">
                    A : ${uniqueA.size}개 &nbsp;|&nbsp; P : ${uniqueP.size}개 &nbsp;|&nbsp; L : ${uniqueL.size}개 &nbsp;|&nbsp; N : ${countN}개
                </span>
            </div>
            
            <table class="w-full text-left border-collapse border border-gray-300 print:border-black print:border-2 text-[13px] print:text-[10.5px]">
                <thead class="bg-indigo-50 print:bg-gray-200 text-indigo-900 print:text-black">
                    <tr>
                        <th class="border border-gray-300 print:border-black px-2 py-1.5 text-center w-[5%] font-bold">NO.</th>
                        <th class="border border-gray-300 print:border-black px-2 py-1.5 text-center w-[75%] font-bold">시료매체 (유해인자 조합)</th>
                        <th class="border border-gray-300 print:border-black px-2 py-1.5 text-center w-[10%] font-bold">건수</th>
                        <th class="border border-gray-300 print:border-black px-2 py-1.5 text-center w-[10%] font-bold">펌프</th>
                    </tr>
                </thead>
                <tbody class="bg-white print:bg-transparent">`;
        
        if (statsArray.length > 0) {
            statsArray.forEach((stat, index) => {
                let pumpStr = stat.pumps.length > 0 ? `[ ${stat.pumps.join(', ')} ]` : '';
                
                statsHtml += `<tr class="hover:bg-gray-50 print:hover:bg-transparent">
                    <td class="border border-gray-300 print:border-black px-2 py-1 text-center font-bold text-gray-600 print:text-black">${index + 1}</td>
                    <td class="border border-gray-300 print:border-black px-2 py-1 text-gray-800 print:text-black font-medium break-all whitespace-pre-wrap">${stat.name}</td>
                    <td class="border border-gray-300 print:border-black px-2 py-1 text-center text-indigo-700 print:text-black font-extrabold">${stat.count}건</td>
                    <td class="border border-gray-300 print:border-black px-2 py-1 text-center text-indigo-600 print:text-black font-bold">${pumpStr}</td>
                </tr>`;
            });
        } else {
            statsHtml += `<tr><td colspan="4" class="border border-gray-300 print:border-black px-2 py-3 text-center text-gray-500 italic">등록된 유해인자가 없습니다.</td></tr>`;
        }
        statsHtml += `</tbody></table></div>`;

        // 4. 요약표 컨테이너 및 엑셀 스타일 표 렌더링
        let html = `<div class="bg-white p-4 rounded-lg border border-gray-300 shadow-sm print:border-none print:shadow-none break-inside-avoid print:mb-0 mb-4 w-full page-break-after-always summary-section print:p-0">`;
        html += `<h3 class="font-bold text-lg text-indigo-700 mb-3 border-b border-indigo-100 pb-2 print:text-black print:border-black print:text-[14px] print:mb-1 print:pb-1 flex flex-wrap items-center justify-between">
                    <div class="flex items-center">
                        <span class="bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded text-sm font-bold border border-indigo-300 print:hidden mr-2">STEP 3</span>
                        [${getDayName(day)}] 부서/공정별 시료 준비 요약표
                    </div>
                    <span class="text-xs font-normal text-amber-600 print:hidden bg-amber-50 px-2 py-1 rounded border border-amber-200 mt-1 sm:mt-0 shadow-sm">※ 인쇄 직전 표 안의 글자를 클릭해 수기로 수정할 수 있습니다.</span>
                 </h3>`;
        
        html += statsHtml; // 대시보드를 요약표 상단(별도 페이지)에 주입

        // 🚀 요약표 칸 너비(Width) 최적화 적용
        html += `<div class="w-full overflow-x-auto print:overflow-visible">
                    <table class="w-full text-left border-collapse border border-gray-300 print:border-black print:border-2 text-[13px] print:text-[9.5px]">
                        <thead class="bg-gray-100 print:bg-gray-200">
                            <tr>
                                <th class="border border-gray-300 print:border-black px-1 py-1.5 print:py-0.5 text-center w-[3%] font-bold text-gray-700 print:text-black">NO.</th>
                                <th class="border border-gray-300 print:border-black px-1 py-1.5 print:py-0.5 text-center w-[10%] font-bold text-gray-700 print:text-black">부서명</th>
                                <th class="border border-gray-300 print:border-black px-1 py-1.5 print:py-0.5 text-center w-[10%] font-bold text-gray-700 print:text-black">공정명</th>
                                <th class="border border-gray-300 print:border-black px-1 py-1.5 print:py-0.5 text-center w-[6%] font-bold text-gray-700 print:text-black">교대제</th>
                                <th class="border border-gray-300 print:border-black px-1 py-1.5 print:py-0.5 text-center w-[4%] font-bold text-gray-700 print:text-black">근로자수</th>
                                <th class="border border-gray-300 print:border-black px-1 py-1.5 print:py-0.5 text-center w-[9%] font-bold text-gray-700 print:text-black">근로자명</th>
                                <th class="border border-gray-300 print:border-black px-1 py-1.5 print:py-0.5 text-center w-[38%] font-bold text-gray-700 print:text-black">시료 유해인자 조합 (비고 포함)</th>
                                <th class="border border-gray-300 print:border-black px-1 py-1.5 print:py-0.5 text-center w-[5%] font-bold text-gray-700 print:text-black">A</th>
                                <th class="border border-gray-300 print:border-black px-1 py-1.5 print:py-0.5 text-center w-[5%] font-bold text-gray-700 print:text-black">P</th>
                                <th class="border border-gray-300 print:border-black px-1 py-1.5 print:py-0.5 text-center w-[5%] font-bold text-gray-700 print:text-black">L</th>
                                <th class="border border-gray-300 print:border-black px-1 py-1.5 print:py-0.5 text-center w-[5%] font-bold text-gray-700 print:text-black">N</th>
                            </tr>
                        </thead>
                        <tbody class="print:border-black">`;

        let noIndex = 1;

        unitNames.forEach(unit => {
            const currentWorkers = appData.units[unit].filter(w => (w.day || 1) === day);
            if(currentWorkers.length === 0) return;
            
            // 🚀 부서명, 공정명, 교대제, 근로자수가 같은 행들을 시각적으로 병합하기 위한 계산 로직
            const groupSpans = new Array(currentWorkers.length).fill(0);
            for (let i = 0; i < currentWorkers.length; i++) {
                if (groupSpans[i] !== 0) continue; 
                
                let totalRowSpan = currentWorkers[i]._wSpan; 
                for (let j = i + 1; j < currentWorkers.length; j++) {
                    const isSameGroup = 
                        currentWorkers[i].department === currentWorkers[j].department &&
                        currentWorkers[i].process === currentWorkers[j].process &&
                        currentWorkers[i].shiftSystem === currentWorkers[j].shiftSystem &&
                        currentWorkers[i].workerCount === currentWorkers[j].workerCount;

                    if (isSameGroup) {
                        totalRowSpan += currentWorkers[j]._wSpan; 
                        groupSpans[j] = -1; 
                    } else {
                        break; 
                    }
                }
                groupSpans[i] = totalRowSpan; 
            }
            
            currentWorkers.forEach((worker, wIdx) => {
                let deptName = (worker.department || '').trim();
                let procName = (worker.process || '').trim();
                
                let shift = (worker.shiftSystem || '').trim();
                let wCount = (worker.workerCount || '').trim();
                let wName = (worker.name || '').trim();

                const wSpan = worker._wSpan; 
                const gSpan = groupSpans[wIdx]; 
                
                worker._summaryCombinations.forEach((combo, comboIdx) => {
                    html += `<tr class="hover:bg-gray-50 print:hover:bg-transparent group" style="page-break-inside: avoid;">`;
                    
                    // 1. 공통 사항 병합 (같은 부서행의 가장 첫 줄일 때만 렌더링)
                    if (gSpan > 0 && comboIdx === 0) {
                        html += `<td class="border border-gray-300 print:border-black px-1 py-0 print:py-0.5 text-center font-bold align-middle text-gray-600 print:text-black" rowspan="${gSpan}">${noIndex++}</td>`;
                        
                        html += `<td class="border border-gray-300 print:border-black px-1 py-0 print:py-0.5 align-middle font-bold text-gray-800 print:text-black text-center" rowspan="${gSpan}">
                                    <div class="print:hidden h-full flex items-center"><textarea oninput="smartResize(this)" class="w-full bg-transparent border-transparent focus:border-blue-500 outline-none p-1 text-center resize-none overflow-hidden leading-tight font-bold text-[13px]" rows="1">${deptName}</textarea></div>
                                    <div class="hidden print:block w-full leading-tight break-all whitespace-pre-wrap text-center text-[9px]">${deptName}</div>
                                 </td>`;
                                 
                        html += `<td class="border border-gray-300 print:border-black px-1 py-0 print:py-0.5 align-middle font-bold text-gray-800 print:text-black text-center" rowspan="${gSpan}">
                                    <div class="print:hidden h-full flex items-center"><textarea oninput="smartResize(this)" class="w-full bg-transparent border-transparent focus:border-blue-500 outline-none p-1 text-center resize-none overflow-hidden leading-tight font-bold text-[13px]" rows="1">${procName}</textarea></div>
                                    <div class="hidden print:block w-full leading-tight break-all whitespace-pre-wrap text-center text-[9px]">${procName}</div>
                                 </td>`;
                                 
                        html += `<td class="border border-gray-300 print:border-black px-1 py-0 print:py-0.5 align-middle font-bold text-gray-700 print:text-black text-center" rowspan="${gSpan}">
                                    <div class="print:hidden h-full flex items-center"><textarea oninput="smartResize(this)" class="w-full bg-transparent border-transparent focus:border-blue-500 outline-none p-1 text-center resize-none overflow-hidden leading-tight font-bold text-[13px]" rows="1">${shift}</textarea></div>
                                    <div class="hidden print:block w-full leading-tight break-all whitespace-pre-wrap text-center text-[9px]">${shift}</div>
                                 </td>`;

                        html += `<td class="border border-gray-300 print:border-black px-1 py-0 print:py-0.5 align-middle font-bold text-indigo-700 print:text-black text-center bg-indigo-50/30 print:bg-transparent" rowspan="${gSpan}">
                                    <div class="print:hidden h-full flex items-center"><textarea oninput="smartResize(this)" class="w-full bg-transparent border-transparent focus:border-blue-500 outline-none p-1 text-center resize-none overflow-hidden leading-tight font-bold text-[13px]" rows="1">${wCount}</textarea></div>
                                    <div class="hidden print:block w-full leading-tight break-all whitespace-pre-wrap text-center text-[9px]">${wCount}</div>
                                 </td>`;
                    }
                    
                    // 2. 근로자명은 행(Worker) 단위로만 병합 (좌측 정렬 적용)
                    if (comboIdx === 0) {
                        html += `<td class="border border-gray-300 print:border-black px-1 py-0 print:py-0.5 align-middle font-bold text-gray-700 print:text-black text-left" rowspan="${wSpan}">
                                    <div class="print:hidden h-full flex items-center"><textarea oninput="smartResize(this)" class="w-full bg-transparent border-transparent focus:border-blue-500 outline-none p-1 text-left resize-none overflow-hidden leading-tight font-bold text-[13px]" rows="1">${wName}</textarea></div>
                                    <div class="hidden print:block w-full leading-tight break-all whitespace-pre-wrap text-left text-[9px]">${wName}</div>
                                 </td>`;
                    }

                    // 3. 개별 유해인자 조합 정보
                    html += `<td class="border border-gray-300 print:border-black px-1 py-0 print:py-0.5 text-gray-700 print:text-black break-words leading-snug w-[38%]">
                                <div class="print:hidden h-full flex items-center"><textarea oninput="smartResize(this)" class="w-full bg-transparent border-transparent focus:border-blue-500 outline-none p-1 text-left resize-none overflow-hidden leading-tight text-[13px]" rows="1">${combo.name}</textarea></div>
                                <div class="hidden print:block w-full leading-tight break-all whitespace-pre-wrap text-left text-[9px]">${combo.name}</div>
                             </td>`;
                             
                    let aStyle = combo.a ? "background-color: #fef9c3 !important; color: #1e3a8a !important; print-color-adjust: exact; -webkit-print-color-adjust: exact;" : "";
                    let aText = combo.a ? "color: #1e3a8a !important;" : "";
                    html += `<td class="border border-gray-300 print:border-black px-1 py-0 print:py-0.5 text-center align-middle" style="${aStyle}">
                                <div class="print:hidden h-full flex items-center"><textarea oninput="smartResize(this)" class="w-full bg-transparent border-transparent outline-none p-1 text-center resize-none overflow-hidden leading-tight font-black text-[15px]" style="${aText}" rows="1">${combo.a}</textarea></div>
                                <div class="hidden print:block w-full leading-tight text-center font-black" style="font-size: 14px !important; font-weight: 900 !important; letter-spacing: 0.5px !important; ${aText}">${combo.a}</div>
                             </td>`;

                    let pStyle = combo.p ? "background-color: #dcfce7 !important; color: #000000 !important; print-color-adjust: exact; -webkit-print-color-adjust: exact;" : "";
                    let pText = combo.p ? "color: #000000 !important;" : "";
                    html += `<td class="border border-gray-300 print:border-black px-1 py-0 print:py-0.5 text-center align-middle" style="${pStyle}">
                                <div class="print:hidden h-full flex items-center"><textarea oninput="smartResize(this)" class="w-full bg-transparent border-transparent outline-none p-1 text-center resize-none overflow-hidden leading-tight font-black text-[15px]" style="${pText}" rows="1">${combo.p}</textarea></div>
                                <div class="hidden print:block w-full leading-tight text-center font-black" style="font-size: 14px !important; font-weight: 900 !important; letter-spacing: 0.5px !important; ${pText}">${combo.p}</div>
                             </td>`;

                    let lStyle = combo.l ? "background-color: #dbeafe !important; color: #14532d !important; print-color-adjust: exact; -webkit-print-color-adjust: exact;" : "";
                    let lText = combo.l ? "color: #14532d !important;" : "";
                    html += `<td class="border border-gray-300 print:border-black px-1 py-0 print:py-0.5 text-center align-middle" style="${lStyle}">
                                <div class="print:hidden h-full flex items-center"><textarea oninput="smartResize(this)" class="w-full bg-transparent border-transparent outline-none p-1 text-center resize-none overflow-hidden leading-tight font-black text-[15px]" style="${lText}" rows="1">${combo.l}</textarea></div>
                                <div class="hidden print:block w-full leading-tight text-center font-black" style="font-size: 14px !important; font-weight: 900 !important; letter-spacing: 0.5px !important; ${lText}">${combo.l}</div>
                             </td>`;

                    let nText = combo.n ? "color: #1d4ed8 !important;" : "";
                    html += `<td class="border border-gray-300 print:border-black px-1 py-0 print:py-0.5 text-center align-middle">
                                <div class="print:hidden h-full flex items-center"><textarea oninput="smartResize(this)" class="w-full bg-transparent border-transparent outline-none p-1 text-center resize-none overflow-hidden leading-tight font-black text-[15px]" style="${nText}" rows="1">${combo.n}</textarea></div>
                                <div class="hidden print:block w-full leading-tight text-center font-black" style="font-size: 14px !important; font-weight: 900 !important; letter-spacing: 0.5px !important; ${nText}">${combo.n}</div>
                             </td>`;
                    html += `</tr>`;
                });
            });
        });

        html += `       </tbody>
                    </table>
                 </div>
              </div>`;
              
        return html;
    }

    function renderTables() {
      const container = document.getElementById('tables-container');
      let html = '';
      const allDays = getActiveDays();
      const unitNames = Object.keys(appData.units);
      
      // 🚀 요약 대시보드를 독립 컨테이너에서 제거하고, 테이블 렌더링 루프 내부로 이동시켜 팀별로 분리
      const summaryContainer = document.getElementById('summary-dashboard-container');
      if (summaryContainer) {
          summaryContainer.innerHTML = '';
          summaryContainer.classList.add('hidden', 'print:hidden');
      }
      
      let printedDayCount = 0; 
      
      allDays.forEach(day => {
          let hasDataForDay = false;
          unitNames.forEach(u => { if(appData.units[u].some(w => (w.day || 1) === day)) hasDataForDay = true; });
          if(!hasDataForDay) return;
          
          const isActiveDay = (day === appData.currentDay);
          const displayClass = isActiveDay ? 'block' : 'hidden print:block';
          let headerTitle = appData.currentUnit === 'ALL' ? '전체 사업체' : `[단위사업체] : ${appData.currentUnit}`;

          const pageBreakClass = printedDayCount > 0 ? 'page-break-before' : '';
          printedDayCount++;

          // 1. 해당 일차(Day)의 시료 준비 요약표 생성 및 배치
          let summaryHtml = '';
          if (typeof generateSampleSummaryForDay === 'function') {
              summaryHtml = generateSampleSummaryForDay(day, unitNames);
          }
          
          if (summaryHtml) {
              html += `<div class="summary-section ${displayClass} ${pageBreakClass}">${summaryHtml}</div>`;
          }

          // 2. 해당 일차(Day)의 측정 대상 표 생성 (요약표가 있으면 pageBreakClass는 생략, 출력 후 무조건 다음 장으로 넘김)
          let dayHtml = `<div class="day-section ${displayClass} print:mb-8 ${summaryHtml ? '' : pageBreakClass} page-break-after-always">`;
          dayHtml += `<div class="print-unit-header flex flex-col md:flex-row md:justify-between md:items-end gap-2 mb-2 border-b pb-1 print:border-black print:mb-1 print:mt-4">
                        <h2 class="text-lg font-semibold text-gray-800 print:text-[12px] print:m-0 print:p-0 print:font-bold flex items-center flex-wrap">
                            <span class="text-amber-600 mr-2 print:text-black">[ ${getDayName(day)} ]</span>
                            <span class="text-indigo-600 mr-2 print:text-black">${headerTitle}</span> 측정 대상 및 유해인자 목록
                            <span id="count-display-${day}" class="text-sm text-gray-600 print:text-[10px] print:text-black font-medium ml-2"></span>
                        </h2>
                        <div class="flex gap-1.5 print:hidden pb-1">
                            <label class="flex items-center gap-1 cursor-pointer text-[12px] font-bold bg-white hover:bg-gray-50 text-gray-700 px-2 py-1 rounded border border-gray-300 transition-colors shadow-sm">
                                <input type="checkbox" onchange="toggleAllCheckboxesDay(${day}, this.checked)" class="w-3.5 h-3.5 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500 cursor-pointer mt-0.5">
                                전체선택
                            </label>
                            <button onclick="duplicateCheckedWorkersDay(${day})" class="text-[12px] font-bold bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-300 px-2.5 py-1 rounded shadow-sm transition-colors tracking-tight">일괄 행복사</button>
                            <button onclick="deleteCheckedWorkersDay(${day})" class="text-[12px] font-bold bg-red-50 hover:bg-red-100 text-red-600 border border-red-300 px-2.5 py-1 rounded shadow-sm transition-colors tracking-tight">일괄 행삭제</button>
                        </div>
                     </div>`;
                     
          dayHtml += `<div class="overflow-x-auto border border-gray-200 rounded-lg print:border-black print:border-2 print:rounded-none print:shadow-none bg-white">
                      <table class="w-full text-left text-sm whitespace-nowrap min-w-[1250px] print:min-w-0 border-collapse">
                        <thead class="bg-gray-100 text-gray-700 uppercase font-semibold border-b border-gray-200 print:bg-gray-200 print:border-black print:text-black print:text-[9px]">
                          <tr>
                            <th class="px-1 py-2 w-[25px] text-center border-r border-b border-gray-200 print:border-black nowrap-col">No.</th>
                            <th class="px-1 py-2 w-[55px] border-r border-b border-gray-200 print:border-black nowrap-col text-center">부서명</th>
                            <th class="px-1 py-2 w-[55px] border-r border-b border-gray-200 print:border-black nowrap-col text-center">공정명</th>
                            <th class="px-1 py-2 w-[55px] border-r border-b border-gray-200 print:border-black text-center nowrap-col">교대제</th>
                            <th class="px-1 py-2 w-[40px] border-r border-b border-gray-200 print:border-black text-center nowrap-col">근로자수</th>
                            <th class="px-1 py-2 w-[50px] border-r border-b border-gray-200 print:border-black text-center nowrap-col">노출주기</th>
                            <th class="px-1 py-2 w-[40px] border-r border-b border-gray-200 print:border-black text-center nowrap-col">측정건수</th>
                            <th class="px-2 py-2 w-[300px] border-r border-b border-gray-200 print:border-black text-center">유해인자 (발생물질 등)</th>
                            <th class="px-1 py-2 w-[37px] border-r border-b border-gray-200 print:border-black text-center">A</th>
                            <th class="px-1 py-2 w-[37px] border-r border-b border-gray-200 print:border-black text-center">P</th>
                            <th class="px-1 py-2 w-[37px] border-r border-b border-gray-200 print:border-black text-center">L</th>
                            <th class="px-1 py-2 w-[37px] border-r border-b border-gray-200 print:border-black text-center">N</th>
                            <th class="px-1 py-2 w-[110px] border-r border-b border-gray-200 print:border-black text-center">비고</th>

                            <th class="px-2 py-2 w-[110px] text-center border-b border-gray-200 print:hidden">관리</th>
                          </tr>
                        </thead>`;

          let globalWorkerIndex = 0; 

          unitNames.forEach((unitName) => {
              if (appData.currentUnit !== 'ALL' && appData.currentUnit !== unitName) return;
              const currentWorkers = appData.units[unitName].filter(w => (w.day || 1) === day);
              if (currentWorkers.length === 0) return;
              
              if (appData.currentUnit === 'ALL') {
                  dayHtml += `<tbody class="print:border-black"><tr><td colspan="15" class="bg-indigo-50 border-b border-gray-200 print:border-black py-1.5 px-3 text-sm font-bold text-indigo-800 print:text-[10px] print:text-black">
                    🏢 [단위사업체] : ${unitName}
                  </td></tr></tbody>`;
              }

              const spans = calculateSpansForWorkers(currentWorkers);
              const groupSpans = [];
              for(let i=0; i<currentWorkers.length; i++) {
                  if (spans[i] > 0) {
                      let tf = 0;
                      for(let j=i; j<i+spans[i]; j++) tf += currentWorkers[j].harmfulFactors.length;
                      groupSpans[i] = tf;
                  } else groupSpans[i] = 0;
              }

              let currentGroupEndIndex = -1;

              currentWorkers.forEach((worker, index) => {
                  globalWorkerIndex++;
                  const displayIndex = appData.currentUnit === 'ALL' ? globalWorkerIndex : index + 1;
                  const originalRowSpan = spans[index];
                  const gSpan = groupSpans[index]; 
                  const wSpan = worker.harmfulFactors.length;

                  // === 펌프 번호별 개별 색상 부여 로직 ===
                  const numCounts = {};
                  worker.harmfulFactors.forEach(f => {
                      const val = String(f.a || f.p || f.l || '').replace(/[^0-9]/g, '');
                      if (val) numCounts[val] = (numCounts[val] || 0) + 1;
                  });

                  const colorPalette = ['bg-blue-50', 'bg-emerald-50', 'bg-amber-50', 'bg-purple-50', 'bg-rose-50', 'bg-cyan-50'];
                  let colorMap = {};
                  let colorIdx = 0;
                  
                  worker.harmfulFactors.forEach(f => {
                      const val = String(f.a || f.p || f.l || '').replace(/[^0-9]/g, '');
                      if (val && numCounts[val] >= 2 && !colorMap[val]) {
                          colorMap[val] = colorPalette[colorIdx % colorPalette.length];
                          colorIdx++;
                      }
                  });

                  if (originalRowSpan > 0) {
                      currentGroupEndIndex = index + originalRowSpan - 1;
                      dayHtml += `<tbody class="print:border-black group-tbody">`;
                  }

                  if (worker.pageBreak && index > 0) {
                    dayHtml += `<tr class="print:hidden"><td colspan="15" class="text-center py-0.5 text-xs text-indigo-500 font-bold border-t-2 border-b-2 border-indigo-200 border-dashed bg-indigo-50/50">✂️ 인쇄 시 여기서부터 다음 페이지 첫 줄로 출력됩니다 ✂️</td></tr>`;
                  }
                  
                  const pageBreakClass = worker.pageBreak ? 'page-break-before' : '';

                  worker.harmfulFactors.forEach((factor, fIndex) => {
                      const isGroupStart = (gSpan > 0 && fIndex === 0);
                      const isWorkerStart = (fIndex === 0);
                      const hasMultiple = wSpan > 1;
                      const bClass = 'border-b border-gray-200 print:border-black';
                      const rowPrintClass = isWorkerStart ? (hasMultiple ? 'worker-start-row has-multiple-factors' : 'worker-start-row') : 'factor-inner-row';
                      
                      const factorVal = String(factor.a || factor.p || factor.l || '').replace(/[^0-9]/g, '');
                      const factorBgClass = factorVal && colorMap[factorVal] ? `${colorMap[factorVal]} print:${colorMap[factorVal]}` : '';

                      const adjustedClasses = factor.isAdjusted ? 'text-gray-400 line-through decoration-gray-400' : '';
                      const badgeHtml = factor.isAdjusted ? `<span class="text-red-500 font-bold mr-1 text-[10px] print:text-[8px] shrink-0 flex items-center">[조정]</span>` : '';
                      
                      dayHtml += `<tr class="hover:bg-gray-50 print:hover:bg-transparent transition-colors group ${rowPrintClass} ${isWorkerStart ? pageBreakClass : ''}">`;
                      
                      // 1. 번호 (여백 최소화 py-0)
                      if (isWorkerStart) {
                          dayHtml += `<td class="px-1 py-0 text-center text-gray-500 border-r ${bClass} align-middle print:p-0.5 print:pt-1 nowrap-col" rowspan="${wSpan}">${displayIndex}</td>`;
                      }
                      
                      // 2~7. 부서명, 공정명 등 그룹 병합 칸 (여백 최소화 py-0, leading-tight)
