                          dayHtml += `<td class="px-1 py-0 border-r ${bClass} align-middle print:p-0.5 print:pt-1" rowspan="${gSpan}">
                                    <div class="print:hidden h-full flex items-center"><textarea data-focus-id="dept-${worker.id}" oninput="smartResize(this); updateGroupField('${unitName}', ${day}, ${index}, ${originalRowSpan}, 'department', this.value)" class="w-full bg-transparent border-transparent focus:border-blue-500 outline-none p-0.5 text-center resize-none overflow-hidden leading-tight" rows="1">${worker.department}</textarea></div>
                                    <div id="print-dept-${worker.id}" class="hidden print:block w-full text-[9px] leading-tight break-all whitespace-pre-wrap text-center">${worker.department}</div>
                                   </td>`;
                          dayHtml += `<td class="px-1 py-0 border-r ${bClass} align-middle print:p-0.5 print:pt-1" rowspan="${gSpan}">
                                    <div class="print:hidden h-full flex items-center"><textarea data-focus-id="proc-${worker.id}" oninput="smartResize(this); updateGroupField('${unitName}', ${day}, ${index}, ${originalRowSpan}, 'process', this.value)" class="w-full bg-transparent border-transparent focus:border-blue-500 outline-none p-0.5 text-center resize-none overflow-hidden leading-tight" rows="1">${worker.process}</textarea></div>
                                    <div id="print-proc-${worker.id}" class="hidden print:block w-full text-[9px] leading-tight break-all whitespace-pre-wrap text-center">${worker.process}</div>
                                   </td>`;
                          dayHtml += `<td class="px-1 py-0 border-r ${bClass} align-middle text-center print:p-0.5 print:pt-1" rowspan="${gSpan}">
                                    <div class="print:hidden h-full flex items-center"><textarea data-focus-id="shift-${worker.id}" oninput="smartResize(this); updateGroupField('${unitName}', ${day}, ${index}, ${originalRowSpan}, 'shiftSystem', this.value)" class="w-full bg-transparent border-transparent focus:border-blue-500 outline-none p-0.5 text-center resize-none overflow-hidden leading-tight" rows="1">${worker.shiftSystem}</textarea></div>
                                    <div id="print-shift-${worker.id}" class="hidden print:block w-full text-[9px] leading-tight break-all whitespace-pre-wrap text-center">${worker.shiftSystem}</div>
                                   </td>`;
                          dayHtml += `<td class="px-1 py-0 border-r ${bClass} align-middle text-center print:p-0.5 print:pt-1" rowspan="${gSpan}">
                                    <div class="print:hidden h-full flex items-center"><textarea data-focus-id="cnt-${worker.id}" oninput="smartResize(this); updateGroupField('${unitName}', ${day}, ${index}, ${originalRowSpan}, 'workerCount', this.value)" class="w-full bg-transparent border-transparent focus:border-blue-500 outline-none p-0.5 text-center resize-none overflow-hidden leading-tight" rows="1">${worker.workerCount}</textarea></div>
                                    <div id="print-cnt-${worker.id}" class="hidden print:block w-full text-[9px] leading-tight break-all whitespace-pre-wrap text-center">${worker.workerCount}</div>
                                   </td>`;
                          dayHtml += `<td class="px-1 py-0 border-r ${bClass} align-middle text-center print:p-0.5 print:pt-1" rowspan="${gSpan}">
                                    <div class="print:hidden h-full flex items-center"><textarea data-focus-id="cycle-${worker.id}" oninput="smartResize(this); updateGroupField('${unitName}', ${day}, ${index}, ${originalRowSpan}, 'exposureCycle', this.value)" class="w-full bg-transparent border-transparent focus:border-blue-500 outline-none p-0.5 text-center resize-none overflow-hidden leading-tight" rows="1">${worker.exposureCycle}</textarea></div>
                                    <div id="print-cycle-${worker.id}" class="hidden print:block w-full text-[9px] leading-tight break-all whitespace-pre-wrap text-center">${worker.exposureCycle}</div>
                                   </td>`;
                          dayHtml += `<td class="px-1 py-0 border-r ${bClass} align-middle text-center print:p-0.5 print:pt-1" rowspan="${gSpan}">
                                    <div class="print:hidden h-full flex items-center"><textarea data-focus-id="mcnt-${worker.id}" oninput="smartResize(this); updateGroupField('${unitName}', ${day}, ${index}, ${originalRowSpan}, 'measurementCount', this.value)" class="w-full bg-transparent border-transparent focus:border-blue-500 outline-none p-0.5 text-center resize-none overflow-hidden leading-tight" rows="1">${worker.measurementCount}</textarea></div>
                                    <div id="print-mcnt-${worker.id}" class="hidden print:block w-full text-[9px] leading-tight break-all whitespace-pre-wrap text-center">${worker.measurementCount}</div>
                                   </td>`;
                      }

                      // 8. 유해인자명
                      const nameLen = (factor.name || '').length;
                      let printFontSizeStyle = '';
                      // 🖨️ 인쇄 시 칸 너비가 고정되므로, 폰트를 최대한 작게 줄여 많은 내용을 담되, 넘치면 과감하게 자름(...)
                      if (nameLen > 60) printFontSizeStyle = 'font-size: 5px !important; letter-spacing: -0.6px !important;';
                      else if (nameLen > 40) printFontSizeStyle = 'font-size: 5.5px !important; letter-spacing: -0.5px !important;';
                      else if (nameLen > 30) printFontSizeStyle = 'font-size: 6px !important; letter-spacing: -0.4px !important;';
                      else if (nameLen > 20) printFontSizeStyle = 'font-size: 7px !important; letter-spacing: -0.2px !important;';
                      else printFontSizeStyle = 'font-size: 8px !important; letter-spacing: -0.1px !important;';
                      
                      let screenFontSizeStyle = '';
                      if (nameLen > 40) screenFontSizeStyle = 'font-size: 9px; letter-spacing: -0.5px;';
                      else if (nameLen > 30) screenFontSizeStyle = 'font-size: 10.5px; letter-spacing: -0.3px;';
                      else if (nameLen > 20) screenFontSizeStyle = 'font-size: 11.5px; letter-spacing: -0.2px;';
                      else screenFontSizeStyle = 'font-size: 13px;';

                      dayHtml += `<td class="border-r ${bClass} ${factorBgClass} px-1 py-0 relative group/hazard align-middle factor-cell">
                        <div class="flex items-center w-full">
                            ${badgeHtml}
                            <div class="w-full print:hidden flex items-center"><textarea data-focus-id="fname-${worker.id}-${fIndex}" oninput="smartResize(this); updateFactorField('${unitName}', ${worker.id}, ${fIndex}, 'name', this.value)" class="w-full bg-transparent outline-none pr-[36px] resize-none overflow-hidden whitespace-nowrap text-ellipsis leading-none py-0" style="${screenFontSizeStyle}" rows="1">${factor.name}</textarea></div>
                            <div id="print-fname-${worker.id}-${fIndex}" class="hidden print:block w-full text-[9px] leading-tight whitespace-nowrap overflow-hidden text-ellipsis ${adjustedClasses}" style="${printFontSizeStyle}">${factor.name}</div>
                        </div>
                        <div class="absolute right-0.5 top-1/2 -translate-y-1/2 flex items-center gap-0.5 print:hidden bg-white/90 pl-1 py-0 rounded z-10 opacity-0 group-hover/hazard:opacity-100 transition-opacity">
                           <button onclick="toggleAdjust('${unitName}', ${worker.id}, ${fIndex})" class="text-[9px] font-semibold border border-gray-300 rounded px-1 py-0 transition-colors ${factor.isAdjusted ? 'bg-red-50 text-red-600 hover:bg-red-100 border-red-200' : 'bg-white text-gray-600 hover:bg-gray-100'}" title="횟수조정">조정</button>
                           <button onclick="removeFactor('${unitName}', ${worker.id}, ${fIndex})" class="text-gray-400 hover:text-red-500 p-0 rounded transition-colors" title="삭제">
                             <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                           </button>
                        </div>
                      </td>`;

                      // 9~12. A, P, L, N (여백 최소화 py-0)
                      // 🚀 메인표 A, P, L, N 펌프 번호 시각화 극대화 (크기 두배, 제일 굵게)
                      dayHtml += `
                        <td class="border-r ${bClass} ${factorBgClass} px-1 py-0 text-center align-middle print:p-0.5 factor-cell">
                          <div class="w-full h-full print:hidden flex items-center"><textarea data-focus-id="fa-${worker.id}-${fIndex}" oninput="smartResize(this); updateFactorField('${unitName}', ${worker.id}, ${fIndex}, 'a', this.value)" class="w-full bg-transparent outline-none uppercase resize-none overflow-hidden text-center leading-tight py-0 font-black text-[15px] text-blue-700" rows="1">${factor.a}</textarea></div>
                          <div id="print-fa-${worker.id}-${fIndex}" class="hidden print:block w-full leading-tight text-center font-black" style="font-size: 14px !important; font-weight: 900 !important; letter-spacing: 0.5px !important;">${factor.a}</div>
                        </td>
                        <td class="border-r ${bClass} ${factorBgClass} px-1 py-0 text-center align-middle print:p-0.5 factor-cell">
                          <div class="w-full h-full print:hidden flex items-center"><textarea data-focus-id="fp-${worker.id}-${fIndex}" oninput="smartResize(this); updateFactorField('${unitName}', ${worker.id}, ${fIndex}, 'p', this.value)" class="w-full bg-transparent outline-none uppercase resize-none overflow-hidden text-center leading-tight py-0 font-black text-[15px] text-blue-700" rows="1">${factor.p}</textarea></div>
                          <div id="print-fp-${worker.id}-${fIndex}" class="hidden print:block w-full leading-tight text-center font-black" style="font-size: 14px !important; font-weight: 900 !important; letter-spacing: 0.5px !important;">${factor.p}</div>
                        </td>
                        <td class="border-r ${bClass} ${factorBgClass} px-1 py-0 text-center align-middle print:p-0.5 factor-cell">
                          <div class="w-full h-full print:hidden flex items-center"><textarea data-focus-id="fl-${worker.id}-${fIndex}" oninput="smartResize(this); updateFactorField('${unitName}', ${worker.id}, ${fIndex}, 'l', this.value)" class="w-full bg-transparent outline-none uppercase resize-none overflow-hidden text-center leading-tight py-0 font-black text-[15px] text-blue-700" rows="1">${factor.l}</textarea></div>
                          <div id="print-fl-${worker.id}-${fIndex}" class="hidden print:block w-full leading-tight text-center font-black" style="font-size: 14px !important; font-weight: 900 !important; letter-spacing: 0.5px !important;">${factor.l}</div>
                        </td>
                        <td class="border-r ${bClass} ${factorBgClass} px-1 py-0 text-center align-middle print:p-0.5 factor-cell">
                          <div class="w-full h-full print:hidden flex items-center"><textarea data-focus-id="fn-${worker.id}-${fIndex}" oninput="smartResize(this); updateFactorField('${unitName}', ${worker.id}, ${fIndex}, 'n', this.value)" class="w-full bg-transparent outline-none uppercase resize-none overflow-hidden text-center leading-tight py-0 font-black text-[15px] text-blue-700" rows="1">${factor.n}</textarea></div>
                          <div id="print-fn-${worker.id}-${fIndex}" class="hidden print:block w-full leading-tight text-center font-black" style="font-size: 14px !important; font-weight: 900 !important; letter-spacing: 0.5px !important;">${factor.n}</div>
                        </td>
                      `;

                      // 13. 비고
                      dayHtml += `

    function parseCSV(text) {
      const result = []; let row = []; let cell = ''; let insideQuote = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (insideQuote) {
          if (char === '"' && text[i + 1] === '"') { cell += '"'; i++; }
          else if (char === '"') { insideQuote = false; }
          else { cell += char; }
        } else {
          if (char === '"') { insideQuote = true; }
          else if (char === ',') { row.push(cell); cell = ''; }
          else if (char === '\n' || char === '\r') { row.push(cell); result.push(row); row = []; cell = ''; if (char === '\r' && text[i + 1] === '\n') i++; }
          else { cell += char; }
        }
      }
      if (cell || row.length > 0) { row.push(cell); result.push(row); }
      return result;
    }

    async function fetchSheetData(url) {
      if (!url.trim()) return null;
      try {
        const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
        if (!match) throw new Error("유효한 스프레드시트 주소가 아닙니다.");
        const exportUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv`;
        const response = await fetch(exportUrl);
        if (!response.ok) throw new Error("시트 접근 거부. 권한을 확인하세요.");
        return parseCSV(await response.text());
      } catch (error) { throw error; }
    }

    async function handleSyncSheets() {
      const excludeUrl = document.getElementById('excludeNoiseUrl').value;
      const noiseUrl = document.getElementById('noiseUrl').value;
      const syncBtn = document.getElementById('syncBtn');
      const msg = document.getElementById('syncMessage');

      if (!excludeUrl && !noiseUrl) { msg.className = 'text-sm font-medium text-red-600'; msg.innerText = 'URL을 입력해주세요.'; return; }
      syncBtn.disabled = true; syncBtn.innerText = '불러오는 중...'; msg.innerText = '';

      try {
        let factorMapping = new Map();
        try {
          const mappingSheetId = '1SrVWQxyv0n_4bQi8roKzk-nXsox-1gjWTY-z0L4H9eg';
          const mappingExportUrl = `https://docs.google.com/spreadsheets/d/${mappingSheetId}/export?format=csv`;
          const mapRes = await fetch(mappingExportUrl);
          if (mapRes.ok) {
            const mapCsv = await mapRes.text();
            const mapRows = parseCSV(mapCsv);
            mapRows.forEach(row => {
               if(row.length >= 2) {
                   const fName = (row[0]||'').trim();
                   const fRemark = (row[1]||'').trim();
                   if(fName) factorMapping.set(fName, fRemark);
               }
            });
          }
        } catch(mapErr) {
          console.warn("비고 매핑 시트를 불러오는데 실패했습니다: ", mapErr);
        }

        let mergedGroupsByUnit = {}; let excludeKeys = new Set(); let lastKnownUnit = '기본 사업체';

        const processRows = (rows, isNoiseSheet = false) => {
          if (!rows || rows.length < 2) return;
          let lastDept = '', lastProcess = '';

          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length < 4) continue;
            
            let unitName = row[0]?.trim() || '';
            if (unitName !== '') lastKnownUnit = unitName; else unitName = lastKnownUnit;
            
            let dept = row[1]?.trim() || ''; let process = row[2]?.trim() || '';
            if (dept === '' && process === '') { dept = lastDept; process = lastProcess; } 
            else { lastDept = dept; lastProcess = process; }
            if (!dept && !process) continue;

            const key = `${unitName}|${dept}|${process}`;
            if (!mergedGroupsByUnit[unitName]) mergedGroupsByUnit[unitName] = {};
            if (!isNoiseSheet) excludeKeys.add(key);

            if (!mergedGroupsByUnit[unitName][key]) {
              mergedGroupsByUnit[unitName][key] = { 
                  unit: unitName, department: dept, process: process, shiftSystem: '', 
                  workerCount: '', exposureCycle: '', measurementCount: '', name: '', 
                  pageBreak: false, factorGroups: [], hasPValue: false,
                  firstFactor: null, autoCount: 0,
                  rawFactorCounts: {} 
              };
            }

            const mergedGroup = mergedGroupsByUnit[unitName][key];

            if (!isNoiseSheet) {
              let factor = row[3]?.trim() || ''; 
              let workerCount = (row[4]?.trim()||'').replace(/(\d+)\.\d+/g, '$1'); let shift = row[5]?.trim() || ''; let cycle = row[6]?.trim() || '';
              let pValue = row.length > 15 ? row[15]?.trim() || '' : '';
              let rValue = row.length > 17 ? row[17]?.trim() || '' : '';
              let isAdjusted = (rValue === '횟수조정');
              let isTrigger = (pValue !== '') || isAdjusted;

              if (factor !== '') {
                  let cleanFactor = factor.replace(/\s+/g, '');
                  mergedGroup.rawFactorCounts[factor] = (mergedGroup.rawFactorCounts[factor] || 0) + 1;
                  if (cleanFactor !== factor) {
                      mergedGroup.rawFactorCounts[cleanFactor] = (mergedGroup.rawFactorCounts[cleanFactor] || 0) + 1;
                  }

                  if (mergedGroup.firstFactor === null) {
                      mergedGroup.firstFactor = factor;
                      mergedGroup.autoCount = 1;
                  } else if (mergedGroup.firstFactor === factor) {
                      mergedGroup.autoCount++;
                  }
              }

              if (shift) mergedGroup.shiftSystem = shift;
              if (workerCount) mergedGroup.workerCount = workerCount;
              if (cycle) mergedGroup.exposureCycle = cycle;

              if (isTrigger) { mergedGroup.hasPValue = true; mergedGroup.factorGroups.push({ factors: new Set(), isAdjusted: isAdjusted }); }
              if (factor !== '') {
                if (mergedGroup.factorGroups.length === 0) mergedGroup.factorGroups.push({ factors: new Set(), isAdjusted: false });
                mergedGroup.factorGroups[mergedGroup.factorGroups.length - 1].factors.add(factor);
                if (isAdjusted) { mergedGroup.factorGroups[mergedGroup.factorGroups.length - 1].isAdjusted = true; mergedGroup.hasPValue = true; }
              }
            } else {
              let pValue = row.length > 15 ? row[15]?.trim() || '' : '';
              let mValue = row.length > 12 ? row[12]?.trim() || '' : '';
              let isAdjusted = (mValue === '횟수조정');
              let isTrigger = (pValue !== '') || isAdjusted;

              let isNewKey = !excludeKeys.has(key);
              if (isNewKey) {
                let workerCount = (row[3]?.trim()||'').replace(/(\d+)\.\d+/g, '$1'); let shift = row[5]?.trim() || ''; let cycle = row[6]?.trim() || '';
                if (shift) mergedGroup.shiftSystem = shift; if (workerCount) mergedGroup.workerCount = workerCount; if (cycle) mergedGroup.exposureCycle = cycle;
                
                if (isTrigger) { mergedGroup.autoCount++; }
              }
              if (isTrigger) { 
                mergedGroup.hasPValue = true; 
                const noiseSet = new Set(); noiseSet.add('소음'); 
                mergedGroup.factorGroups.push({ factors: noiseSet, isAdjusted: isAdjusted }); 
                mergedGroup.rawFactorCounts['소음'] = (mergedGroup.rawFactorCounts['소음'] || 0) + 1;
              }
            }
          }
        };

        if (excludeUrl) { processRows(await fetchSheetData(excludeUrl), false); }
        if (noiseUrl) { processRows(await fetchSheetData(noiseUrl), true); }

        let totalExtracted = 0; let newAppUnits = {};

        for (const unitName in mergedGroupsByUnit) {
            const newWorkers = Object.values(mergedGroupsByUnit[unitName]).filter(group => group.hasPValue).map((group) => {
                let uniqueFactorsMap = new Map();
                group.factorGroups.forEach(fg => {
                  let str = Array.from(fg.factors).join(', ').trim();
                  if (str !== '') { if (!uniqueFactorsMap.has(str) || fg.isAdjusted) uniqueFactorsMap.set(str, fg.isAdjusted); }
                });
                let formattedFactors = [];
                uniqueFactorsMap.forEach((isAdjusted, name) => { 
                  let autoRemark = factorMapping.get(name) || '';
                  
                  let maxCount = group.rawFactorCounts[name] || group.rawFactorCounts[name.replace(/\s+/g, '')] || 0;
                  
                  if (maxCount === 0) {
                      let factorNames = name.split(',').map(s => s.trim());
                      factorNames.forEach(fn => {
                          let count = group.rawFactorCounts[fn] || group.rawFactorCounts[fn.replace(/\s+/g, '')] || 0;
                          if (count > maxCount) maxCount = count;
                      });
                  }

                  if (maxCount > 0 && group.autoCount > 0 && maxCount !== group.autoCount) {
                      let diffStr = `${maxCount}건`;
                      autoRemark = autoRemark ? `${autoRemark} / ${diffStr}` : diffStr;
                  }

                  let initialN = (name.includes('소음') && !isAdjusted) ? 'V' : '';
                  formattedFactors.push({ name: name, a: '', p: '', l: '', n: initialN, remark: autoRemark, isAdjusted: isAdjusted }); 
                });
                
                formattedFactors.sort((a, b) => {
                    const aIsNoise = (a.name || '').includes('소음');
                    const bIsNoise = (b.name || '').includes('소음');
                    if (aIsNoise && !bIsNoise) return -1;
                    if (!aIsNoise && bIsNoise) return 1;
                    return 0;
                });

                if (formattedFactors.length === 0) formattedFactors.push({ name: '', a: '', p: '', l: '', n: '', remark: '', isAdjusted: false });

                return {
                  id: Date.now() + Math.random(), day: 1, department: group.department, process: group.process, 
                  shiftSystem: group.shiftSystem, workerCount: group.workerCount, exposureCycle: group.exposureCycle, 
                  measurementCount: group.autoCount > 0 ? String(group.autoCount) : '', 
                  name: '', isManual: false, pageBreak: false, harmfulFactors: formattedFactors
                };
            });
            if (newWorkers.length > 0) { newAppUnits[unitName] = newWorkers; totalExtracted += newWorkers.length; }
        }

        } else {
          msg.className = 'text-sm font-medium text-red-600'; msg.innerText = '조건에 맞는 데이터가 없습니다.';

                if (count >= 2) cb.checked = true;
              }

          });

    async function matchAPLNumbers() {
      const sampleUrl = document.getElementById('sampleUrl').value;
      const btn = document.getElementById('matchAPLBtn');
      const msg = document.getElementById('matchMessage');

      if (!sampleUrl) {
          msg.className = 'text-sm font-medium text-red-600';
          msg.innerText = '시료채취대장 URL을 입력해주세요.';
          return;
      }

      btn.disabled = true;
      btn.innerHTML = '매칭 중...';
      msg.innerText = '';

      try {
          const rows = await fetchSheetData(sampleUrl);
          if (!rows || rows.length < 2) throw new Error("데이터를 읽어올 수 없거나 비어있습니다.");

          let matchCount = 0;
          
          const cleanToken = (str) => String(str || '').replace(/[\s\(\)\[\]\-\/]/g, '').toLowerCase();
          const removeStel = (str) => str.replace(/stel/g, ''); 

          const matchedSlots = new Set();

          for (let i = 1; i < rows.length; i++) {
              const row = rows[i];
              const targetColC = row[2] || '';
              const targetColD = row[3] || '';
              const refColE = String(row[4] || '').replace(/[\s\(\)\[\]\-\/\,]/g, '').toLowerCase(); 
              
              const refColK_tokens = String(row[10] || '').split(',').map(cleanToken).filter(Boolean);
              const refColL_tokens = String(row[11] || '').split(',').map(cleanToken).filter(Boolean);

              const combinedCD = (targetColC + ' ' + targetColD).toUpperCase();
              
              const regex = /(?:^|[^A-Z])([APLM])(\d+)/g;
              let matchResult;
              let extractedPumps = [];
              
              while ((matchResult = regex.exec(combinedCD)) !== null) {
                  let pumpType = matchResult[1].toLowerCase();
                  if (pumpType === 'm') pumpType = 'a';
                  extractedPumps.push({ type: pumpType, num: matchResult[2] });
              }

              if (extractedPumps.length === 0) continue; 

              let isMatchedForThisRow = false; 

              for (const unitName of Object.keys(appData.units)) {
                  if (isMatchedForThisRow) break;

                  const workers = appData.units[unitName];
                  for (let wIndex = 0; wIndex < workers.length; wIndex++) {
                      if (isMatchedForThisRow) break;

                      const worker = workers[wIndex];
                      
                      if ((worker.day || 1) !== appData.currentDay) continue;

                      const wDept = String(worker.department || '').replace(/[\s\(\)\[\]\-\/\,]/g, '').toLowerCase();
                      const wProc = String(worker.process || '').replace(/[\s\(\)\[\]\-\/\,]/g, '').toLowerCase();
                      
                      const isEColumnMatch = (wDept !== '' && refColE.includes(wDept)) || (wProc !== '' && refColE.includes(wProc));

                      if (isEColumnMatch) {
                          let matchedFactorIndex = -1;

                          for (let fIndex = 0; fIndex < worker.harmfulFactors.length; fIndex++) {
                              const factor = worker.harmfulFactors[fIndex];
                              if (factor.isAdjusted) continue; 
                              
                              const slotId = `${worker.id}-${fIndex}`;
                              if (matchedSlots.has(slotId)) continue; 

                              const fName_tokens = String(factor.name || '').split(',').map(cleanToken).filter(Boolean);
                              
                              let isStrictMatch = fName_tokens.some(token => refColK_tokens.includes(token) || refColL_tokens.includes(token));

                              if (isStrictMatch) {
                                  matchedFactorIndex = fIndex;
                                  break;
                              }
                          }

                          if (matchedFactorIndex === -1) {
                              for (let fIndex = 0; fIndex < worker.harmfulFactors.length; fIndex++) {
                                  const factor = worker.harmfulFactors[fIndex];
                                  if (factor.isAdjusted) continue;
                                  
                                  const slotId = `${worker.id}-${fIndex}`;
                                  if (matchedSlots.has(slotId)) continue;

                                  const fName_tokens = String(factor.name || '').split(',').map(cleanToken).filter(Boolean);
                                  
                                  const hasLooseMatch = fName_tokens.some(token => {
                                      const looseToken = removeStel(token);
                                      const looseK = refColK_tokens.map(removeStel);
                                      const looseL = refColL_tokens.map(removeStel);
                                      return looseK.includes(looseToken) || looseL.includes(looseToken);
                                  });
                                  
                                  if (hasLooseMatch) {
                                      matchedFactorIndex = fIndex;
                                      break;
                                  }
                              }
                          }

                          if (matchedFactorIndex !== -1) {
                              const factor = worker.harmfulFactors[matchedFactorIndex];
                              const slotId = `${worker.id}-${matchedFactorIndex}`;
                              
                              extractedPumps.forEach(pump => {
                                  factor[pump.type] = pump.num; 
                              });
                              
                              matchedSlots.add(slotId);
                              isMatchedForThisRow = true;
                              matchCount++;
                              break; 
                          }
                      }
                  }
              }
          }

          if (matchCount > 0) {
              // 💡 매칭 완료 후 그룹화 및 정렬 로직 (순서 유지 기능 포함)
              Object.keys(appData.units).forEach(unitName => {
                  appData.units[unitName].forEach(worker => {
                      if ((worker.day || 1) === appData.currentDay) {
                          // 1. 현재의 원래 순서(index)를 임시로 기억해둡니다.
                          worker.harmfulFactors.forEach((f, idx) => f._originalIndex = idx);

                          // 2. 각 펌프 번호가 몇 번씩 등장하는지 카운트합니다.
                          const numCounts = {};
                          worker.harmfulFactors.forEach(f => {
                              const num = String(f.a || f.p || f.l || '').replace(/[^0-9]/g, '');
                              if (num) numCounts[num] = (numCounts[num] || 0) + 1;
                          });

                          // 3. 지능형 정렬 시작
                          worker.harmfulFactors.sort((a, b) => {
                              // [1순위] 소음은 무조건 맨 위로 고정
                              const aIsNoise = (a.name || '').includes('소음');
                              const bIsNoise = (b.name || '').includes('소음');
                              if (aIsNoise && !bIsNoise) return -1;
                              if (!aIsNoise && bIsNoise) return 1;

                              const numA = String(a.a || a.p || a.l || '').replace(/[^0-9]/g, '');
                              const numB = String(b.a || b.p || b.l || '').replace(/[^0-9]/g, '');

                              // 이 항목이 2개 이상 모인 '그룹'인지 판별
                              const aIsGrouped = numA && numCounts[numA] >= 2;
                              const bIsGrouped = numB && numCounts[numB] >= 2;

                              // [2순위] 2개 이상 묶인 그룹을 우선적으로 위(소음 밑)로 끌어올림
                              if (aIsGrouped && !bIsGrouped) return -1;
                              if (!aIsGrouped && bIsGrouped) return 1;

                              // [3순위] 둘 다 그룹이라면, 같은 번호끼리 딱 붙도록 번호순 정렬
                              if (aIsGrouped && bIsGrouped) {
                                  const parsedA = parseInt(numA, 10);
                                  const parsedB = parseInt(numB, 10);
                                  if (parsedA !== parsedB) {
                                      return parsedA - parsedB; 
                                  }
                              }

                              // [4순위] 단독 항목이거나, 번호가 없거나, 같은 그룹 내에서의 순서는 '무조건 기존 순서 유지'
                              return a._originalIndex - b._originalIndex;
                          });

                          // 임시 저장했던 순서표 삭제 (청소)
                          worker.harmfulFactors.forEach(f => delete f._originalIndex);
                      }
                  });
              });

              msg.className = 'text-sm font-medium text-emerald-600';
              msg.innerText = `성공! 현재 화면(일차)에 총 ${matchCount}개의 번호가 매칭되었습니다.`;
              reRender(); 
              updateCountsUI(); 
          } else {
              msg.className = 'text-sm font-medium text-amber-600';
              msg.innerText = '현재 화면에서 조건에 매칭되는 항목이 없습니다.';
          }

      } catch (error) {
          msg.className = 'text-sm font-medium text-red-600';
          msg.innerText = error.message;
      } finally {
          btn.disabled = false;
          btn.innerHTML = `<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg> A, P, L 번호 매칭`;
      }
    }

    document.addEventListener('keydown', function(e) {
      const current = e.target;
      if (current.tagName !== 'TEXTAREA' || !current.hasAttribute('data-focus-id')) return;

      const isUp = e.key === 'ArrowUp'; 
      const isDown = e.key === 'ArrowDown'; 
      const isLeft = e.key === 'ArrowLeft'; 
      const isRight = e.key === 'ArrowRight';
      
      if (!isUp && !isDown && !isLeft && !isRight) return;

      if (isLeft && current.selectionStart > 0) return;
      if (isRight && current.selectionEnd < current.value.length) return;
      if (isUp || isDown) {
          const lines = current.value.substr(0, current.selectionStart).split("\n");
          if(isUp && lines.length > 1) return; 
          if(isDown && lines.length < current.value.split("\n").length) return;
      }
      
      e.preventDefault(); 

      const currentRect = current.getBoundingClientRect();
      const inputs = Array.from(document.querySelectorAll('#tables-container .block textarea:not([type="hidden"]):not([readonly])'));
      
      let bestMatch = null; 
      let minDistance = Infinity;
      const cx = currentRect.left + currentRect.width / 2; 
      const cy = currentRect.top + currentRect.height / 2;

      inputs.forEach(input => {
        if (input === current) return;
        const rect = input.getBoundingClientRect();
        const ix = rect.left + rect.width / 2; 
        const iy = rect.top + rect.height / 2;
        
        let isEligible = false; 
        let distance = Infinity;
        const xOverlap = Math.max(0, Math.min(currentRect.right, rect.right) - Math.max(currentRect.left, rect.left));
        const yOverlap = Math.max(0, Math.min(currentRect.bottom, rect.bottom) - Math.max(currentRect.top, rect.top));

        if (isUp && iy < cy && xOverlap > 0) { isEligible = true; distance = cy - iy; }
        else if (isDown && iy > cy && xOverlap > 0) { isEligible = true; distance = iy - cy; }
        else if (isLeft && ix < cx && yOverlap > 0) { isEligible = true; distance = cx - ix; }
        else if (isRight && ix > cx && yOverlap > 0) { isEligible = true; distance = ix - cx; }

        if (!isEligible) {
             if (isUp && rect.bottom <= currentRect.top + 5) { isEligible = true; distance = (currentRect.top - rect.bottom)*10 + Math.abs(cx - ix); } 
             else if (isDown && rect.top >= currentRect.bottom - 5) { isEligible = true; distance = (rect.top - currentRect.bottom)*10 + Math.abs(cx - ix); } 
             else if (isLeft && rect.right <= currentRect.left + 5) { isEligible = true; distance = (currentRect.left - rect.right)*10 + Math.abs(cy - iy); } 
             else if (isRight && rect.left >= currentRect.right - 5) { isEligible = true; distance = (rect.left - currentRect.right)*10 + Math.abs(cy - iy); }
        }
        
        if (isEligible && distance < minDistance) { 
            minDistance = distance; 
            bestMatch = input; 
        }
      });

      if (bestMatch) {
        bestMatch.focus();
        if (isLeft) bestMatch.setSelectionRange(bestMatch.value.length, bestMatch.value.length);
        else if (isRight) bestMatch.setSelectionRange(0, 0);
        else bestMatch.setSelectionRange(bestMatch.value.length, bestMatch.value.length);

        const scrollContainer = document.getElementById('mainAppContent');
        if (scrollContainer) {
            const matchRect = bestMatch.getBoundingClientRect();
            const containerRect = scrollContainer.getBoundingClientRect();
            
            const bottomThreshold = 250; 
            const topThreshold = 150;    
            
            if (isDown && matchRect.bottom > containerRect.bottom - bottomThreshold) {
                scrollContainer.scrollBy({ top: matchRect.bottom - (containerRect.bottom - bottomThreshold) + 50, behavior: 'smooth' });
            } else if (isUp && matchRect.top < containerRect.top + topThreshold) {
                scrollContainer.scrollBy({ top: matchRect.top - (containerRect.top + topThreshold) - 50, behavior: 'smooth' });
            }
        }
      }
    });

    function duplicateCheckedWorkersDay(day) {
        const checkboxes = document.querySelectorAll(`.worker-checkbox-${day}:checked`);
        if (checkboxes.length === 0) return showToast('복사할 항목을 체크박스로 먼저 선택해주세요.', true);

        const grouped = {};
        checkboxes.forEach(cb => {
            const uName = cb.getAttribute('data-unit');
            const id = Number(cb.value);
            if (!grouped[uName]) grouped[uName] = [];
            grouped[uName].push(id);
        });

        let totalDuplicatedCount = 0;

        Object.keys(grouped).forEach(unitName => {
            const idsToDuplicate = grouped[unitName];
            let currentWorkers = appData.units[unitName];
            
            for (let i = currentWorkers.length - 1; i >= 0; i--) {
                const worker = currentWorkers[i];
                
                if (idsToDuplicate.includes(Number(worker.id))) {
                    let dupCount = 1;
                    if (worker.measurementCount && String(worker.measurementCount).trim() !== '') {
                        const parsed = parseInt(String(worker.measurementCount).replace(/[^0-9]/g, ''), 10);
                        if (!isNaN(parsed) && parsed > 0) {
                            dupCount = parsed - 1;
                        }
                    }

                    let currentMaxId = currentWorkers.length > 0 ? Math.max(...currentWorkers.map(w => Number(w.id))) : 0;
                    
                    for (let k = 0; k < dupCount; k++) {
                        currentMaxId++;
                        const clonedWorker = {
                            ...worker,
                            id: currentMaxId,
                            day: worker.day || 1,
                            pageBreak: false,
                            name: '',
                            isManual: false,
                            harmfulFactors: worker.harmfulFactors.map(factor => ({ ...factor }))
                        };
                        
                        currentWorkers.splice(i + 1 + k, 0, clonedWorker);
                        totalDuplicatedCount++;
                    }
                }
            }
        });

        recalculateNames();
        reRender();
        
        const selectAllCb = document.querySelector(`input[onchange="toggleAllCheckboxesDay(${day}, this.checked)"]`);
        if(selectAllCb) selectAllCb.checked = false;
        
        showToast(`선택하신 항목들이 측정건수에 따라 총 ${totalDuplicatedCount}건 복사되었습니다.`);
    }

        if (checkboxes.length === 0) return showToast('삭제할 항목을 체크박스로 먼저 선택해주세요.', true);
        
        customConfirm(`선택한 ${checkboxes.length}개의 항목을 정말 삭제하시겠습니까?`, () => {

                    margin: 0 !important; 
                    padding: 0 !important; 
                    background-color: white !important;
                    -webkit-print-color-adjust: exact !important; 
                    print-color-adjust: exact !important; 
                    width: 210mm !important;
                    height: 297mm !important;
                }
                #mainAppContent { display: none !important; }
                #labelPrintContainer { 
                    display: block !important; 
                    margin: 0 !important; 
                    padding: 0 !important; 
                    background: white !important;
                }
                .label-page {
                    width: 210mm !important;
                    height: 297mm !important;
                    position: relative !important;
                    page-break-after: always !important;
                    page-break-inside: avoid !important;
                    margin: 0 !important;
                    padding: 0 !important;
                    border: none !important;
                    background: white !important;
                    box-sizing: border-box !important;
                }
                .label-page:last-child {
                    page-break-after: auto !important;
                }
                .label-item {
                    position: absolute !important;
                    width: 30mm !important;
                    height: 9mm !important;
                    box-sizing: border-box !important;
                    border: none !important;
                    display: flex !important;
                    flex-direction: column !important;
                    align-items: center !important;
                    justify-content: center !important;
                    overflow: hidden !important;
                    padding: 0.5mm !important;
                }
            }
            
            .mode-label-print { background-color: #f3f4f6; }
            .label-page-screen {
                width: 210mm;
                height: 297mm;
                position: relative;
                margin: 20px auto;
                background: white;
                box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            }
            .label-item-screen {
                position: absolute;
                width: 30mm;
                height: 9mm;
                box-sizing: border-box;
                border: 0.5px dashed #d1d5db;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                padding: 0.5mm;
            }
        `;

        // 🚀 폼텍 LS-3145 (145칸) 공식 규격 좌표 하드코딩
        const LABELS_PER_PAGE = 145;
        let pagesHtml = '';
        const totalPages = Math.ceil(labels.length / LABELS_PER_PAGE);

        for (let p = 0; p < totalPages; p++) {
            let chunkHtml = '';
            
            for (let i = 0; i < LABELS_PER_PAGE; i++) {
                const dataIndex = p * LABELS_PER_PAGE + i;
                if (dataIndex >= labels.length) break;
                
                const label = labels[dataIndex];
                
                const col = i % 5;
                const row = Math.floor(i / 5);
                
                const leftPos = 25 + (col * 32.5); 
                const topPos = 18 + (row * 9);     

                let bgClass = 'bg-white';
                let textClass = 'text-black';
                
                if (label.type === 'a') { bgClass = 'bg-[#fef9c3]'; textClass = 'text-[#1e3a8a]'; }
                else if (label.type === 'p') { bgClass = 'bg-[#dcfce7]'; textClass = 'text-black'; }
                else if (label.type === 'l') { bgClass = 'bg-[#dbeafe]'; textClass = 'text-[#14532d]'; }

                chunkHtml += `
                    <div class="label-item label-item-screen ${bgClass}" style="left: ${leftPos}mm; top: ${topPos}mm;">
                        <div style="font-size: 6.5px !important; font-weight: 900 !important; color: #000000 !important; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; margin-bottom: 0.5px; letter-spacing: -0.3px;">${label.dept}</div>
                        <div style="font-size: 11px !important; font-weight: 900 !important; letter-spacing: -0.5px;" class="${textClass} leading-none truncate">${label.displayVal}</div>
                    </div>
                `;
            }

            pagesHtml += `
                <div class="label-page label-page-screen">
                    ${chunkHtml}
                </div>
            `;
        }

        const container = document.getElementById('labelPrintContainer');
        container.innerHTML = `
            <div class="w-full text-center mb-0 print:hidden py-4 bg-white border-b shadow-sm sticky top-0 z-50">
                <h2 class="text-xl font-bold mb-1 text-indigo-900">🏷️ 145칸(LS-3145) 세로형 라벨지 인쇄 (총 ${labels.length}장)</h2>
                <p class="text-sm font-bold text-red-600 mb-3">
                    ※ 인쇄 설정(Ctrl+P) 시 [세로 방향]이 자동 선택되어 있는지 확인하시고, [여백: 없음], [배율: 기본설정]으로 출력하세요!
                </p>
                <div class="flex justify-center gap-3">
                    <button onclick="window.print()" class="flex items-center gap-2 bg-rose-600 text-white px-6 py-2 rounded-xl font-bold shadow-md hover:bg-rose-700 transition-transform">
                        인쇄 시작
                    </button>
                    <button onclick="closeLabelPrint()" class="flex items-center gap-2 bg-slate-600 text-white px-6 py-2 rounded-xl font-bold shadow-md hover:bg-slate-700 transition-transform">
                        돌아가기
                    </button>
                </div>
            </div>
            <div class="flex flex-col items-center w-full bg-gray-100 print:bg-white" style="margin: 0; padding: 0;">
                ${pagesHtml}
            </div>
        `;

        document.body.classList.add('mode-label-print');
        document.getElementById('mainAppContent').classList.add('hidden');
        container.classList.remove('hidden');
        window.scrollTo(0, 0);
    }

    function closeLabelPrint() {
        const styleEl = document.getElementById('label-print-style');
        if (styleEl) styleEl.remove();

        document.body.classList.remove('mode-label-print');
        document.getElementById('labelPrintContainer').classList.add('hidden');
        document.getElementById('mainAppContent').classList.remove('hidden');
    }
  </script>
</body>
</html>
